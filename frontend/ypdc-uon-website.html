<script>
/* js/portals/admin.js */
(function () {
  'use strict';
  var PC = window.PC;
  var S = PC.S, A = PC.A, esc = PC.esc, fmt = PC.fmt, I = PC.I, img = PC.img, ini = PC.ini, PP = PC.PP;
  var NAV = PC.NAV, HERO = PC.HERO, QUICK = PC.QUICK, SEC = PC.SEC;
  var heroBlock = PC.heroBlock, stats = PC.stats, quickAccess = PC.quickAccess,
      focusPanel = PC.focusPanel, pageHead = PC.pageHead, table = PC.table,
      statusBadge = PC.statusBadge, pretty = PC.pretty, profileForm = PC.profileForm,
      taskRow = PC.taskRow;
  var SRV = { loading: true, data: null, error: null, audit: [], log: null, logLoaded: false, logLoading: false, logError: null, perm: null, permLoading: false, permError: null, mail: null, mailLoaded: false, mailError: null, ann: null, annLoaded: false, annError: null,
    logQ: { q: '', role: '', action: '', status: '', from: '', to: '', page: 1, perPage: 25 },
    usersQ: { q: '', role: '', state: '', page: 1, perPage: 15 }, usersData: null, usersLoading: false, usersError: null, userOpen: null,
    charts: null, chartsLoading: false, chartsError: null, chartsMonths: 6 };

  function serverStats() {
    var d = SRV.data;
    if (!d) return null;
    return [
      { label: 'Accounts', value: String(d.users.total), sub: d.users.active + ' active accounts' },
      { label: 'New applications', value: String(d.applications.new), sub: d.applications.total + ' total received', style: 'gold' },
      { label: 'Event registrations', value: String(d.events.registrations), sub: d.events.upcoming + ' upcoming events' },
      { label: 'Audit entries', value: String(d.site.auditEntries), sub: 'Every login & write logged' }
    ];
  }

  function peopleTiles() {
    var api = window.YPDC.api;
    if (api && api.available) {
      if (!SRV.data) {
        ensureSummary(api);
        return '<section class="grid g4">' + [0, 1, 2, 3].map(function () {
          return '<div class="stat"><span class="stat-label">Loading\u2026</span>' +
            '<span class="stat-value" style="font-size:1.15rem">\u2026</span>' +
            '<span class="stat-sub">From the SQLite database</span></div>';
        }).join('') + '</section>';
      }
      var d = SRV.data;
      var dirs = S.directorates.length;
      return stats([
        { label: 'Accounts', value: String(d.users.total), sub: d.users.active + ' active' },
        { label: 'Members directory', value: String(S.people.length), sub: 'Records in database', style: 'gold' },
        { label: 'Applications', value: String(d.applications.total), sub: (S.inductionDrive.batch || 'Induction Drive') },
        { label: 'Directorates', value: String(dirs), sub: 'All active' }
      ]);
    }
    var mem = S.people.filter(function (p) { return p.role === 'member' || p.role === 'student'; }).length;
    var vol = S.people.filter(function (p) { return p.post && p.post !== 'General Member'; }).length;
    var cert = S.certificates.length;
    return stats([
      PC.statNum(S.people.length, 'People in directory', mem ? (mem + ' member accounts') : 'Database is empty'),
      PC.statNum(vol, 'Post holders / volunteers', vol ? 'Across directorates' : 'No posts assigned yet', { style: 'gold' }),
      PC.statNum(cert, 'Certificates issued', cert ? 'Verified records' : 'No certificates yet'),
      PC.statNum(S.directorates.length, 'Directorates', 'YPDC structure')
    ]);
  }

  function engagementRows() {
    var api = window.YPDC.api;
    var live = api && api.available;
    if (live && !SRV.data) { ensureSummary(api); return '<p class="mut" style="font-size:.88rem">Loading\u2026</p>'; }
    var names = { student: 'Volunteers', member: 'General Members', directorate: 'Directorate leads', faculty: 'Faculty', alumni: 'Alumni', admin: 'Admins' };
    if (live) {
      var total = SRV.data.users.total || 1;
      return SRV.data.users.byRole.map(function (r) {
        var pct = Math.max(4, Math.round((r.c / total) * 100));
        return barRow(names[r.role] || r.role, r.c + ' (' + Math.round((r.c / total) * 100) + '%)', pct);
      }).join('');
    }
    return '<p class="mut" style="font-size:.88rem">No data yet — the server is not connected. Role counts appear here once the backend is running.</p>';
  }

  function barRow(label, value, pct) {
    return '<div class="bar-row"><div class="top"><span>' + esc(label) + '</span><b>' + esc(String(value)) + '</b></div>' +
      '<div class="bar"><span style="width:' + pct + '%"></span></div></div>';
  }

  function directorateRows() {
    var api = window.YPDC.api;
    if (api && api.available) {
      var tasks = S.tasks || [];
      if (!tasks.length) return '<p class="mut" style="font-size:.88rem">There are no tasks in the database yet.</p>';
      var counts = S.directorates.map(function (d) {
        var mine = tasks.filter(function (t) { return t.directorate === d.name; });
        return { name: d.name, total: mine.length, open: mine.filter(function (t) { return t.status !== 'Completed'; }).length };
      });
      var max = Math.max.apply(null, counts.map(function (c) { return c.total; }).concat([1]));
      return counts.map(function (c) {
        return barRow(c.name, c.total + ' tasks \u00b7 ' + c.open + ' open', Math.round((c.total / max) * 100));
      }).join('');
    }
    return S.directorates.map(function (d) {
      return barRow(d.name, d.activity + '%', d.activity);
    }).join('');
  }

  function fillRate() {
    var evs = S.events || [];
    var cap = evs.reduce(function (a, e) { return a + (Number(e.capacity) || 0); }, 0);
    var reg = evs.reduce(function (a, e) { return a + (Number(e.registered) || 0); }, 0);
    return cap ? Math.round((reg / cap) * 100) : 0;
  }

  function photosPanel() {
    var st = (window.YPDC.state.site && window.YPDC.state.site.photos) || {};
    var heroCustom = App.storedImg(st.hero);
    var logoCustom = App.storedImg(window.YPDC.state.site.logo);
    var up = (st.gallery || []).filter(App.storedImg);
    return '<section class="panel mt-22"><div class="panel-head"><h3>Photos &amp; logo</h3>' +
      '<span class="badge badge-gold">Live on the website</span></div>' +
      '<div class="panel-body">' +
      '<p class="mut" style="font-size:.9rem">Upload pictures from your device — they are saved in the database and appear on the public website immediately.</p>' +
      '<div class="grid g2 mt-16" style="gap:16px">' +
        '<div class="card card-tight" style="border:1px solid var(--line)">' +
          '<div class="flex-between"><b>Homepage hero photo</b>' + (heroCustom ? '<span class="badge badge-ok">Custom</span>' : '<span class="badge badge-line">Design photo</span>') + '</div>' +
          '<img src="' + App.brand('hero', 'hero-campus.jpg') + '" alt="Hero" style="width:100%;height:132px;object-fit:cover;border-radius:10px;margin-top:10px">' +
          '<div class="btn-row mt-16"><button class="btn btn-xs btn-green" data-action="pick-photo" data-kind="hero">' + (heroCustom ? 'Change photo' : 'Upload photo') + '</button>' +
          (heroCustom ? '<button class="btn btn-xs btn-quiet" data-action="reset-photo" data-kind="hero">Remove</button>' : '') + '</div>' +
        '</div>' +
        '<div class="card card-tight" style="border:1px solid var(--line)">' +
          '<div class="flex-between"><b>Website logo</b>' + (logoCustom ? '<span class="badge badge-ok">Custom</span>' : '<span class="badge badge-line">Official logo</span>') + '</div>' +
          '<div style="text-align:center;padding:8px 0"><img src="' + App.logoImg('logo-ypdc.png') + '" alt="Logo" style="height:112px;width:112px;border-radius:50%"></div>' +
          '<div class="btn-row"><button class="btn btn-xs btn-green" data-action="pick-photo" data-kind="logo">' + (logoCustom ? 'Change logo' : 'Upload logo') + '</button>' +
          (logoCustom ? '<button class="btn btn-xs btn-quiet" data-action="reset-photo" data-kind="logo">Reset</button>' : '') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="mt-22"><div class="flex-between"><b>Gallery photos</b>' +
      '<span class="badge badge-line">' + (up.length ? up.length + ' uploaded' : 'design gallery') + '</span></div>' +
      '<div class="gallery mt-10" style="grid-template-columns:repeat(6,1fr)">' + window.App.gallery().slice(0, 12).map(function (src, i) {
        return '<div style="position:relative"><img src="' + src + '" alt="Gallery" style="height:88px;width:100%;object-fit:cover;border-radius:10px">' +
          (up.length ? '<button class="btn btn-xs btn-danger" style="position:absolute;top:4px;right:4px;padding:2px 7px" data-action="remove-gallery" data-index="' + i + '">×</button>' : '') +
          '</div>';
      }).join('') + '</div>' +
      '<div class="btn-row mt-16"><button class="btn btn-xs btn-green" data-action="pick-photo" data-kind="gallery">+ Add gallery photos</button>' +
      (up.length ? '<button class="btn btn-xs btn-quiet" data-action="reset-photo" data-kind="gallery">Use the default gallery</button>' : '') + '</div></div>' +
      '</div></section>';
  }

  function overviewRows() {
    var api = window.YPDC.api;
    var d = SRV.data;
    if (api && api.available) {
      if (!d) {
        ensureSummary(api);
        return [['Server data', 'Loading\u2026', '<span class="badge badge-line">SQLite</span>']];
      }
      return [
        ['Total users', d.users.total, '<span class="badge badge-ok">' + d.users.active + ' active</span>'],
        ['Induction applications', d.applications.total, '<span class="badge badge-info">' + d.applications.new + ' new</span>'],
        ['Event registrations', d.events.registrations, '<span class="badge badge-line">' + d.events.upcoming + ' upcoming events</span>'],
        ['Seats filled', fillRate() + '%', '<span class="badge badge-line">' + (S.events || []).length + ' events</span>'],
        ['Pending approvals', d.applications.new + (d.feedback ? d.feedback.new : 0), '<span class="badge badge-warn">needs review</span>'],
        ['Audit log entries', d.site.auditEntries, '<span class="badge badge-ok">live</span>']
      ];
    }
    var an = S.analytics;
    return [
      ['Total users', an.totalUsers, '<span class="badge badge-line">from the database</span>'],
      ['Active members', an.activeMembers, '<span class="badge badge-line">verified accounts</span>'],
      ['Avg. attendance', an.avgAttendance + '%', '<span class="badge badge-line">from records</span>'],
      ['Pending approvals', an.pendingApprovals, '<span class="badge badge-warn">needs review</span>'],
      ['Induction applications', S.applications.length + ' new', '<span class="badge badge-info">Fall 2026</span>']
    ];
  }

  function analyticsTiles() {
    var api = window.YPDC.api;
    var an = S.analytics;
    if (api && api.available) {
      if (!SRV.data) {
        ensureSummary(api);
        return '<section class="grid g4">' + [0, 1, 2, 3].map(function () {
          return '<div class="stat"><span class="stat-label">Loading\u2026</span>' +
            '<span class="stat-value" style="font-size:1.15rem">\u2026</span>' +
            '<span class="stat-sub">From the SQLite database</span></div>';
        }).join('') + '</section>';
      }
      var d = SRV.data;
      var fill = fillRate();
      return stats([
        { label: 'Total users', value: String(d.users.total), sub: 'All roles' },
        { label: 'Active accounts', value: String(d.users.active), sub: 'Verified', style: 'gold' },
        { label: 'Events', value: String(d.events.total), sub: d.events.upcoming + ' upcoming' },
        { label: 'Seats filled', value: fill + '%', ring: fill, sub: 'Across events' }
      ]);
    }
    return stats([{ label: 'Total users', value: String(an.totalUsers), sub: 'All roles' },
      { label: 'Active members', value: String(an.activeMembers), sub: 'Verified', style: 'gold' },
      { label: 'Events this term', value: String(an.eventsThisTerm), sub: 'Delivered' },
      { label: 'Avg. attendance', value: an.avgAttendance + '%', ring: an.avgAttendance, sub: 'Across events' }]);
  }

  function recentActivity(limit) {
    var api = window.YPDC.api;
    if (api && api.available) {
      if (!SRV.audit || !SRV.audit.length) {
        ensureSummary(api);
        return '<p class="mut" style="font-size:.88rem">Loading\u2026</p>';

                '<button class="btn btn-xs btn-quiet" data-action="popup-preview">Preview</button>'

            '</div></div>';

        '<section class="panel mt-22"><div class="panel-head"><h3>Live preview</h3><a class="btn btn-xs btn-quiet" href="#/">Open public website</a></div>' +
        '<div class="panel-body grid g3">' +
        '<div class="card card-tight" style="background:var(--cream-2)"><span class="stat-label mut">Homepage intro</span><p class="mt-6" style="font-size:.88rem">' + esc(S.site.intro) + '</p></div>' +
        '<div class="card card-tight" style="background:var(--cream-2)"><span class="stat-label mut">Vision</span><p class="mt-6" style="font-size:.88rem">' + esc(S.site.vision) + '</p></div>' +
        '<div class="card card-tight" style="background:var(--cream-2)"><span class="stat-label mut">Contact</span><p class="mt-6" style="font-size:.88rem">' + esc(S.site.contact.email) + '<br>' + esc(S.site.contact.phone) + '</p></div>' +
        '</div></section>';
    },
    cabinet: function () {
      return pageHead('Admin portal', 'Cabinet Editor', 'Admin can edit cabinet information, executive posts and public YPDC information.', '<button class="btn btn-green btn-sm" data-action="add-cabinet">+ Add post</button>') +
        '<section class="grid g23" style="align-items:start"><div class="panel"><div class="panel-head"><h3>Executive posts · ' + esc(S.cabinet.session) + '</h3><span class="badge badge-gold">Admin only</span></div>' +
        '<div class="panel-body" id="cabinet-editor">' + S.cabinet.posts.map(function (p) {
          return '<div class="grid g3" data-post style="gap:12px;align-items:end;margin-bottom:12px">' +
            '<label class="field" style="margin:0"><span>Post title</span><input data-field="title" value="' + esc(p.title) + '"></label>' +
            '<label class="field" style="margin:0"><span>Holder</span><input data-field="holder" value="' + esc(p.holder) + '"></label>' +
            '<label class="field" style="margin:0"><span>Status</span><select data-field="status"><option' + (p.status === 'Active' ? ' selected' : '') + '>Active</option><option' + (p.status === 'Vacant' ? ' selected' : '') + '>Vacant</option></select></label>' +
            '</div>';
        }).join('') + '</div>' +
        '<div class="panel-foot"><button class="btn btn-green" data-action="save-cabinet">Save cabinet information</button>' +
        '<a class="btn btn-outline" href="#/cabinet">Preview public page</a></div></div>' +
        '<aside class="card"><b>Publishing rules</b><ul class="checked-list mt-16"><li style="color:var(--ink)">Cabinet changes apply to the public cabinet page instantly</li><li style="color:var(--ink)">Executive posts marked vacant show a vacancy notice</li><li style="color:var(--ink)">Every change is recorded in the activity log</li></ul>' +
        '<div class="panel-note mt-16">Last cabinet update is logged in Activity Log → "Cabinet information updated".</div></aside></section>';
    },
    highlights: function () {
      return pageHead('Admin portal', 'Highlights & Picks', 'Select which events, activities and opportunities appear on the public highlights page.') +
        (S.highlights.length ? '<section class="grid g3">' + S.highlights.map(function (h) {
          return '<div class="card" style="padding:0;overflow:hidden">' +
            '<div class="media-frame" style="border-radius:0;box-shadow:none;aspect-ratio:16/10"><img src="' + img(h.image) + '" alt="' + esc(h.title) + '"></div>' +
            '<div style="padding:20px">' + statusBadge(h.status) +
            '<h4 class="mt-16">' + esc(h.title) + '</h4>' +
            '<p class="mut mt-10" style="font-size:.88rem">' + esc(h.desc) + '</p>' +
            '<div class="btn-row mt-16">' + (h.status === 'Published'
              ? '<button class="btn btn-xs btn-outline" data-action="highlight-status" data-id="' + h.id + '" data-status="Draft">Move to draft</button>'
              : '<button class="btn btn-xs btn-green" data-action="highlight-status" data-id="' + h.id + '" data-status="Published">Publish</button>') +
            '<a class="btn btn-xs btn-quiet" href="#/highlights">Preview</a></div></div></div>';
        }).join('') + '</section>'
          : PC.emptyNote('No highlights yet', 'Once events/highlights are added, publish them from here.'));
    },
    roles: function () {
      var api = window.YPDC.api;
      if (api && api.available) {
        if (!SRV.perm && window.YPDC.adminPerm) SRV.perm = window.YPDC.adminPerm;
        if (!SRV.perm) { ensurePermissions(api); return pageHead('Admin portal', 'Roles & Permissions', 'Loading permissions from the server\u2026') + '<section class="panel"><div class="panel-body">Loading\u2026</div></section>'; }
        var pm = SRV.perm;
        var roleNames = { student: 'Volunteer', member: 'General Member', directorate: 'Directorate', faculty: 'Faculty', admin: 'Admin', alumni: 'Alumni', guest: 'Guest' };
        var byRole = pm.byRole || {};
        return pageHead('Admin portal', 'Roles & Permissions', 'This matrix comes from the server\'s real role guards — each role shows exactly which collections it may write to.') +
          '<section class="panel"><div class="panel-head"><h3>Role permission matrix</h3><span class="badge badge-gold">Live from server</span></div><div class="panel-body">' +
          table(['Role', 'Collections that can be written', 'Records'], Object.keys(byRole).map(function (r) {
            var list = byRole[r] || [];
            return ['<b>' + esc(roleNames[r] || r) + '</b>',
              (list.length ? list.slice(0, 6).join(', ') + (list.length > 6 ? ' \u2026 +' + (list.length - 6) : '') : '<span class="mut">none (read-only)</span>'),
              String(list.length)];
          })) + '</div><div class="panel-foot"><span class="mut" style="font-size:.84rem">Every write is recorded in the audit log.</span>' +
          '<button class="btn btn-outline btn-sm" data-action="refresh-permissions">Refresh</button></div></section>' +
          '<section class="grid g2 mt-22">' +
          '<div class="card"><b>How this works</b><p class="mut mt-10">The server sets a writer-role for every collection. A role that is not in the list can only read that collection. The matrix comes straight from the server code, so the UI and the backend can never drift apart.</p></div>' +
          '<div class="card card-green"><b style="color:#fff">Security notes</b><ul class="checked-list mt-16"><li>Admin-only routes for user and content management</li><li>Faculty can review but never edit records</li><li>Every approval, edit and status change is logged with time</li></ul></div>' +
          '</section>';
      }
      return pageHead('Admin portal', 'Roles & Permissions', 'Role-based control comes from the server.') +
        '<section class="panel"><div class="panel-body"><b>Server offline</b>' +
        '<p class="mut mt-6" style="font-size:.9rem">The real permission matrix lives inside the server — start the server to see the collections for all 7 roles herengi.</p></div></section>' +
        '<section class="panel mt-22"><div class="panel-head"><h3>Role permission matrix</h3><span class="badge badge-gold">Admin only</span></div><div class="panel-body">' +
        table(['Role', 'Content', 'Approvals', 'Users'], S.roles.map(function (r) {
          return ['<b>' + esc(r.role) + '</b>',
            '<span class="badge ' + (r.content === 'Edit' ? 'badge-ok' : r.content === 'View' ? 'badge-line' : 'badge-info') + '">' + esc(r.content) + '</span>',
            '<span class="badge ' + (/Full|Publish/.test(r.approvals) ? 'badge-ok' : r.approvals === 'None' ? 'badge-line' : 'badge-info') + '">' + esc(r.approvals) + '</span>',
            '<span class="badge ' + (r.users === 'Manage' ? 'badge-ok' : 'badge-line') + '">' + esc(r.users) + '</span>'];
        })) + '</div></section>' +
        '<section class="grid g2 mt-22">' +
        '<div class="card"><b>Why this makes the system stronger</b><p class="mut mt-10">Role-based permissions reduce accidental edits, while the audit history makes important changes traceable. Together with search, notifications, content management and analytics, this gives the YPDC portal a complete institutional workflow.</p></div>' +
        '<div class="card card-green"><b style="color:#fff">Security notes</b><ul class="checked-list mt-16"><li>Admin-only routes for user and content management</li><li>Faculty can review but never edit records</li><li>Every approval, edit and status change is logged with time</li></ul></div>' +
        '</section>';
    },
    log: function () {
      var api = window.YPDC.api;
      if (api && api.available) {
        if (!SRV.log && !SRV.logLoading) loadAudit();
        return logPage();
      }
      return pageHead('Admin portal', 'Activity Log', 'Every login, write and approval is recorded for accountability.') +
        '<section class="panel"><div class="panel-head"><h3>Recorded activity</h3><span class="badge badge-line">' + S.activityLog.length + ' entries</span></div><div class="panel-body">' +
        table(['#', 'Action', 'Details', 'Date', 'Status'], S.activityLog.map(function (l, i) {
          return ['0' + (i + 1), '<b>' + esc(l.text) + '</b>', esc(l.meta), fmt(l.date), statusBadge(l.status)];
        })) + '</div></section>';
    },

    announcements: function () {
      var api = window.YPDC.api;
      if (api && api.available) {
        if (!SRV.annLoaded) {
          SRV.annLoaded = true;
          api.adminAnnouncements().then(function (r) { SRV.ann = r; repaint(); })
            .catch(function (e) { SRV.annError = e.message; repaint(); });
        }
        if (SRV.annError) {
          return pageHead('Admin portal', 'Announcements', 'Send one message to everyone, a role or a directorate.') +
            '<section class="panel"><div class="panel-body"><b style="color:var(--danger)">Announcements not available</b>' +
            '<p class="mut mt-6" style="font-size:.88rem">' + esc(SRV.annError) + '</p></div></section>';
        }
        if (!SRV.ann) {
          return pageHead('Admin portal', 'Announcements', 'Send one message to everyone, a role or a directorate.') +
            '<section class="panel"><div class="panel-body">Loading…</div></section>';
        }
        var a = SRV.ann;
        return pageHead('Admin portal', 'Announcements', 'One message, delivered to the bell of every selected account (table: notifications).') +
          '<section class="grid g23" style="align-items:start">' +
          '<div class="panel"><div class="panel-head"><h3>New announcement</h3><span class="badge badge-gold">Admin only</span></div>' +
          '<div class="panel-body">' +
          '<form data-form="announce">' +
          '<label class="field"><span>Title</span><input name="title" type="text" placeholder="e.g. Volunteer orientation on Friday" required></label>' +
          '<label class="field"><span>Message</span><textarea name="body" rows="4" placeholder="Write the announcement the way members should read it." required></textarea></label>' +
          '<div class="grid g2" style="gap:12px">' +
          '<label class="field"><span>Audience</span><select name="audience">' + a.audiences.map(function (o) {
            return '<option value="' + esc(o.value) + '">' + esc(o.label) + '</option>';
          }).join('') + '</select></label>' +
          '<label class="field"><span>Link they land on (optional)</span><input name="link" type="text" placeholder="#/events"></label>' +
          '</div>' +
          '<label class="flex" style="gap:10px;align-items:center;margin:6px 0 14px"><input type="checkbox" name="email" value="1" style="width:auto"><span style="font-size:.9rem">Also send it as an email (uses the email module + outbox)</span></label>' +
          '<button class="btn btn-green" type="submit">Send announcement</button>' +
          '</form></div></div>' +
          '<aside class="card"><b>Who receives it</b><ul class="checked-list mt-16">' +
          '<li style="color:var(--ink)">Bell notification for every selected account</li>' +
          '<li style="color:var(--ink)">Optional email through the outbox (SMTP ready)</li>' +
          '<li style="color:var(--ink)">Each delivery is written to the audit log</li>' +
          '</ul><div class="panel-note mt-16">Role and directorate lists come straight from the database.</div></aside></section>' +
          '<section class="panel mt-22"><div class="panel-head"><h3>Sent announcements</h3>' +
          '<span class="badge badge-line">' + a.announcements.length + ' shown</span></div><div class="panel-body">' +
          (a.announcements.length ? table(['Title', 'Message', 'Delivered', 'Sent (UTC)', 'Actions'], a.announcements.map(function (x) {
            return [
              '<b>' + esc(x.title) + '</b>',
              esc(x.body || ''),
              '<span class="badge badge-ok">' + x.delivered + ' account(s)</span>',
              (x.at || '').replace('T', ' ').slice(0, 19),
              '<button class="btn btn-xs btn-danger" data-action="del-announcement" data-nid="' + esc(x.id) + '" data-title="' + esc(x.title) + '">Delete for everyone</button>'
            ];
          })) : '<p class="mut">No announcement has been sent yet.</p>') + '</div></section>';
      }

      return pageHead('Admin portal', 'Announcements', 'Send one message to everyone, a role or a directorate.') +
        '<section class="panel"><div class="panel-body">Announcements need the server database. Start the backend and open this page again.</div></section>';
    },

    emails: function () {
      var api = window.YPDC.api;
      if (api && api.available) {
        if (!SRV.mailLoaded) {
          SRV.mailLoaded = true;
          api.adminEmails(80).then(function (r) { SRV.mail = r; repaint(); })
            .catch(function (e) { SRV.mailError = e.message; repaint(); });
        }
        if (SRV.mailError) {
          return pageHead('Admin portal', 'Email Outbox', 'Every email the system sends is recorded here.') +
            '<section class="panel"><div class="panel-body"><b style="color:var(--danger)">Outbox not available</b>' +
            '<p class="mut mt-6" style="font-size:.88rem">' + esc(SRV.mailError) + '</p></div></section>';
        }
        if (!SRV.mail) {
          return pageHead('Admin portal', 'Email Outbox', 'Every email the system sends is recorded here.') +
            '<section class="panel"><div class="panel-body">Loading…</div></section>';
        }
        var m = SRV.mail;
        var mailStatus = m.smtp
          ? '<span class="badge badge-ok">SMTP connected</span>'
          : '<span class="badge badge-gold">No SMTP — emails stay in this outbox</span>';
        return pageHead('Admin portal', 'Email Outbox', 'Every email the system sends is recorded here (table: email_logs).',
          '<button class="btn btn-outline btn-sm" data-action="refresh-emails">Refresh</button>') +
          '<section class="panel mt-16"><div class="panel-head"><h3>Where does mail go?</h3>' + mailStatus + '</div>' +
          '<div class="panel-body"><p class="mut" style="font-size:.9rem">Notifications for sign-up, applications, approvals, event registrations and password resets all pass through one email module. ' +
          (m.smtp
            ? 'SMTP is configured, so mail is delivered straight to the inbox.'
            : 'Add <b>SMTP_HOST</b>, <b>SMTP_USER</b> and <b>SMTP_PASS</b> to <b>backend/server/.env</b> and every message below starts being delivered — nothing else changes.') +
          ' Sender: <b>' + esc(m.from) + '</b>.</p></div></section>' +
          '<section class="panel mt-16"><div class="panel-head"><h3>Recent emails</h3>' +
          '<span class="badge badge-line">' + m.emails.length + ' shown</span></div>' +
          '<div class="panel-body">' + (m.emails.length ? table(['When (UTC)', 'To', 'Subject', 'Template', 'Status'], m.emails.map(function (e) {
            var st = e.status === 'sent' ? '<span class="badge badge-ok">sent</span>'
              : e.status === 'failed' ? '<span class="badge" style="background:#FDECEC;color:var(--danger)">failed</span>'
              : '<span class="badge badge-line">outbox</span>';
            return [
              (e.at || '').replace('T', ' ').slice(0, 19),
              esc(e.to_email),
              '<b>' + esc(e.subject) + '</b>' + (e.body ? '<details class="mt-6"><summary class="mut" style="font-size:.78rem;cursor:pointer">Read the message</summary><pre class="mail-body">' + esc(e.body) + '</pre></details>' : ''),
              esc(e.template || '—'),
              st
            ];
          })) : '<p class="mut">No email has been sent yet from this database.</p>') + '</div></section>';
      }

      return pageHead('Admin portal', 'Email Outbox', 'Every email the system sends is recorded here.') +
        '<section class="panel"><div class="panel-body">The outbox needs the server database. Start the backend and open this page again.</div></section>';
    },

    settings: function () {
      var api = window.YPDC.api;
      return pageHead('Admin portal', 'Settings', 'Portal configuration, notifications and data tools.') +
        '<section class="grid g2">' +
        '<div class="card"><b>Portal configuration</b>' +
        '<p class="mut mt-10" style="font-size:.9rem">These values come from the server config (backend/server/.env and database settings).</p>' +
        '<div class="field mt-16"><span>Portal name</span><input value="' + esc(S.site.name || 'YPDC UON') + '" readonly></div>' +
        '<div class="field"><span>Induction session</span><input value="' + esc(S.cabinet.session || '') + '" readonly></div>' +
        '<div class="field"><span>Site mode</span><input value="' + (api && api.available ? 'Live — server database (' + (api.counts ? (api.counts.users + ' users · ' + api.counts.messages + ' messages · ' + api.counts.applications + ' applications') : 'live') + ')' : 'Offline (server not running)') + '" readonly></div>' +
        '<div class="panel-note mt-16">Notifications and email are controlled by server settings — no toggle here, only the real value.</div></div>' +
        '<div class="card"><b>Data tools</b><p class="mut mt-10" style="font-size:.9rem">All data lives in the server database (SQLite). From here you can refresh the data or take a backup.</p>' +
        '<div class="btn-row mt-16"><button class="btn btn-green btn-sm" data-action="refresh-data">Refresh data</button>' +
        '<button class="btn btn-outline btn-sm" data-action="export-all">Export JSON (backup)</button>' +
        '<button class="btn btn-outline btn-sm" data-action="export-accounts">Export accounts CSV</button></div>' +
        '<div class="panel-note mt-16">Available on the server: ' + (api && api.counts ? Object.keys(api.counts).map(function (k) { return k + ': ' + api.counts[k]; }).join(' · ') : 'offline') + '</div>' +
        '<div class="panel-note mt-10">The website has no "reset" button — whatever is written on the server is the real record.</div></div>' +
        '<div class="card"><b>My account</b><p class="mut mt-10" style="font-size:.9rem">Your own sign-in details. Role and email cannot be changed from this form.</p>' +
        '<div class="mt-16">' + profileForm('admin', [['name'], ['email'], ['phone'], ['program'], ['city']]) + '</div></div>' +
        '</section>';
    }
  };
})();

</script>
<script>
/* js/portals/alumni.js */
(function () {
  'use strict';
  var PC = window.PC;

  var S = PC.S, A = PC.A, esc = PC.esc, fmt = PC.fmt, I = PC.I, img = PC.img, ini = PC.ini, PP = PC.PP;

        }).join('') + '</div></div>' +
        '<div class="panel"><div class="panel-head"><h3>Career opportunities</h3></div><div class="panel-body">' +
        table(['Position', 'Company', 'Type', 'Deadline', 'Status'], S.careers.map(function (c) {

        '</div>';
    },

      return pageHead('Alumni portal', 'Alumni Profile', 'Your alumni identity, accessible to students seeking mentorship.') +
        '<section class="grid g23" style="align-items:start"><div class="panel"><div class="panel-head"><h3>Profile information</h3></div><div class="panel-body">' +
        profileForm('alumni', [['name'], ['email'], ['batch'], ['program'], ['directorate'], ['profession'], ['company'], ['city'], ['phone']]) +
        '</div></div>' +
        '<aside class="card card-green"><div class="flex"><span class="av" style="width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font-family:var(--serif)">' + ini(S.profiles.alumni.name) + '</span>' +
        '<div><b style="color:#fff;display:block">' + esc(S.profiles.alumni.name) + '</b><small style="color:#B9CFC7">' + esc(S.profiles.alumni.batch) + '</small></div></div>' +
        '<hr style="border-color:rgba(255,255,255,.2);margin:18px 0">' +
        '<div style="font-size:.88rem;color:#C6D8D1">' + esc(S.profiles.alumni.profession) + ' at <b style="color:#fff">' + esc(S.profiles.alumni.company) + '</b><br>Mentor status: <b style="color:var(--gold)">Available</b></div>' +
        '<div class="btn-row mt-22"><a class="btn btn-gold btn-sm" href="#/portal/alumni/mentorship">Mentorship</a></div></aside></section>';
    },
    academic: function () {
      var p = S.profiles.alumni;
      return pageHead('Alumni portal', 'Academic Info', 'Your YPDC and academic record as an alumnus.') +
        '<section class="panel"><div class="panel-head"><h3>Academic record</h3><span class="badge badge-gold">' + esc(p.batch) + '</span></div><div class="panel-body">' +
        table(['Field', 'Detail'], [
          ['Degree program', esc(p.program || '—')], ['Batch', esc(p.batch || '—')], ['YPDC directorate', esc(p.directorate || '—')],
          ['Certificates earned', String((S.certificates || []).length) + ' (verified)'],

<script>
/* js/portals/messages.js */
(function () {
  'use strict';
  var PC = window.PC;
  var S = PC.S, A = PC.A, esc = PC.esc, fmt = PC.fmt, I = PC.I, ini = PC.ini;
  var pageHead = PC.pageHead, table = PC.table, statusBadge = PC.statusBadge;

  var M = {
    tab: 'inbox',
    cache: null,
    dir: null,
    error: null,
    openId: null,
    loading: false
  };

  function repaint() {
    if (window.App && window.App.render && location.hash.indexOf('messages') > -1) window.App.render();
  }

  function load(force) {
    var api = window.YPDC.api;
    if (!api || !api.available || M.loading) return;
    if (M.cache && !force) return;
    M.loading = true;
    api.messages().then(function (d) {
      M.cache = d;
      M.error = null;
      api.msgUnread = d.unread;
      M.loading = false;
      repaint();
    }).catch(function (e) {
      M.error = e.message;
      M.loading = false;
      repaint();
    });
  }

  function loadDirectory() {
    var api = window.YPDC.api;
    if (!api || !api.available) return;
    if (M.dir) return;
    api.directory().then(function (d) { M.dir = d.users || []; repaint(); })
      .catch(function () { M.dir = []; repaint(); });
  }

  function when(iso) {
    if (!iso) return '';
    var s = String(iso).replace('T', ' ');
    return s.slice(0, 16);
  }

  function shortBody(text) {
    return String(text || '').replace(/\s+/g, ' ').slice(0, 90);
  }

  function openCompose(toId, replyOf) {
    var api = window.YPDC.api;
    if (!api || !api.available) {
      App.openModal({
        eyebrow: 'Messages', title: 'Backend required',
        sub: 'Messages are saved in the server database. Messaging does not work while the server is offline.',
        body: '<div class="panel-note">Once the server is running: <code>npm start</code></div>',
        foot: '<button class="btn btn-outline" data-action="close-modal">Close</button>'
      });
      return;
    }
    if (!M.dir) {
      App.openModal({
        eyebrow: 'New message', title: 'Loading recipients\u2026',
        sub: 'Fetching the list of YPDC accounts from the server.',
        body: '<div class="panel-note">One moment\u2026</div>',
        foot: '<button class="btn btn-outline" data-action="close-modal">Cancel</button>'
      });
      api.directory().then(function (d) {
        M.dir = d.users || [];
        openCompose(toId, replyOf);
      }).catch(function (e) {
        App.openModal({
          eyebrow: 'New message', title: 'No recipients found',
          sub: e.message || 'The directory could not be loaded.',
          body: '<div class="panel-note">Log in again or refresh the page.</div>',
          foot: '<button class="btn btn-outline" data-action="close-modal">Close</button>'
        });
      });
      return;
    }
    var list = M.dir || [];
    var options = list.map(function (u) {
      return '<option value="' + esc(u.id) + '"' + (u.id === toId ? ' selected' : '') + '>' +
        esc(u.name) + ' — ' + esc(u.role) + (u.directorate ? ' · ' + esc(u.directorate) : '') + '</option>';
    }).join('');
    if (!options) options = '<option value="">(no other account available)</option>';
    App.openModal({
      eyebrow: 'New message',
      title: replyOf ? 'Reply' : 'New message',
      sub: replyOf ? ('Reply → ' + replyOf.from.name) : 'Send a message directly to any YPDC account.',
      body: '<form data-form="compose">' +
        '<label class="field mt-10"><span>Recipient</span><select name="to"' + (replyOf ? ' disabled' : '') + '>' + options + '</select></label>' +
        (replyOf ? '<input type="hidden" name="to" value="' + esc(replyOf.from.id) + '">' : '') +
        '<label class="field"><span>Subject</span><input name="subject" value="' + (replyOf ? 'Re: ' + esc(replyOf.subject) : '') + '" maxlength="120" required></label>' +
        '<label class="field"><span>Message</span><textarea name="body" rows="5" maxlength="4000" required>' + (replyOf ? '\n\n--- ' + esc(replyOf.from.name) + ' wrote: ' + esc(shortBody(replyOf.body)) : '') + '</textarea></label>' +
        '<div id="compose-msg" class="panel-note mt-10">The message is saved in the server database and appears in the recipient\'s inbox.</div>' +
        '</form>',
      foot: '<button class="btn btn-outline" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-green" id="compose-send">Send message ' + I.arrow + '</button>'
    });
  }

  function section() {
    var api = window.YPDC.api;
    if (!api || !api.available) {
      return pageHead('Messages', 'Messages', 'The server must be running for real messaging.') +
        '<section class="panel"><div class="panel-body"><b>Backend is offline</b>' +
        '<p class="mut mt-6" style="font-size:.9rem">Messages are saved in the database. This section works once the server is running ' +
        '(<code>cd backend/server &amp;&amp; npm start</code>).</p></div></section>';
    }

    load(false);

    if (!M.cache && !M.error) {
      return pageHead('Messages', 'Messages', 'Loading\u2026') +
        '<section class="panel"><div class="panel-body">Loading messages from the server\u2026</div></section>';
    }
    if (M.error) {
      return pageHead('Messages', 'Messages', 'Messages could not be loaded.') +
        '<section class="panel"><div class="panel-body"><b style="color:var(--danger)">' + esc(M.error) + '</b>' +
        '<div class="btn-row mt-16"><button class="btn btn-outline btn-sm" data-action="msg-refresh">Try again</button></div></div></section>';
    }

    var d = M.cache;
    var list = M.tab === 'sent' ? d.sent : d.inbox;
    var unread = d.unread || 0;

    var detail = '';
    if (M.openId) {
      var all = d.inbox.concat(d.sent);
      var one = all.filter(function (m) { return m.id === M.openId; })[0];
      if (one) {
        detail = '<section class="panel mt-22" style="border-color:var(--gold-line)">' +
          '<div class="panel-head"><div><span class="eyebrow">' + (one.direction === 'received' ? 'Received' : 'Sent') + '</span>' +
          '<h3 class="mt-6">' + esc(one.subject) + '</h3></div>' + statusBadge(one.read ? 'Read' : 'Unread') + '</div>' +
          '<div class="panel-body">' +
          '<div class="list-row" style="border:0"><span class="av">' + ini(one.direction === 'received' ? one.from.name : one.to.name) + '</span>' +
          '<div class="txt"><b>' + esc(one.direction === 'received' ? one.from.name : one.to.name) + '</b>' +
          '<small>' + esc(one.direction === 'received' ? (one.from.role || '') : 'recipient') + ' · ' + when(one.created_at) + '</small></div></div>' +
          '<p class="mt-16" style="white-space:pre-wrap;color:var(--body)">' + esc(one.body) + '</p>' +
          '<div class="btn-row mt-22">' +
          (one.direction === 'received' ? '<button class="btn btn-green btn-sm" data-action="msg-reply" data-id="' + esc(one.id) + '">Reply</button>' : '') +
          '<button class="btn btn-outline btn-sm" data-action="msg-close">Close</button>' +
          '<button class="btn btn-quiet btn-sm" data-action="msg-delete" data-id="' + esc(one.id) + '">Delete</button>' +
          '</div></div></section>';
      }
    }

    return pageHead('Messages', 'Messages',
        unread ? (unread + ' unread message' + (unread > 1 ? 's' : '')) : 'All messages have been read.',
        '<button class="btn btn-outline btn-sm" data-action="msg-refresh">Refresh</button>' +
        '<button class="btn btn-green btn-sm" data-action="msg-new">+ New message</button>') +
      '<section class="panel"><div class="chip-row mb-16">' +
        '<button class="chip' + (M.tab === 'inbox' ? ' active' : '') + '" data-action="msg-tab" data-tab="inbox">Inbox (' + d.inbox.length + ')</button>' +
        '<button class="chip' + (M.tab === 'sent' ? ' active' : '') + '" data-action="msg-tab" data-tab="sent">Sent (' + d.sent.length + ')</button>' +
      '</div>' +
      '<div class="panel-body" style="padding-top:0">' +
      (list.length
        ? table(['From / To', 'Subject', 'Message', 'When', ''], list.map(function (m) {
            var other = m.direction === 'received' ? m.from : m.to;
            return [
              '<b>' + esc(other.name) + '</b>' + (other.role ? '<div class="mut" style="font-size:.78rem">' + esc(other.role) + '</div>' : ''),
              '<b>' + esc(m.subject) + '</b>',
              '<span class="mut">' + esc(shortBody(m.body)) + '</span>',
              when(m.created_at) + (m.direction === 'received' && !m.read ? ' <span class="badge badge-warn">new</span>' : ''),
              '<button class="btn btn-xs btn-quiet" data-action="msg-open" data-id="' + esc(m.id) + '">Open</button>' +
              '<button class="btn btn-xs btn-danger" data-action="msg-delete" data-id="' + esc(m.id) + '">Delete</button>'
            ];
          }))
        : '<div class="empty-block"><b>No messages yet</b>' +
          '<p class="mut mt-6" style="font-size:.9rem">' + (M.tab === 'sent'
            ? 'You have not sent any messages yet.'
            : 'Your inbox is empty — messages appear here as soon as someone writes to you.') +
          '</p><div class="btn-row mt-16"><button class="btn btn-green btn-sm" data-action="msg-new">+ New message</button></div></div>') +
      '</div></section>' + detail;
  }

  PC.MSG = {
    section: section,
    state: M,
    load: load,
    openCompose: openCompose,
    afterSend: function () { M.cache = null; load(true); }
  };
})();

</script>
<script>
/* js/portals/shell.js */
(function () {
  'use strict';
  var PC = window.PC;
  var S = PC.S, A = PC.A, esc = PC.esc, fmt = PC.fmt, I = PC.I, img = PC.img, ini = PC.ini, PP = PC.PP;
  var NAV = PC.NAV, HERO = PC.HERO, QUICK = PC.QUICK, SEC = PC.SEC;
  var heroBlock = PC.heroBlock, stats = PC.stats, quickAccess = PC.quickAccess,
      focusPanel = PC.focusPanel, pageHead = PC.pageHead, table = PC.table,
      statusBadge = PC.statusBadge, pretty = PC.pretty, profileForm = PC.profileForm,
      taskRow = PC.taskRow;
  function shell(role, section) {
    var nav = (NAV[role] || NAV.student).slice();
    if (!SEC[role]) role = 'student';
    var anon = !S.session;
    if (!anon && !nav.some(function (n) { return n[0] === 'messages'; })) nav.push(['messages', 'Messages']);
    var secFn = section === 'messages' && window.PC.MSG ? window.PC.MSG.section : SEC[role][section];
    if (!secFn) { section = 'dashboard'; secFn = SEC[role].dashboard; }
    var p = S.profiles[role] || {};
    var api = window.YPDC.api;
    var unread = S.notifications.filter(function (n) { return !n.read; }).length + ((api && api.available) ? (api.msgUnread || 0) + (api.notifUnread || 0) : 0);
    var roleLabel = { student: 'VOLUNTEER PORTAL', member: 'GENERAL MEMBER PORTAL', directorate: 'DIRECTORATE PORTAL', faculty: 'FACULTY PORTAL', admin: 'ADMIN PORTAL', alumni: 'ALUMNI PORTAL', guest: 'GUEST / PUBLIC' }[role];

    return '<div class="portal">' +
      '<div class="drawer-mask" id="side-mask" data-action="toggle-sidebar"></div>' +
      '<aside class="side" id="portal-side">' +
      '<div class="side-brand">' + window.App.logoBlock() + '</div>' +

<script>
/* js/animations.js */
(function () {
  'use strict';

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hasIO = typeof IntersectionObserver === 'function';
  function finalText(el) {
    var to = parseFloat(el.getAttribute('data-count'));
    if (!isFinite(to)) return;
    el.textContent = (el.getAttribute('data-prefix') || '') +
      String(to).padStart(parseInt(el.getAttribute('data-pad'), 10) || 1, '0') +
      (el.getAttribute('data-suffix') || '');
    el.setAttribute('data-count-run', '1');
  }
  function revealNow(el, instant) {
    el.classList.add('in');
    if (el.hasAttribute('data-count')) {
      if (instant) finalText(el); else countUp(el, seqDelay(el));
    }
    if (el.classList.contains('ring') && el.hasAttribute('data-p')) {
      el.style.setProperty('--ringp', parseFloat(el.getAttribute('data-p')));
    }
  }
  var SKIP = '.modal, .modal-mask, .drawer, .drawer-mask, .toast-wrap, .search-results, #toasts';

  function decorate(root) {
    root = root || document;

    var sel = [
      '.pbody > .section', '.pbody > .grid', '.pbody > .panel', '.pbody > .phero',
      '.pbody > .stat', '.pbody > .card', '.pbody > .table-wrap',
      'main .section .grid > *', 'main .section > .wrap > .flex-between',
      'main .grid > .card', 'main .grid > .panel', 'main .stat',
      'main .pe-grid > *', 'main .pe-rail > *', 'main .pe-steps > *',
      'main .banner-strip', 'main .media-frame',
      'main .quote-card', 'main .gallery img', 'main .feature-row',
      '.auth-right .auth-card > *', '.auth-left > *',
      '.quick-card', '.welcome-box'
    ].join(',');

    var nodes = [];
    if (root.matches && root.matches(sel)) nodes.push(root);
    Array.prototype.forEach.call(root.querySelectorAll(sel), function (el) {
      if (!el.closest(SKIP)) nodes.push(el);
    });

    nodes.forEach(function (el) {
      if (el.hasAttribute('data-anim')) return;
      var kind = 'up';
      if (el.classList.contains('media-frame') || el.classList.contains('quote-card') || el.closest('.gallery')) kind = 'zoom';
      else if (el.classList.contains('quick-card') || el.classList.contains('welcome-box')) kind = 'right';
      else if (el.classList.contains('phero') || el.classList.contains('banner-strip')) kind = 'fade';
      var i = Array.prototype.indexOf.call(el.parentNode ? el.parentNode.children : [], el);
      el.setAttribute('data-anim', kind);
      el.style.setProperty('--d', Math.min(i, 8) * 70 + 'ms');
    });

    Array.prototype.forEach.call((root.querySelectorAll ? root.querySelectorAll('.bar') : []), function (bar) {
      if (bar.hasAttribute('data-anim')) return;
      var fill = bar.querySelector(':scope > span, :scope > i');
      if (!fill) return;
      var inline = fill.getAttribute('style') || '';
      var m = inline.match(/width\s*:\s*([\d.]+)%/);
      var w = m ? m[1] : (fill.style.width || '0').replace('%', '');
      if (!w) return;
      bar.style.setProperty('--w', w + '%');
      fill.removeAttribute('style');
      bar.setAttribute('data-anim', 'fade');
    });

    Array.prototype.forEach.call((root.querySelectorAll ? root.querySelectorAll('.ring') : []), function (ring) {
      var p = ring.style.getPropertyValue('--p') || ring.getAttribute('data-p');
      if (!p) return;
      p = parseFloat(p);
      ring.style.setProperty('--ringp', 0);
      ring.setAttribute('data-p', p);
      ring.removeAttribute('style');
      ring.style.setProperty('--ringp', 0);
      ring.setAttribute('data-anim', 'zoom');
    });

    Array.prototype.forEach.call((root.querySelectorAll ? root.querySelectorAll('.stat-value, .hero-stats .num, .stat .stat-value') : []), function (el) {
      if (el.hasAttribute('data-count-done')) return;
      var raw = el.textContent.trim();
      var m = raw.match(/^(\D*?)(\d[\d,]*)(\D*)$/);
      if (!m) return;
      var digits = m[2].replace(/,/g, '');
      if (digits.length > 6) return;
      el.setAttribute('data-count-done', '1');
      el.setAttribute('data-count', digits);
      el.setAttribute('data-prefix', m[1]);
      el.setAttribute('data-suffix', m[3]);
      el.setAttribute('data-pad', /^0/.test(m[2]) ? digits.length : 1);
      el.classList.add('count');
      if (!el.hasAttribute('data-anim') && !el.closest(SKIP)) {
        el.setAttribute('data-anim', 'fade');
        el.style.setProperty('--d', '0ms');
      }
    });
  }

  var io = null;
  function observer() {
    if (io) return io;
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        var el = en.target;
        el.classList.add('in');
        if (el.classList.contains('bar')) el.classList.add('in');
        if (el.classList.contains('ring') && el.hasAttribute('data-p')) {
          el.style.setProperty('--ringp', parseFloat(el.getAttribute('data-p')));
        }
        if (el.hasAttribute('data-count')) countUp(el, seqDelay(el));
        io.unobserve(el);
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 });
    return io;
  }

  function countUp(el, delay) {
    if (el.getAttribute('data-count-run')) return;
    el.setAttribute('data-count-run', '1');
    var to = parseFloat(el.getAttribute('data-count'));
    var pre = el.getAttribute('data-prefix') || '';
    var suf = el.getAttribute('data-suffix') || '';
    var pad = parseInt(el.getAttribute('data-pad'), 10) || 1;
    function show(v) { el.textContent = pre + String(v).padStart(pad, '0') + suf; }
    if (reduce || !isFinite(to) || to <= 1) { show(to); return; }
    var from = 1;
    var dur = parseInt(el.getAttribute('data-dur'), 10) || (1000 + Math.min(to, 900));
    var t0 = 0;
    function target() {
      var v = parseFloat(el.getAttribute('data-count'));
      return isFinite(v) ? v : to;
    }
    function frame(now) {
      var t2 = target();
      if (!t0) t0 = now;
      var t = Math.min(1, (now - t0) / dur);
      var e = 1 - Math.pow(1 - t, 3);
      show(Math.round(from + (t2 - from) * e));
      if (t < 1) requestAnimationFrame(frame); else show(t2);
    }
    function start() { requestAnimationFrame(frame); }
    if (delay > 0) { show(from); setTimeout(start, delay); } else start();
  }

  var STAGGER = 520, MAXD = 2600, GROUP = '.hero-stats, .grid, .panel, .card, .stats-strip, .pbody > .section';
  function seqDelay(el) {
    var host = (el.closest && el.closest(GROUP)) || document.body;
    var now = performance.now();
    if (!host.__seqT || now - host.__seqT > 1500) host.__seq = 0;
    var n = host.__seq || 0;
    host.__seq = n + 1; host.__seqT = now;
    return Math.min(n * STAGGER, MAXD);
  }

  function sweep() {
    if (!hasIO || reduce) return;
    var nodes = document.querySelectorAll('[data-anim]:not(.in)');
    var vh = window.innerHeight;
    Array.prototype.forEach.call(nodes, function (el) {
      if (el.closest(SKIP)) { el.classList.add('in'); return; }
      var r = el.getBoundingClientRect();
      if (r.top < vh * 1.2) revealNow(el, r.bottom <= 0);
    });
  }

  function observeAll(root) {
    decorate(root || document);
    var nodes = (root || document).querySelectorAll ? (root || document).querySelectorAll('[data-anim]') : [];
    if (!hasIO || reduce) {
      Array.prototype.forEach.call(nodes, function (el) { if (!el.classList.contains('in')) revealNow(el, true); });
      return;
    }
    Array.prototype.forEach.call(nodes, function (el) {
      if (el.classList.contains('in')) return;
      observer().observe(el);
    });
    clearTimeout(observeAll._t);
    observeAll._t = setTimeout(sweep, 700);
    Array.prototype.forEach.call(nodes, function (el) {
      var r = el.getBoundingClientRect();
      if (r.top >= window.innerHeight * 0.92 || r.bottom <= 0) return;
      if (!el.classList.contains('in')) {
        el.classList.add('in');
        if (el.hasAttribute('data-count')) countUp(el, seqDelay(el));
      }
      if (el.classList.contains('ring') && el.hasAttribute('data-p')) {
        el.style.setProperty('--ringp', parseFloat(el.getAttribute('data-p')));
      }
    });
  }

  function initChrome() {
    var app = document.getElementById('app');

    var prog = document.createElement('div');
    prog.className = 'scroll-progress';
    document.body.appendChild(prog);

    var top = document.createElement('button');
    top.className = 'to-top';
    top.setAttribute('aria-label', 'Back to top');
    top.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
    top.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); });
    document.body.appendChild(top);

    var ticking = false;
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        var h = document.documentElement;
        var max = h.scrollHeight - window.innerHeight;
        var pct = max > 0 ? (h.scrollTop / max) * 100 : 0;
        prog.style.width = pct + '%';
        top.classList.toggle('show', h.scrollTop > 700);
        var hdr = document.querySelector('.site-header') || document.querySelector('.ptop');
        if (hdr) hdr.classList.toggle('scrolled', h.scrollTop > 12);
        sweep();
        ticking = false;
      });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    onScroll();

    window.addEventListener('hashchange', function () { setTimeout(function () { observeAll(document); sweep(); onScroll(); }, 30); });

    if (window.MutationObserver && app) {
      var mo = new MutationObserver(function (muts) {
        var added = false;
        muts.forEach(function (m) { if (m.addedNodes && m.addedNodes.length) added = true; });
        if (added) { observeAll(document); sweep(); }
      });
      mo.observe(app, { childList: true, subtree: true });
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    observeAll(document);
    initChrome();
  });
  if (document.readyState !== 'loading') {
    observeAll(document);
    initChrome();
  }

  window.Anim = { observe: observeAll, sweep: sweep, reduce: reduce };
})();

</script>

      id: 'faculty', keys: ['faculty', 'teacher', 'adviser', 'advisor', 'staff', 'department head', 'ustad'],
      reply: function () {
        var f = S().people.filter(function (p) { return /faculty|advis/i.test(p.type || '') || /Faculty/i.test(p.type || ''); });
        return {
          text: 'Faculty members provide oversight for YPDC — proposal review, approvals and reports.' +
            (f.length ? '<br>' + list(f.slice(0, 4).map(function (p) { return '<b>' + esc(p.name) + '</b> — ' + esc(p.post || p.type); })) : ''),
          actions: [go('Faculty portal', '#/login?role=faculty')]
        };
      }
    },
    {
      id: 'contact', keys: ['contact', 'email', 'phone', 'number', 'address', 'office', 'location', 'kahan', 'timing', 'hours', 'reach', 'rabta'],
      reply: function () {
        var c = S().site.contact;
        return {
          text: '<b>Contact YPDC UON</b><br>' +
            list(['📧 <b>Email:</b> ' + esc(c.email), '☎️ <b>Phone:</b> ' + esc(c.phone), '📍 <b>Office:</b> ' + esc(c.office), '🕘 <b>Hours:</b> ' + esc(c.hours)]),
          actions: [go('Contact page', '#/contact'), { label: 'Feedback form', href: '#/feedback' }]
        };
      }
    },
    {
      id: 'fees', keys: ['fee', 'fees', 'dues', 'cost', 'charge', 'paid', 'free', 'paisa', 'kitna paisa', 'kharcha'],
      reply: function () {
        return {
          text: 'YPDC membership is <b>free for students</b> — no joining fee and no monthly dues. Events are free too because they are campus-based; only off-campus trips involve a shared cost (stated on the event page).',
          actions: [go('Membership', '#/membership')]
        };
      }
    },
    {
      id: 'news', keys: ['news', 'update', 'announcement', 'latest', 'khabar', 'new'],
      reply: function () {
        var n = (S().news || []).slice(0, 3);
        return {
          text: n.length ? 'Latest news:<br>' + list(n.map(function (x) { return '<b>' + esc(x.title) + '</b> — ' + fmt(x.date); })) : 'The news section will be updated soon.',
          actions: [go('News page', '#/news')]
        };
      }
    },
    {
      id: 'achievements', keys: ['achievement', 'award', 'recognition', 'winner', 'honor', 'inaam', 'result'],
      reply: function () {
        var a = (S().achievements || []).slice(0, 4);
        return {
          text: a.length ? 'YPDC achievements:<br>' + list(a.map(function (x) { return '<b>' + esc(x.title) + '</b> — ' + esc(x.meta || x.detail || ''); })) : 'Achievements page dekhein.',
          actions: [go('Achievements', '#/achievements')]
        };
      }
    },
    {
      id: 'feedback', keys: ['feedback', 'suggestion', 'complaint', 'review', 'comment', 'shikayat', 'issue', 'problem'],
      reply: function () {
        return {
          text: 'Feedback is always welcome — suggestions go to the admin dashboard where the team replies.<br>You can send it from the <b>Feedback / Comments</b> section in the Volunteer Portal or the public feedback page.',
          actions: [go('Give feedback', '#/feedback'), go('Contact team', '#/contact')]
        };
      }
    },
    {
      id: 'me', keys: ['my registration', 'am i registered', 'my events', 'meri registration', 'my certificates', 'my attendance'],
      reply: function () {
        var st = S(), sess = st.session;
        if (!sess) {
          return {
            text: 'You are not logged in right now. Open Portal Login and sign in to your role — then I can show your registrations, attendance and certificates.',
            actions: [go('Portal Login', '#/login')]
          };
        }
        var role = String(sess.role).toLowerCase();
        if (role === 'student') {
          var regs = st.registrations.filter(function (r) { return r.email === st.profiles.student.email; });
          return {
            text: '<b>' + esc(st.profiles.student.name) + '</b> (Volunteer)<br>' +
              list(['Registered events: <b>' + regs.length + '</b>', 'Attendance: <b>' + attLine() + '</b>', 'Certificates: <b>' + st.certificates.length + '</b>']),
            actions: [go('My dashboard', '#/portal/student/dashboard')]
          };
        }
        return {
          text: 'You are in the <b>' + esc(sess.role) + '</b> workspace. Open your dashboard, tasks or reports from the sidebar.',
          actions: [go('My dashboard', '#/portal/' + role + '/dashboard')]
        };
      }
    },
    {
      id: 'help', keys: ['help', 'what can you do', 'options', 'menu', 'guide', 'madad', 'kya kar sakte'],
      reply: function () {
        return {
          text: 'I can help with these:<br>' +
            list(['Upcoming events and their details', 'Membership / induction process', 'How the 7 directorates work', 'Portal login (7 roles)', 'Certificates, attendance, volunteer hours', 'Contact details and feedback']),
          actions: [go('Upcoming events', 'ask:upcoming events'), go('How to join?', 'ask:how to join'), go('Contact', 'ask:contact details')]
        };
      }
    },
    {
      id: 'thanks', keys: ['thanks', 'thank you', 'shukriya', 'thanx', 'jazak', 'great', 'nice'],
      reply: function () { return { text: 'Goodbye! 🌿 I am here whenever you need anything else.' }; }
    },
    {
      id: 'bye', keys: ['bye', 'goodbye', 'khuda hafiz', 'see you', 'allah hafiz'],
      reply: function () { return { text: 'Goodbye! Thank you for staying connected with YPDC UON. 💚' }; }
    }
  ];

  var FALLBACK = {
    text: 'I could not find an exact answer 🤔 — but I can help with these:<br>' +
      list(['Upcoming events', 'Membership / induction', 'Directorates', 'Portal login help', 'Contact details']),
    actions: [go('Upcoming events', 'ask:upcoming events'), go('How to join?', 'ask:how to join'),
              go('Contact', 'ask:contact details'), go('Talk to team', '#/contact')]
  };

  function normalise(q) {
    return ' ' + String(q || '').toLowerCase().replace(/[^a-z0-9\s\u0600-\u06FF]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
  }
  function scoreIntent(intent, q) {
    var score = 0;
    intent.keys.forEach(function (k) {
      var key = k.toLowerCase();
      if (key.indexOf(' ') > -1) {
        if (q.indexOf(' ' + key + ' ') > -1) score += 3 + key.split(' ').length;
      } else {
        var re = new RegExp('\\b' + key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b');
        if (re.test(q)) score += key.length > 5 ? 2 : 1;
      }
    });
    return score;
  }
  function matchEvent(q) {
    var best = null, bestScore = 0;
    S().events.forEach(function (e) {
      var words = String(e.title).toLowerCase().split(' ');
      var hit = words.filter(function (w) { return w.length > 3 && q.indexOf(' ' + w) > -1; }).length;
      if (hit > bestScore) { bestScore = hit; best = e; }
    });
    return bestScore >= 2 ? best : null;
  }
  function answer(raw) {
    var q = normalise(raw);
    var ev = matchEvent(q);
    if (ev) {
      return {
        text: '<b>' + esc(ev.title) + '</b><br>' +
          list(['📅 ' + fmt(ev.date) + ' · ' + esc(ev.time), '📍 ' + esc(ev.venue || ev.location || ''),
                '🏷 ' + esc(ev.category) + ' · by ' + esc(ev.organizer),
                '👥 ' + ev.registered + ' / ' + ev.capacity + ' seats filled', esc(ev.desc || '')]),
        actions: [go('Event details', '#/event/' + ev.id), go('All events', '#/events')]
      };
    }
    var best = null, bestScore = 0;
    INTENTS.forEach(function (it) {
      var s = scoreIntent(it, q);
      if (s > bestScore) { bestScore = s; best = it; }
    });
    if (!best || bestScore === 0) return FALLBACK;
    return best.reply(q);
  }

  function cfg() {
    try { return JSON.parse(localStorage.getItem(CFG_KEY) || '{}') || {}; } catch (e) { return {}; }
  }
  function saveCfg(c) { try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch (e) {} }
  function aiReady() { var c = cfg(); return !!(c.enabled && c.key && c.endpoint); }

  function siteContext() {
    var s = S().site, d = S().directorates, e = upcoming(4);
    return 'YPDC UON = Young Peace & Development Corps, University of Narowal (student-led corps).\n' +
      'Tagline: ' + s.tagline + '\nVision: ' + s.vision + '\nContact: ' + s.contact.email + ', ' + s.contact.phone + ', ' + s.contact.office + '\n' +
      'Directorates: ' + d.map(function (x) { return x.name; }).join(', ') + '\n' +
      'Upcoming events: ' + e.map(function (x) { return x.title + ' (' + fmt(x.date) + ', ' + x.location + ')'; }).join('; ') + '\n' +
      'Site pages: #/ #/about #/directorates #/cabinet #/events #/news #/achievements #/membership #/induction #/feedback #/contact and #/portal/<role>/<section>.';
  }
  function askAI(history) {
    var c = cfg();
    var msgs = [{ role: 'system', content: 'You are the YPDC UON website assistant. Answer in English, max 90 words, friendly and factual. Use only this site data:\n' + siteContext() }]
      .concat(history.slice(-6));
    return fetch(c.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.key },
      body: JSON.stringify({ model: c.model || 'gpt-4o-mini', messages: msgs, temperature: 0.3, max_tokens: 320 })
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (j) {
      var txt = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
      if (!txt) throw new Error('empty response');
      return String(txt).trim();
    });
  }

  var ICON = {
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-8 8H8l-5 3 1.4-4.6A8 8 0 1 1 21 12Z"/><circle cx="9" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="12.5" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="16" cy="12" r="1.1" fill="currentColor" stroke="none"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg>',
    reset: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>',
    send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-3.2-6.6L4 12Z"/></svg>'
  };
  var CHIPS = [
    ['Upcoming events', 'ask:upcoming events'],
    ['How to join?', 'ask:how to join'],
    ['Directorates', 'ask:directorates'],
    ['Portal login', 'ask:portal login'],
    ['Contact', 'ask:contact details'],
    ['Fees?', 'ask:is there any fee']
  ];

  var log = [];
  var el = {};
  var busy = false;

  function loadLog() {
    try {
      var saved = JSON.parse(sessionStorage.getItem(LOG_KEY) || 'null');
      if (saved && saved.length) log = saved;
    } catch (e) {}
  }
  function saveLog() {
    try { sessionStorage.setItem(LOG_KEY, JSON.stringify(log.slice(-24))); } catch (e) {}
  }

  function msgHTML(m) {
    var acts = (m.actions || []).map(function (a) {
      var val = typeof a.href === 'string' ? a.href : '';
      if (a.href && a.href.settings) return '<button type="button" data-chat-settings="1">' + esc(a.label) + '</button>';
      if (val.indexOf('ask:') === 0) return '<button type="button" data-chat-ask="' + esc(val.slice(4)) + '">' + esc(a.label) + '</button>';
      return '<a href="' + esc(val) + '" data-chat-go="' + esc(val) + '">' + esc(a.label) + '</a>';
    }).join('');
    return '<div class="msg ' + (m.role === 'me' ? 'me' : 'bot') + '">' +
      '<span class="av">' + (m.role === 'me' ? 'You' : 'Y') + '</span>' +
      '<div class="bubble">' + m.text +
      (acts ? '<div class="chat-acts">' + acts + '</div>' : '') +
      '<time>' + esc(m.time || now()) + '</time></div></div>';
  }
  function paint() {
    el.log.innerHTML = log.map(msgHTML).join('');
    el.log.scrollTop = el.log.scrollHeight;
  }
  function push(role, text, actions) {
    log.push({ role: role, text: text, actions: actions || [], time: now() });
    saveLog();
    paint();
  }
  function typing(on) {
    var t = el.log.querySelector('.msg.typing-wrap');
    if (on && !t) {
      el.log.insertAdjacentHTML('beforeend', '<div class="msg bot typing-wrap"><span class="av">Y</span><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div></div>');
      el.log.scrollTop = el.log.scrollHeight;
    } else if (!on && t) { t.remove(); }
  }

  function respond(userText) {
    if (busy) return;
    busy = true;
    push('me', esc(userText));
    typing(true);
    var delay = 380 + Math.min(700, userText.length * 14);

    var finish = function (text, actions) {
      typing(false);
      push('bot', text, actions);
      busy = false;
    };

    if (aiReady()) {
      var history = log.filter(function (m) { return m.role === 'me' || m.role === 'bot'; })
        .map(function (m) {
          return { role: m.role === 'me' ? 'user' : 'assistant', content: String(m.text).replace(/<[^>]+>/g, ' ') };
        });
      askAI(history).then(function (txt) {
        setTimeout(function () { finish(esc(txt).replace(/\n/g, '<br>')); }, Math.min(delay, 500));
      }).catch(function (err) {
        var local = answer(userText);
        setTimeout(function () {
          finish('<i>No answer from AI mode (' + esc(err.message) + ') — from the local assistant:</i><br><br>' + local.text, local.actions);
        }, 300);
      });
      return;
    }
    setTimeout(function () {
      var a = answer(userText);
      finish(a.text, a.actions);
    }, delay);
  }

  function open() {
    el.panel.classList.add('open');
    el.launcher.classList.add('hidden');
    if (!log.length) {
      push('bot', 'Hello! 👋 I am the <b>YPDC UON Assistant</b>.<br>Events, membership, directorates or portal login — what would you like to know?',
        [go('Upcoming events', 'ask:upcoming events'), go('How to join?', 'ask:how to join'), go('Contact', 'ask:contact details')]);
    }
    setTimeout(function () { if (el.input) el.input.focus(); }, 180);
  }
  function close() {
    el.panel.classList.remove('open');
    el.launcher.classList.remove('hidden');
    el.settings.classList.remove('open');
  }
  function toggle() { el.panel.classList.contains('open') ? close() : open(); }

  function fillSettings() {
    var c = cfg();
    el.sEnabled.checked = !!c.enabled;
    el.sKey.value = c.key || '';
    el.sModel.value = c.model || 'gpt-4o-mini';
    el.sEndpoint.value = c.endpoint || 'https://api.openai.com/v1/chat/completions';
  }
  function readSettings() {
    saveCfg({
      enabled: el.sEnabled.checked,
      key: el.sKey.value.trim(),
      model: el.sModel.value.trim() || 'gpt-4o-mini',
      endpoint: el.sEndpoint.value.trim() || 'https://api.openai.com/v1/chat/completions'
    });
  }

  function build() {
    var wrap = document.createElement('div');
    wrap.className = 'chat-root';
    wrap.innerHTML =
      '<button class="chat-launcher" type="button" aria-label="Open YPDC assistant">' + ICON.chat + '<span class="chat-dot"></span></button>' +
      '<section class="chat-panel" role="dialog" aria-label="YPDC assistant">' +
        '<header class="chat-head">' +
          '<span class="chat-avatar"><img src="' + App.img('logo-ypdc-mark.png') + '" alt="YPDC"></span>' +
          '<span class="chat-who"><b>YPDC Assistant</b><small><i></i> Online</small></span>' +
          '<button class="ch-ico" type="button" data-chat="settings" title="Assistant settings" aria-label="Settings">' + ICON.gear + '</button>' +
          '<button class="ch-ico" type="button" data-chat="reset" title="New chat" aria-label="New chat">' + ICON.reset + '</button>' +
          '<button class="ch-ico" type="button" data-chat="close" title="Close" aria-label="Close chat">' + ICON.close + '</button>' +
        '</header>' +
        '<div class="chat-log" id="chat-log" aria-live="polite"></div>' +
        '<div class="chat-chips">' + CHIPS.map(function (c) {
          return '<button type="button" data-chat-ask="' + esc(c[1].slice(4)) + '">' + esc(c[0]) + '</button>';
        }).join('') + '</div>' +
        '<form class="chat-form" autocomplete="off">' +
          '<input type="text" placeholder="Type your question…" aria-label="Message">' +
          '<button class="ch-send" type="submit" aria-label="Send">' + ICON.send + '</button>' +
        '</form>' +
        '<p class="chat-note">Answers come from this site\'s own data. For <b>AI mode</b>, add your API key from ⚙️ Settings.</p>' +
        '<div class="chat-settings">' +
          '<h5>Assistant settings</h5>' +
          '<p>Default: <b>offline assistant</b> (site data, no key needed). For real AI answers, add your own key below — the key is saved only in your browser.</p>' +
          '<label>AI mode (use API key)</label>' +
          '<label class="sw-row" style="display:flex;align-items:center;gap:9px;font-weight:600;font-size:12.5px">' +
            '<input type="checkbox" id="chat-ai-enabled" style="width:auto;height:auto"> <span>Enable real AI answers</span></label>' +
          '<label for="chat-ai-key">API key</label>' +
          '<input type="password" id="chat-ai-key" placeholder="sk-...">' +
          '<label for="chat-ai-model">Model</label>' +
          '<input type="text" id="chat-ai-model" placeholder="gpt-4o-mini">' +
          '<label for="chat-ai-endpoint">Endpoint</label>' +
          '<input type="text" id="chat-ai-endpoint" placeholder="https://api.openai.com/v1/chat/completions">' +
          '<div class="row"><button class="btn btn-green btn-sm" type="button" data-chat="save-settings">Save</button>' +
          '<button class="btn btn-outline btn-sm" type="button" data-chat="close-settings">Cancel</button></div>' +
          '<div class="hintbox" style="margin-top:14px"><b>Note:</b> this key is saved only in your browser. In production it is better to route it through the backend.</div>' +
        '</div>' +
      '</section>';
    document.body.appendChild(wrap);

    el.root = wrap;
    el.launcher = wrap.querySelector('.chat-launcher');
    el.panel = wrap.querySelector('.chat-panel');
    el.log = wrap.querySelector('.chat-log');
    el.form = wrap.querySelector('.chat-form');
    el.input = wrap.querySelector('.chat-form input');
    el.settings = wrap.querySelector('.chat-settings');
    el.sEnabled = wrap.querySelector('#chat-ai-enabled');
    el.sKey = wrap.querySelector('#chat-ai-key');
    el.sModel = wrap.querySelector('#chat-ai-model');
    el.sEndpoint = wrap.querySelector('#chat-ai-endpoint');
    fillSettings();
  }

  function bind() {
    el.launcher.addEventListener('click', open);
    el.form.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = el.input.value.trim();
      if (!v) return;
      el.input.value = '';
      respond(v);
    });
    el.root.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-chat],[data-chat-ask],[data-chat-go],[data-chat-settings]') : null;
      if (!t) return;
      if (t.hasAttribute('data-chat-ask')) { respond(t.getAttribute('data-chat-ask')); return; }
      if (t.hasAttribute('data-chat-settings')) { el.settings.classList.add('open'); return; }
      if (t.hasAttribute('data-chat-go')) {
        e.preventDefault();
        var href = t.getAttribute('data-chat-go');
        close();
        if (href) { location.hash = href; if (App.render) App.render(); }
        return;
      }
      switch (t.getAttribute('data-chat')) {
        case 'close': close(); break;
        case 'reset':
          log = []; saveLog(); paint();
          push('bot', 'New chat started! 🌿 What would you like to know?', [go('Upcoming events', 'ask:upcoming events'), go('How to join?', 'ask:how to join')]);
          break;
        case 'settings': el.settings.classList.add('open'); break;
        case 'close-settings': el.settings.classList.remove('open'); break;
        case 'save-settings':
          readSettings();
          el.settings.classList.remove('open');
          push('bot', aiReady()
            ? 'AI mode is <b>on</b> — answers will now come from your API model. 🤖'
            : 'Settings saved — <b>offline assistant mode</b> is running (no API key).');
          break;
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && el.panel.classList.contains('open')) close();
    });
  }

  function boot() {
    build();
    bind();
    loadLog();
    if (log.length) paint();
    window.Chatbot = {
      open: open, close: close, toggle: toggle,
      ask: function (q) { respond(q); },
      answer: answer,
      intents: INTENTS,
      clear: function () { log = []; saveLog(); paint(); }
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>

<script>
/* js/api.js */
(function () {
  'use strict';

  var App = window.App || (window.App = {});
  var Y = window.YPDC || (window.YPDC = {});

  function cookie(name) {
    var m = document.cookie.match(new RegExp('(^|;\\s*)' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[2]) : '';
  }

  var CSRF_COOKIE = 'ypdc_csrf';

  var hasFetch = (typeof window.fetch === 'function') && (typeof window.Promise === 'function')
    && location.protocol !== 'file:';

  function qs(o) {
    return Object.keys(o).filter(function (k) { return o[k] !== undefined && o[k] !== null && o[k] !== ''; })
      .map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(o[k]); }).join('&');
  }

  function req(path, opts) {
    if (!hasFetch) return Promise.reject(new Error('fetch not available'));
    opts = opts || {};
    var headers = { 'Content-Type': 'application/json' };
    var csrf = cookie(CSRF_COOKIE);
    if (csrf && (opts.method || 'GET') !== 'GET') headers['X-YPDC-CSRF'] = csrf;

    return fetch(path, {
      method: opts.method || 'GET',
      headers: headers,
      credentials: 'same-origin',
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok && res.status !== 207) {
          var err = new Error(data.error || ('Request fail (' + res.status + ')'));
          err.status = res.status;
          err.data = data;
          throw err;
        }
        return data;
      });
    });
  }

  var api = {
    available: false,
    counts: null,
    checked: false,
    user: null,
    role: null,
    snapshot: null,
    lastSave: null,
    error: null,

    detect: function () {
      var self = this;
      if (self.checked) return Promise.resolve(self.available);
      self.checked = true;
      if (!hasFetch) { self.available = false; Y.apiMode = false; return Promise.resolve(false); }
      return req('/api/healthz').then(function (h) {
        self.available = !!(h && h.ok);
        self.counts = h.counts || h.database || null;
        Y.apiMode = self.available;
        return self.available;
      }).catch(function () {
        self.available = false;
        Y.apiMode = false;
        return false;
      });
    },

    publicSite: function () { return req('/api/public/site'); },

    refreshCounts: function () {
      if (!api.available) return Promise.resolve(api.counts);
      return req('/api/healthz').then(function (h) {
        api.counts = h.database || null;
        return api.counts;
      }).catch(function () { return api.counts; });
    },

    me: function () {
      return req('/api/auth/me').then(function (r) {
        api.user = r.user; api.role = r.user ? r.user.role : null;
        return r;
      }).catch(function () { return { user: null }; });
    },

    login: function (email, password, role) {
