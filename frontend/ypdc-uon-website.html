        title: d.title, date: d.date, time: d.time, venue: d.location, location: d.location,
        category: d.category || 'General', organizer: d.organizer || 'YPDC UON', directorate: d.directorate,
        capacity: Number(d.capacity || 100), status: d.status || 'Upcoming', featured: false, registered: 0,
        desc: d.desc || 'YPDC UON activity — details will be shared with registered participants.',
        image: 'summit-hall.jpg'
      });
      closeModal(); toast('Event published — it is on the calendar now', true); render();
    });
  }

  function openEditEventModal(id) {
    var e = S.events.filter(function (x) { return x.id === id; })[0];
    if (!e) return;
    openModal({
      eyebrow: 'Admin · Events', title: 'Edit event', sub: e.title,
      body: '<form id="event-edit"><div class="form-grid">' +
        '<label class="field full"><span>Title</span><input name="title" value="' + esc(e.title) + '"></label>' +
        '<label class="field"><span>Date</span><input name="date" type="date" value="' + e.date + '"></label>' +
        '<label class="field"><span>Time</span><input name="time" value="' + esc(e.time) + '"></label>' +
        '<label class="field"><span>Location</span><input name="location" value="' + esc(e.venue || e.location || '') + '"></label>' +
        '<label class="field"><span>Category</span><input name="category" value="' + esc(e.category || 'General') + '"></label>' +
        '<label class="field"><span>Capacity</span><input name="capacity" type="number" value="' + (e.capacity || 0) + '"></label>' +
        '<label class="field"><span>Directorate</span><select name="directorate">' + S.directorates.map(function (d) {
          return '<option' + ((e.directorate || '') === d.name ? ' selected' : '') + '>' + esc(d.name) + '</option>';
        }).join('') + '</select></label>' +
        '<label class="field"><span>Status</span><select name="status"><option' + (e.status === 'Upcoming' ? ' selected' : '') + '>Upcoming</option><option' + (e.status === 'Completed' ? ' selected' : '') + '>Completed</option></select></label>' +
        '<label class="field full"><span>Description</span><textarea name="desc">' + esc(e.desc || '') + '</textarea></label>' +
        '</div></form>',
      foot: '<button class="btn btn-outline" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-green" id="event-update">Save changes</button>'
    });
    $('#event-update').addEventListener('click', function () {
      var d = {}; $$('input,select,textarea', $('#event-edit')).forEach(function (el) { if (el.name) d[el.name] = el.value; });
      A.updateEvent(e.id, {
        title: d.title, date: d.date, time: d.time, venue: d.location, location: d.location,
        category: d.category, directorate: d.directorate, capacity: Number(d.capacity),
        status: d.status, desc: d.desc
      });
      closeModal(); toast('Event updated — calendar and public page follow', true); render();
    });
  }

  /* Batch F — event detail (calendar + agenda se) */
  function openEventDetailModal(id) {
    var e = S.events.filter(function (x) { return x.id === id; })[0];
    if (!e) { toast('This event is no longer available'); return; }
    var api = window.YPDC.api;
    var u = (api && api.user) || (S.session || {});
    var loggedIn = !!(api && api.available && u && u.id);
    var reg = (S.registrations || []).filter(function (r) { return r.eventId === e.id && (r.email === u.email || r.userId === u.id); })[0];
    var regCount = Number(e.registered) || 0;
    var cap = Number(e.capacity) || 0;
    var left = Math.max(0, cap - regCount);
    var isAdmin = (u.role || '').toLowerCase() === 'admin';
    var open = e.status === 'Upcoming' && (!cap || left > 0);

    var statusBadgeHtml = reg
      ? '<span class="badge badge-ok">You are registered</span>'
      : open ? '<span class="badge badge-gold">Registration open</span>'
      : '<span class="badge badge-line">' + (e.status === 'Completed' ? 'Event completed' : 'Seats full') + '</span>';

    var body = '<div class="panel-note">' + statusBadgeHtml +
      ' <b>' + regCount + '</b> registered' + (cap ? ' of ' + cap + ' seats · ' + left + ' left' : ' · open entry') + '</div>' +
      '<div class="grid g2 mt-16">' +
      [['Date', fmtDate(e.date)], ['Time', esc(e.time || '\u2014')], ['Venue', esc(e.venue || e.location || '\u2014')], ['Category', esc(e.category || 'General')],
       ['Organized by', esc(e.organizer || 'YPDC UON')], ['Directorate', esc(e.directorate || '\u2014')]]
        .map(function (x) { return '<div class="card card-tight"><span class="stat-label mut">' + x[0] + '</span><b style="display:block">' + x[1] + '</b></div>'; }).join('') +
      '</div>' +
      (e.desc ? '<p class="mt-16" style="font-size:.92rem">' + esc(e.desc) + '</p>' : '') +
      (reg ? '<div class="panel-note mt-16">Your registration is confirmed. Bring your student card to the venue; attendance is marked by the organisers.</div>' : '') +
      '<div class="btn-row mt-16">' +
      (isAdmin ? '<button class="btn btn-outline btn-sm" data-action="edit-event" data-id="' + esc(e.id) + '">Edit event</button>' +
                 '<button class="btn btn-danger btn-sm" data-action="del-event" data-id="' + esc(e.id) + '" data-title="' + esc(e.title) + '">Delete event</button>' : '') +
      '<a class="btn btn-quiet btn-sm" href="#/event/' + esc(e.id) + '">Open full page</a>' +
      (loggedIn ? (reg
        ? '<button class="btn btn-danger btn-sm" data-action="cancel-registration" data-id="' + esc(reg.id) + '">Cancel my registration</button>'
        : (open ? '<button class="btn btn-green btn-sm" data-action="register-event" data-id="' + esc(e.id) + '">Register for this event</button>'
                : '<span class="badge badge-line" style="align-self:center">Registration is closed</span>'))
        : '<a class="btn btn-green btn-sm" href="#/login">Sign in to register</a>') +
      '</div>';

    openModal({
      eyebrow: e.status === 'Upcoming' ? 'Upcoming event' : 'Past event',
      title: e.title,
      sub: [fmtDate(e.date), e.time, e.venue || e.location].filter(Boolean).join(' \u00b7 '),
      body: body,
      foot: '<button class="btn btn-outline" data-action="close-modal">Close</button>'
    });
  }

  function openTaskModal() {
    openModal({
      eyebrow: 'Directorate', title: 'Assign a new task',
      body: '<form id="task-form"><div class="form-grid">' +
        '<label class="field full"><span>Task title</span><input name="title" required placeholder="e.g. Prepare volunteer briefing notes"></label>' +
        '<label class="field"><span>Assign to</span><select name="owner">' + S.people.map(function (p) { return '<option>' + esc(p.name) + '</option>'; }).join('') + '</select></label>' +
        '<label class="field"><span>Directorate</span><select name="directorate">' + S.directorates.map(function (d) { return '<option>' + esc(d.name) + '</option>'; }).join('') + '</select></label>' +
        '<label class="field"><span>Due date</span><input name="due" type="date" value="' + window.YPDC.today() + '"></label>' +
        '<label class="field"><span>Priority</span><select name="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></label>' +
        '</div></form>',
      foot: '<button class="btn btn-outline" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-green" id="task-save">Assign task</button>'
    });
    $('#task-save').addEventListener('click', function () {
      var f = $('#task-form'); if (!f.reportValidity()) return;
      var d = {}; $$('input,select', f).forEach(function (el) { if (el.name) d[el.name] = el.value; });
      A.addTask({ title: d.title, owner: d.owner, role: 'member', directorate: d.directorate, due: d.due, status: 'Pending', priority: d.priority });
      closeModal(); toast('Task assigned to ' + d.owner); render();
    });
  }

  var ACCOUNT_ROLES = ['student', 'member', 'directorate', 'faculty', 'admin', 'alumni'];

  function openPersonModal() {
    var api = window.YPDC.api;
    var server = !!(api && api.available);
    openModal({
      eyebrow: 'Admin · People', title: server ? 'Create account' : 'Add member',
      body: '<form id="person-form"><div class="form-grid">' +
        '<label class="field"><span>Full name</span><input name="name" required></label>' +
        '<label class="field"><span>Email</span><input name="email" type="email" required placeholder="name@uon.edu.pk"></label>' +
        '<label class="field"><span>Program</span><input name="program" placeholder="BSCS · Sem 3"></label>' +
        (server
          ? '<label class="field"><span>Role (login role)</span><select name="role">' + ACCOUNT_ROLES.map(function (r) { return '<option>' + r + '</option>'; }).join('') + '</select></label>' +
            '<label class="field full"><span>Password (for login)</span><input name="password" type="text" required placeholder="At least 8 chars, letters + a number"></label>' +
            '<div class="panel-note full">This creates a real account in the database — the person can log in with this email/password.</div>'
          : '<label class="field"><span>Type</span><select name="type"><option>General Member</option><option>Volunteer</option></select></label>') +
        '<label class="field"><span>Directorate</span><select name="directorate">' + S.directorates.map(function (d) { return '<option>' + esc(d.name) + '</option>'; }).join('') + '</select></label>' +
        (server ? '' : '<label class="field"><span>Post</span><select name="post"><option>Member</option><option>Volunteer</option><option>Web Volunteer</option><option>Event Volunteer</option></select></label>') +
        '</div></form>',
      foot: '<button class="btn btn-outline" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-green" id="person-save">' + (server ? 'Create account' : 'Add to directory') + '</button>'
    });
    $('#person-save').addEventListener('click', function () {
      var f = $('#person-form'); if (!f.reportValidity()) return;
      var d = {}; $$('input,select', f).forEach(function (el) { if (el.name) d[el.name] = el.value; });

      if (server) {
        var btn = $('#person-save'); btn.disabled = true; btn.textContent = 'Creating…';
        api.adminCreateUser({
          name: d.name, email: d.email, role: d.role, password: d.password,
          directorate: d.directorate, program: d.program
        }).then(function () {
          return api.loadState();
        }).then(function (cols) {
          window.YPDC.loadFromServer(cols);
          closeModal(); toast('Account created: ' + d.email + ' (' + d.role + ')', true); render();
        }).catch(function (err) {
          btn.disabled = false; btn.textContent = 'Create account';
          toast(err.message || 'Account could not be created');
        });
        return;
      }

      d.batch = S.inductionDrive.batch; d.status = 'Active';
      A.addPerson(d); closeModal(); toast(d.name + ' added to the people directory'); render();
    });
  }

  function saveCabinetEditor() {
    var posts = $$('#cabinet-editor [data-post]').map(function (row) {
      return {
        title: row.querySelector('[data-field="title"]').value,
        holder: row.querySelector('[data-field="holder"]').value || 'Admin editable',
        status: row.querySelector('[data-field="status"]').value
      };
    });
    A.saveCabinet(posts);
    toast('Cabinet information saved', true);
    render();
  }
  function openCabinetModal() {
    openModal({
      eyebrow: 'Admin · Cabinet', title: 'Add executive post',
      body: '<div class="form-grid"><label class="field"><span>Post title</span><input id="cp-title" placeholder="e.g. Deputy General Secretary"></label>' +
        '<label class="field"><span>Holder name</span><input id="cp-holder" placeholder="Admin editable"></label></div>',
      foot: '<button class="btn btn-outline" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-green" id="cp-save">Add post</button>'
    });
    $('#cp-save').addEventListener('click', function () {
      var t = $('#cp-title').value; if (!t) { toast('Enter a post title'); return; }
      A.addCabinetPost({ title: t, holder: $('#cp-holder').value });
      closeModal(); toast('Executive post added'); render();
    });
  }

  var CONTENT_KEYS = {
    'info': { label: 'YPDC Information', fields: [['name', 'Short name'], ['full', 'Full name'], ['tagline', 'Tagline'], ['intro', 'Homepage intro']] },
    'vision': { label: 'Vision & Mission', fields: [['vision', 'Vision statement'], ['mission', 'Mission statement']] },
    'contact': { label: 'Contact Information', fields: [['email', 'Email'], ['phone', 'Phone'], ['office', 'Office address'], ['hours', 'Office hours']] },
    'popup': { label: 'Popup notice', fields: [['title', 'Heading'], ['text', 'Message'], ['ctaText', 'Button text'], ['ctaHref', 'Button link']] }
  };
  function openContentModal(key) {
    var cfg = CONTENT_KEYS[key] || CONTENT_KEYS.info;
    var src = key === 'contact' ? S.site.contact : (key === 'popup' ? (S.site.popup || {}) : S.site);
    openModal({
      eyebrow: 'Admin · Website content', title: cfg.label,
      sub: 'Changes appear on the public website immediately after saving.',
      body: '<form id="content-form">' +
        (key === 'popup'
          ? '<label class="switch-row"><input type="checkbox" id="popup-enabled"' + (src.enabled === false ? '' : ' checked') + '>' +
            '<span><b>Show this popup on the website</b><i>Visitors can close it with the ✕ button.</i></span></label>'
          : '') +
        cfg.fields.map(function (f) {
        return '<label class="field"><span>' + esc(f[1]) + '</span><textarea name="' + f[0] + '" style="min-height:' + (f[0] === 'intro' || f[0] === 'vision' || f[0] === 'mission' ? '120' : '70') + 'px">' + esc(src[f[0]] || '') + '</textarea></label>';
      }).join('') + '</form>',
      foot: '<button class="btn btn-outline" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-green" id="content-save">Save &amp; preview</button>'
    });
    $('#content-save').addEventListener('click', function () {
      var d = {}; $$('#content-form textarea').forEach(function (el) { d[el.name] = el.value; });
      var on = $('#popup-enabled');
      if (key === 'popup') {
        d.enabled = !!(on && on.checked);
        d.title = d.title || 'Announcement';
        S.site.popup = d; A.save();
        closeModal(); toast('Popup notice updated', true); render();
        if (App.showPopupNotice && d.enabled) setTimeout(function () { App.showPopupNotice(true); }, 220);
        return;
      }
      if (key === 'contact') { Object.keys(d).forEach(function (k) { S.site.contact[k] = d[k]; }); A.save(); } else { A.saveContent(d); }
      closeModal(); toast('Website content updated', true); render();
    });
  }

  function openPhotoModal(kind) {
    var cfg = {
      hero: { title: 'Homepage hero photo', sub: 'This picture is shown at the top of the public homepage.', multi: false },
      gallery: { title: 'Gallery photos', sub: 'These pictures fill the gallery on the homepage and the public workspace.', multi: true },
      logo: { title: 'Website logo', sub: 'Shown in the header, the portal sidebar, the login page and the browser tab.', multi: false }
    }[kind] || { title: 'Photo', sub: '', multi: false };
    openModal({
      eyebrow: 'Admin · Photos',
      title: cfg.title,
      sub: cfg.sub,
      body: '<form id="photo-form">' +
        '<label class="field"><span>Choose a picture from your device' + (cfg.multi ? ' (you can pick several)' : '') + '</span>' +
        '<input type="file" name="files" accept="image/*"' + (cfg.multi ? ' multiple' : '') + ' data-photo="' + esc(kind) + '"></label>' +
        '<p class="mut" style="font-size:.85rem">JPG, PNG or WebP. Big pictures are resized automatically (max 1400 px) so the website stays fast.</p>' +
        '</form>',
      foot: '<button class="btn btn-outline" data-action="close-modal">Cancel</button>' +
        (kind === 'hero' ? '<button class="btn btn-outline" data-action="reset-photo" data-kind="hero">Use the default photo</button>' : '') +
        (kind === 'gallery' ? '<button class="btn btn-outline" data-action="reset-photo" data-kind="gallery">Use the default gallery</button>' : '') +
        (kind === 'logo' ? '<button class="btn btn-outline" data-action="reset-photo" data-kind="logo">Use the default logo</button>' : '')
    });
  }

  function openNewsModal() {
    openModal({
      eyebrow: 'Admin · News', title: 'Publish news update',
      body: '<form id="news-form"><label class="field"><span>Headline</span><input name="title" required></label>' +
        '<label class="field"><span>Tag</span><select name="tag"><option>Membership</option><option>Events</option><option>Technology</option><option>Impact</option><option>Reports</option></select></label>' +
        '<label class="field"><span>Body</span><textarea name="body" required></textarea></label></form>',
      foot: '<button class="btn btn-outline" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-gold" id="news-save">Publish ' + I.arrow + '</button>'
    });
    $('#news-save').addEventListener('click', function () {
      var f = $('#news-form'); if (!f.reportValidity()) return;
      A.addNews({ title: $('#news-form [name=title]').value, tag: $('#news-form [name=tag]').value, body: $('#news-form [name=body]').value });
      closeModal(); toast('News published to the public website', true); render();
    });
  }

  function openProposalModal() {
    openModal({
      eyebrow: 'Directorate', title: 'Submit event proposal',
      body: '<form id="prop-form"><div class="form-grid">' +
        '<label class="field full"><span>Proposal title</span><input name="title" required placeholder="e.g. Digital Literacy for Schools"></label>' +
        '<label class="field"><span>Directorate</span><select name="directorate">' + S.directorates.map(function (d) { return '<option>' + esc(d.name) + '</option>'; }).join('') + '</select></label>' +
        '<label class="field"><span>Estimated budget (PKR)</span><input name="budget" type="number" value="25000"></label>' +
        '<label class="field full"><span>Description</span><textarea name="desc" required placeholder="What will be done, for whom and expected outcome..."></textarea></label>' +
        '</div></form>',
      foot: '<button class="btn btn-outline" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-green" id="prop-save">Submit for approval ' + I.arrow + '</button>'
    });
    $('#prop-save').addEventListener('click', function () {
      var f = $('#prop-form'); if (!f.reportValidity()) return;
      var d = {}; $$('input,select,textarea', f).forEach(function (el) { if (el.name) d[el.name] = el.value; });
      A.addProposal({ title: d.title, directorate: d.directorate, by: (S.session && S.session.name) || 'Directorate', budget: 'PKR ' + money(d.budget), desc: d.desc });
      closeModal(); toast('Proposal submitted to faculty for approval', true); render();
    });
  }

  function openCertificateIssueModal() {
    openModal({
      eyebrow: 'Admin · Certificates', title: 'Issue certificate',
      body: '<form id="cert-form"><label class="field"><span>Member name</span><input name="name" required></label>' +
        '<label class="field"><span>Certificate title</span><input name="title" required value="Certificate of Participation"></label>' +
        '<label class="field"><span>Event / Activity</span><select name="event">' + S.events.map(function (e) { return '<option>' + esc(e.title) + '</option>'; }).join('') + '</select></label></form>',
      foot: '<button class="btn btn-outline" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-gold" id="cert-save">Generate ' + I.arrow + '</button>'
    });
    $('#cert-save').addEventListener('click', function () {
      var f = $('#cert-form'); if (!f.reportValidity()) return;
      A.addCertificate({ title: $('#cert-form [name=title]').value, event: $('#cert-form [name=event]').value });
      closeModal(); toast('Certificate generated and logged', true); render();
    });
  }

  function openMentorshipModal() {
    openModal({
      eyebrow: 'Alumni Network', title: 'Request mentorship',
      body: '<form id="ment-form"><label class="field"><span>Volunteer name</span><input name="student" required></label>' +
        '<label class="field"><span>Program</span><input name="program" placeholder="BSCS · Sem 3"></label>' +
        '<label class="field"><span>Topic</span><input name="topic" required placeholder="e.g. Frontend career path"></label></form>',
      foot: '<button class="btn btn-outline" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-green" id="ment-save">Send request</button>'
    });
    $('#ment-save').addEventListener('click', function () {
      var f = $('#ment-form'); if (!f.reportValidity()) return;
      A.requestMentorship({ student: $('#ment-form [name=student]').value, program: $('#ment-form [name=program]').value || '—', topic: $('#ment-form [name=topic]').value });
      closeModal(); toast('Mentorship request created', true); render();
    });
  }

  App.openRegisterModal = openRegisterModal;
  App.openCertificateModal = openCertificateModal;
  App.openAssignModal = openAssignModal;
  App.openRoleModal = openRoleModal;
  App.openEventModal = openEventModal;
  App.openEditEventModal = openEditEventModal;
  App.openTaskModal = openTaskModal;
  App.openPersonModal = openPersonModal;
  App.saveCabinetEditor = saveCabinetEditor;
  App.openCabinetModal = openCabinetModal;
  App.openContentModal = openContentModal;
  App.openPhotoModal = openPhotoModal;
  App.openNewsModal = openNewsModal;
  App.openProposalModal = openProposalModal;
  App.openCertificateIssueModal = openCertificateIssueModal;
  App.openEventDetailModal = openEventDetailModal;
  App.openUserModal = openUserModal;
  App.openUserRoleModal = openUserRoleModal;
  App.openMentorshipModal = openMentorshipModal;
  App.modals = {
    openRegisterModal: openRegisterModal,
    openCertificateModal: openCertificateModal,
    openAssignModal: openAssignModal,
    openRoleModal: openRoleModal,
    openEventModal: openEventModal,
    openEditEventModal: openEditEventModal,
    openTaskModal: openTaskModal,
    openPersonModal: openPersonModal,
    saveCabinetEditor: saveCabinetEditor,
    openCabinetModal: openCabinetModal,
    openContentModal: openContentModal,
    openPhotoModal: openPhotoModal,
    openNewsModal: openNewsModal,
    openProposalModal: openProposalModal,
    openCertificateIssueModal: openCertificateIssueModal,
    openMentorshipModal: openMentorshipModal,
    openUserModal: openUserModal,
    openUserRoleModal: openUserRoleModal,
    openEventDetailModal: openEventDetailModal
  };
  App.openMentorshipModal = openMentorshipModal;
})();

</script>
<script>
/* js/teams.js */
(function () {
  'use strict';
  var App = window.App;
  var S = window.YPDC.state;
  var $ = App.$ || function (s, r) { return (r || document).querySelector(s); };
  var $$ = App.$$ || function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = App.esc, I = App.Icons, fmtDate = App.fmtDate, initials = App.initials;

  function toast() { return App.toast.apply(null, arguments); }
  function openModal() { return App.openModal.apply(null, arguments); }
  function closeModal() { return App.closeModal.apply(null, arguments); }
  function api() { return window.YPDC.api; }
  function live() { var a = api(); return !!(a && a.available); }

  var TEAM_ICON = {
    leader: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/><path d="M12 3v14"/></svg>',
    member: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"/><path d="M3.6 19.6c.8-3 2.7-4.5 5.4-4.5s4.6 1.5 5.4 4.5"/><path d="M17 7v6M20 10h-6"/></svg>'
  };

  function statusBadge(status) {
    var map = {
      Pending: 'badge-warn', Active: 'badge-ok', Inactive: 'badge-line', Rejected: 'badge-danger',
      Removed: 'badge-line', 'In Progress': 'badge-info', Done: 'badge-ok'
    };
    return '<span class="badge ' + (map[status] || 'badge-line') + '">' + esc(status || '—') + '</span>';
  }

  /* ---------- form plumbing: loading, validation, server errors ---------- */
  function field(name, label, opts) {
    opts = opts || {};
    var tag = opts.textarea ? 'textarea' : 'input';
    var attrs = 'name="' + name + '" id="tf-' + name + '"' + (opts.type ? ' type="' + opts.type + '"' : '') +
      (opts.required ? ' required' : '') + (opts.placeholder ? ' placeholder="' + esc(opts.placeholder) + '"' : '') +
      (opts.value ? ' value="' + esc(opts.value) + '"' : '') +
      (opts.min !== undefined ? ' min="' + opts.min + '"' : '') + (opts.max !== undefined ? ' max="' + opts.max + '"' : '') +
      (opts.maxlength ? ' maxlength="' + opts.maxlength + '"' : '');
    return '<label class="field' + (opts.full ? ' full' : '') + '"><span>' + esc(label) + (opts.required ? ' *' : '') + '</span>' +
      '<' + tag + ' ' + attrs + '>' + (opts.textarea ? '</textarea>' : '') +
      (opts.hint ? '<span class="hint">' + esc(opts.hint) + '</span>' : '') + '</label>';
  }

  function formStatus(kind, msg) {
    return '<div class="form-status is-' + kind + ' show" id="team-form-status">' + esc(msg) + '</div>';
  }

  function showStatus(kind, msg) {
    var box = $('#team-form-status');
    if (!box) return;
    box.className = 'form-status is-' + kind + ' show';
    box.textContent = msg;
  }

  function failFrom(err) {
    var msg = (err && err.message) || 'Unable to submit registration. Please try again.';
    if (err && err.status === 429) msg = msg;
    return msg;
  }

  function submitForm(btn, fn) {
    if (!btn) return;
    btn.classList.add('is-busy');
    btn.setAttribute('disabled', 'disabled');
    fn().catch(function () {}).then(function () {
      btn.classList.remove('is-busy');
      btn.removeAttribute('disabled');
    });
  }

  function values(form, names) {
    var d = {};
    names.forEach(function (n) {
      var el = $('#tf-' + n, form);
      d[n] = el ? String(el.value || '').trim() : '';
    });
    return d;
  }

  function successPanel(title, sub, teamId, extra) {
    return '<div class="team-success">' +
      '<div class="ts-ic">' + I.check + '</div>' +
      '<h3>' + esc(title) + '</h3>' +
      '<p class="mut mt-10">' + esc(sub) + '</p>' +
      (teamId ? '<div class="team-id-box"><span class="tib-k">Team ID</span><span class="tib-v">' + esc(teamId) + '</span></div>' : '') +
      (extra || '') + '</div>';
  }

  /* ---------- 1) team leader registration ---------- */
  function openTeamLeaderForm() {
    openModal({
      eyebrow: 'Teams · Section A',
      title: 'Register as Team Leader',
      sub: 'Register your team, get a unique Team ID and manage your members from your own dashboard.',
      body:
        formStatus('info', 'Fill the form below — a YPDC admin reviews the registration and activates the team.') +
        '<form id="team-leader-form" novalidate><div class="form-grid">' +
        field('name', 'Full name', { required: true, placeholder: 'e.g. Ali Khan', maxlength: 120 }) +
        field('email', 'Email', { required: true, type: 'email', placeholder: 'you@uon.edu.pk' }) +
        field('phone', 'Phone / WhatsApp', { placeholder: '0300 0000000' }) +
        field('program', 'University / Program', { required: true, placeholder: 'e.g. University of Narowal · BS CS' }) +
        field('semester', 'Semester', { placeholder: 'e.g. 5th' }) +
        field('teamName', 'Team name', { required: true, placeholder: 'e.g. Peace Builders', maxlength: 60 }) +
        field('expectedMembers', 'Expected members', { required: true, type: 'number', min: 2, max: 500, value: '10' }) +
        field('purpose', 'Team purpose', { required: true, textarea: true, full: true, maxlength: 600, placeholder: 'What will this team do for YPDC UON?' }) +
        field('description', 'Team description (optional)', { textarea: true, full: true, maxlength: 600, placeholder: 'How will the team work, where will it meet, what events will it run?' }) +
        '</div>' +
        '<div class="pf-section"><span class="pf-sec-title">Required documents</span>' +
        '<p class="pf-sec-note mut">Har registration ke liye apni photo aur ID card ki tasveer lazmi hai — camera se lein ya gallery se chunein.</p>' +
        (App.registrationDocs ? App.registrationDocs() : '') +
        '</div></form>',
      foot: '<button class="btn btn-outline" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-gold" id="team-leader-submit">Submit registration</button>'
    });

    var btn = $('#team-leader-submit');
    btn.addEventListener('click', function () {
      var form = $('#team-leader-form');
      if (!form.reportValidity()) return;
      var d = values(form, ['name', 'email', 'phone', 'program', 'semester', 'teamName', 'expectedMembers', 'purpose', 'description']);
      d.expectedMembers = Number(d.expectedMembers || 0);
      App.docValues(form, d);
      var missL = App.docsMissing(form);
      if (missL.length) { showStatus('is-err', App.docsHelp(missL)); return; }

      if (!live()) { showStatus('is-err', 'The YPDC server is not reachable right now. Please try again in a moment.'); return; }

      submitForm(btn, function () {
        return api().teamRegister(d).then(function (r) {
          openModal({
            eyebrow: 'Teams · Section A',
            title: 'Registration submitted',
            body: successPanel('Team Leader registration submitted successfully.',
              'Your team is pending admin approval. Keep this Team ID — your members will use it to join your team.',
              r.team && r.team.teamId,
              '<p class="mut mt-16" style="font-size:.86rem">Sign in with your YPDC account to open the Team Leader dashboard; approvals also arrive by email.</p>') +
              '<div class="btn-row mt-22" style="justify-content:center">' +
              '<a class="btn btn-gold" href="#/teams">Browse YPDC teams</a>' +
              '<a class="btn btn-outline" href="' + (S.session ? '#/portal' : '#/login') + '">' + (S.session ? 'Open my portal' : 'Sign in') + '</a></div>',
            foot: '<button class="btn btn-outline" data-action="close-modal">Close</button>'
          });
          toast('Team Leader registration submitted successfully.', true);
        }).catch(function (err) { showStatus('is-err', failFrom(err)); });
      });
    });
  }

  /* ---------- 2) join a team ---------- */
  function openJoinTeamForm(presetId) {
    openModal({
      eyebrow: 'Teams · Section B',
      title: 'Register as Team Member',
      sub: 'Pick an active YPDC team, add your details and the team leader will see your registration.',
      body:
        formStatus('info', 'Only active teams are shown. Type in the box to search by team name or leader.') +
        '<div id="team-picker"><div class="search-box" style="margin-bottom:14px">' + I.search +
        '<input type="search" id="team-search" placeholder="Search teams…" aria-label="Search teams"></div>' +
        '<div id="team-options" class="team-options"><div class="search-loading"><span class="spin-dot"></span>Loading teams…</div></div></div>' +
        '<form id="team-join-form" class="mt-16" novalidate><div class="form-grid">' +
        field('name', 'Full name', { required: true, maxlength: 120, placeholder: 'e.g. Ahmed Raza' }) +
        field('email', 'Email', { required: true, type: 'email', placeholder: 'you@uon.edu.pk' }) +
        field('phone', 'Phone / WhatsApp', { placeholder: '0300 0000000' }) +
        field('program', 'University / Program', { required: true, placeholder: 'e.g. University of Narowal · BA English' }) +
        field('semester', 'Semester', { placeholder: 'e.g. 3rd' }) +
        field('motivation', 'Why this team? (optional)', { textarea: true, full: true, maxlength: 400 }) +
        '</div>' +
        '<div class="pf-section"><span class="pf-sec-title">Required documents</span>' +
        '<p class="pf-sec-note mut">Apni photo aur ID card ki tasveer lazmi hai.</p>' +
        (App.registrationDocs ? App.registrationDocs() : '') +
        '</div></form>',
      foot: '<button class="btn btn-outline" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-gold" id="team-join-submit" disabled>Join team</button>'
    });

    var picked = presetId ? { teamId: presetId } : null;
    var opts = $('#team-options');
    var submitBtn = $('#team-join-submit');

    function renderOptions(list) {
      if (!list.length) {
        opts.innerHTML = '<div class="team-empty"><b>No active teams right now</b><p>Teams appear here as soon as an admin activates them. You can register your own team from Section A.</p></div>';
        return;
      }
      opts.innerHTML = list.map(function (t) {
        var on = picked && picked.teamId === t.teamId;
        return '<button type="button" class="team-option' + (on ? ' is-on' : '') + '" data-team="' + esc(t.teamId) + '" data-name="' + esc(t.name) + '">' +
          '<span class="to-ic">' + I.users + '</span>' +
          '<span class="to-tx"><b>' + esc(t.name) + '</b><small>' + esc(t.teamId) + ' · Leader ' + esc(t.leader) + ' · ' + t.members + ' member' + (t.members === 1 ? '' : 's') + '</small>' +
          (t.purpose ? '<small class="mut">' + esc(t.purpose) + '</small>' : '') + '</span>' +
          '<span class="to-check">' + (on ? I.check : '') + '</span></button>';
      }).join('');
      $$('#team-options .team-option').forEach(function (b) {
        b.addEventListener('click', function () {
          picked = { teamId: b.getAttribute('data-team'), name: b.getAttribute('data-name') };
          $$('#team-options .team-option').forEach(function (x) { x.classList.toggle('is-on', x === b); x.querySelector('.to-check').innerHTML = x === b ? I.check : ''; });
          submitBtn.removeAttribute('disabled');
        });
      });
    }

    function load(q) {
      if (!live()) { opts.innerHTML = '<div class="team-empty"><b>Server not reachable</b><p>Start the YPDC backend to load the team list.</p></div>'; return; }
      api().teamsOpen(q).then(function (r) { renderOptions((r && r.teams) || []); })
        .catch(function () { opts.innerHTML = '<div class="team-empty"><b>Unable to load teams</b><p>Please close this window and try again.</p></div>'; });
    }
    load('');
    if (picked) submitBtn.removeAttribute('disabled');

    var searchTimer = null;
    $('#team-search').addEventListener('input', function (e) {
      var q = e.target.value.trim();
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { load(q); }, 260);
    });

    submitBtn.addEventListener('click', function () {
      if (!picked) { showStatus('is-err', 'Please choose a team first.'); return; }
      var form = $('#team-join-form');
      if (!form.reportValidity()) return;
      var d = values(form, ['name', 'email', 'phone', 'program', 'semester', 'motivation']);
      App.docValues(form, d);
      var missM = App.docsMissing(form);
      if (missM.length) { showStatus('is-err', App.docsHelp(missM)); return; }
      if (!live()) { showStatus('is-err', 'The YPDC server is not reachable right now. Please try again in a moment.'); return; }

      submitForm(submitBtn, function () {
        return api().teamJoin(picked.teamId, d).then(function (r) {
          openModal({
            eyebrow: 'Teams · Section B',
            title: 'Registration submitted',
            body: successPanel('Team member registration submitted successfully.',
              'You asked to join ' + picked.name + '. The team leader will review your registration.',
              picked.teamId,
              '<p class="mut mt-16" style="font-size:.86rem">Approved members appear in the team dashboard and get a notification.</p>') +
              '<div class="btn-row mt-22" style="justify-content:center">' +
              '<a class="btn btn-gold" href="#/teams">See all teams</a>' +
              '<a class="btn btn-outline" href="' + (S.session ? '#/portal' : '#/login') + '">' + (S.session ? 'Open my portal' : 'Sign in') + '</a></div>',
            foot: '<button class="btn btn-outline" data-action="close-modal">Close</button>'
          });
          toast('Team member registration submitted successfully.', true);
        }).catch(function (err) { showStatus('is-err', failFrom(err)); });
      });
    });
  }

  /* ---------- 3) team detail (public teams page) ---------- */
  function openTeamPreview(teamId) {
    if (!live()) { toast('Start the YPDC backend to see team details.'); return; }
    api().teamGet(teamId).then(function (r) {
      var t = r.team;
      openModal({
        eyebrow: 'YPDC team · ' + t.teamId,
        title: t.name,
        sub: 'Led by ' + t.leader.name + ' · ' + t.members + ' member' + (t.members === 1 ? '' : 's') + ' · ' + t.status,
        body: '<div class="panel-note">' + esc(t.purpose || 'No purpose written yet.') + '</div>' +
          (t.description ? '<p class="mt-16" style="font-size:.94rem">' + esc(t.description) + '</p>' : '') +
          '<div class="grid g2 mt-16" style="gap:12px">' +
          '<div class="card card-tight"><span class="stat-label mut">Expected members</span><b>' + (t.expectedMembers || '—') + '</b></div>' +
          '<div class="card card-tight"><span class="stat-label mut">Created</span><b>' + fmtDate(t.createdAt) + '</b></div>' +
          '</div>',
        foot: '<button class="btn btn-outline" data-action="close-modal">Close</button>' +
          '<button class="btn btn-gold" data-action="join-team-form" data-id="' + esc(t.teamId) + '">Join this team</button>'
      });
    }).catch(function (err) { toast(failFrom(err)); });
  }

  /* ---------- live counters on the home page (real DB numbers) ---------- */
  function loadStats() {
    if (!live()) {
      $$('[data-team-live]').forEach(function (el) { el.textContent = '0'; });
      return;
    }
    api().teamsOpen('').then(function (r) {
      var list = (r && r.teams) || [];
      var members = list.reduce(function (a, t) { return a + (Number(t.members) || 0); }, 0);
      $$('[data-team-live="count"]').forEach(function (el) { el.textContent = String(list.length); });
      $$('[data-team-live="members"]').forEach(function (el) { el.textContent = String(members); });
    }).catch(function () {});
  }


  /* ---------- public team directory (#/teams) ---------- */
  function dirCard(t) {
    return '<article class="card team-dir-card">' +
      '<div class="tdc-top"><span class="badge badge-ok">' + esc(t.status || 'Active') + '</span>' +
      '<span class="tdc-id">' + esc(t.teamId || '') + '</span></div>' +
      '<h3 class="mt-12">' + esc(t.name || 'YPDC team') + '</h3>' +
      '<p class="mut tdc-lead">' + esc(t.leader || 'Team leader') + (t.program ? ' · ' + esc(t.program) : '') + '</p>' +
      '<p class="tdc-purpose">' + esc((t.purpose || t.description || '').slice(0, 150)) + '</p>' +
      '<div class="tdc-meta"><span>' + I.users + ' ' + (Number(t.members) || 0) + ' member' + ((Number(t.members) || 0) === 1 ? '' : 's') + '</span>' +
      '<span>' + I.target + ' ' + (Number(t.expected) || 0) + ' expected</span></div>' +
      '<button class="btn btn-outline btn-block mt-16" data-action="join-team-form" data-id="' + esc(t.teamId || '') + '">Join this team ' + I.arrow + '</button>' +
      '</article>';
  }

  function dirEmpty(q) {
    return '<div class="empty-block" style="grid-column:1/-1"><b>' + (q ? 'No team matches “' + esc(q) + '”' : 'No active teams right now') + '</b>' +
      '<p class="mut mt-6">' + (q ? 'Try another team or leader name.' : 'New teams appear here as soon as a YPDC admin approves them. You can start one yourself as a team leader.') + '</p>' +
      '<button class="btn btn-gold mt-16" data-action="team-leader-form">Register as Team Leader</button></div>';
  }

  var dirTimer = null;
  function loadDirectory() {
    var box = $('#team-directory');
    if (!box) return;
    var q = ($('#team-dir-search') && $('#team-dir-search').value.trim()) || '';
    if (!live()) {
      box.innerHTML = '<div class="empty-block" style="grid-column:1/-1"><b>The YPDC server is not reachable right now</b>' +
        '<p class="mut mt-6">The team list is stored on the YPDC server. Please try again in a moment.</p>' +
        '<button class="btn btn-outline mt-16" data-action="team-dir-retry">Try again</button></div>';
      return;
    }
    api().teamsOpen(q).then(function (r) {
      var list = (r && r.teams) || [];
      var count = $('#team-dir-count');
      if (count) count.textContent = list.length + (list.length === 1 ? ' active team' : ' active teams');
      box.innerHTML = list.length ? list.map(dirCard).join('') : dirEmpty(q);
    }).catch(function () {
      box.innerHTML = '<div class="empty-block" style="grid-column:1/-1"><b>Unable to load teams right now</b>' +
        '<p class="mut mt-6">Please try again in a moment.</p>' +
        '<button class="btn btn-outline mt-16" data-action="team-dir-retry">Try again</button></div>';
    });
  }
  function bindDirectory() {
    var inp = $('#team-dir-search');
    if (!inp) return;
    inp.addEventListener('input', function () {
      clearTimeout(dirTimer);
      dirTimer = setTimeout(loadDirectory, 260);
    });
  }

  App.Team = {
    loadStats: loadStats,
    openTeamLeaderForm: openTeamLeaderForm,
    loadDirectory: loadDirectory,
    bindDirectory: bindDirectory,
    openJoinTeamForm: openJoinTeamForm,
    openTeamPreview: openTeamPreview,
    statusBadge: statusBadge,
    TEAM_ICON: TEAM_ICON,
    formStatus: formStatus,
    showStatus: showStatus,
    submitForm: submitForm,
    successPanel: successPanel
  };
})();

</script>
<script>
/* js/photo-field.js */
/* =========================================================================
   photo-field.js — registration photo / ID-card picker
   Har registration mein: camera ya gallery se tasveer, server par upload.
   Server hi tay karta hai ke photo + ID card lazmi hain (client sirf madad).
   ========================================================================= */
(function () {
  'use strict';

  var App = window.App || (window.App = {});
  var MAX_SIDE = 1400;      /* badi tasveer chhoti kar ke bhejte hain */
  var MAX_BYTES = 6 * 1024 * 1024;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------- markup ---------- */
  /* opts: { name, label, hint, idCard:false } */
  App.photoField = function (opts) {
    opts = opts || {};
    var name = opts.name || 'photo';
    var label = opts.label || 'Photograph';
    var hint = opts.hint || 'Camera se photo lein ya gallery se chunein.';
    var wide = opts.idCard ? ' is-wide' : '';
    return '<div class="pf' + wide + '" data-pf="' + esc(name) + '">' +
      '<div class="pf-head"><span class="pf-lbl">' + esc(label) + ' <b title="Required">*</b></span>' +
      '<span class="pf-state" data-pf-state>Required</span></div>' +
      '<div class="pf-body">' +
      '<div class="pf-prev' + (opts.idCard ? ' is-doc' : ' is-face') + '" data-pf-preview>' +
      '<span class="pf-empty">No image yet</span></div>' +
      '<div class="pf-acts">' +
      '<button type="button" class="btn btn-xs btn-outline" data-pf-act="camera">' +
      '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">' +
      '<path d="M3 8.5A2 2 0 0 1 5 6.5h1.6l1.1-2h8.6l1.1 2H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>' +
      '<circle cx="12" cy="13" r="3.4"/></svg> Camera</button>' +
      '<button type="button" class="btn btn-xs btn-outline" data-pf-act="gallery">' +
      '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">' +
      '<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 16l4.5-4.5L11 15"/><circle cx="16" cy="9" r="1.3"/></svg> Gallery</button>' +
      '<button type="button" class="btn btn-xs btn-quiet" data-pf-act="clear" hidden>Remove</button>' +
      '</div>' +
      '<p class="pf-hint mut">' + esc(hint) + '</p>' +
      '<p class="pf-err" data-pf-err hidden></p>' +
      '</div>' +
      '<input type="hidden" name="' + esc(name) + '" data-pf-value value="">' +
      '</div>';
  };

  /* registration forms ke liye dono fields ek saath */
  App.registrationDocs = function (opt) {
    opt = opt || {};
    return App.photoField({ name: 'photo', label: 'Your photograph', hint: 'Clear front-facing photo (camera ya gallery).' }) +
      App.photoField({ name: 'idCard', label: 'ID card picture', idCard: true, hint: 'University ID card ya CNIC ki saaf tasveer.' });
  };

  /* ---------- file -> chhoti JPEG ---------- */
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      if (!file) return reject(new Error('No file selected.'));
      if (!/^image\//.test(file.type || '') && !/\.(jpe?g|png|webp|gif|heic|heif)$/i.test(file.name || '')) {
        return reject(new Error('Only image files are allowed.'));
      }
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth || img.width;
        var h = img.naturalHeight || img.height;
        if (!w || !h) { URL.revokeObjectURL(url); return reject(new Error('That image could not be read.')); }
        var scale = Math.min(1, MAX_SIDE / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, cw, ch);
        try { ctx.drawImage(img, 0, 0, cw, ch); }
        catch (e) { URL.revokeObjectURL(url); return reject(new Error('That image format is not supported — please use JPG or PNG.')); }
        URL.revokeObjectURL(url);
        var out = canvas.toDataURL('image/jpeg', 0.82);
        var bin = atob(out.split(',')[1]);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        resolve(new Blob([bytes], { type: 'image/jpeg' }));
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('That image could not be opened. Please try another one.'));
      };
      img.src = url;
    });
  }

  function uploadBlob(blob) {
    var api = window.YPDC && window.YPDC.api;
    if (!(api && api.available && api.uploadPhoto)) return Promise.reject(new Error('The YPDC server is not reachable — please try again in a moment.'));
    if (blob.size > MAX_BYTES) return Promise.reject(new Error('That image is too large (maximum 6 MB).'));
    return api.uploadPhoto(blob);
  }

  /* ---------- behaviour ---------- */
  function setState(box, ok, msg) {
    var st = box.querySelector('[data-pf-state]');
    var err = box.querySelector('[data-pf-err]');
    var clr = box.querySelector('[data-pf-act="clear"]');
    if (st) {
      st.className = 'pf-state' + (ok ? ' is-ok' : (msg ? ' is-err' : ''));
      st.textContent = ok ? 'Uploaded ✓' : (msg ? 'Missing' : 'Required');
    }
    if (err) { err.hidden = !msg; err.textContent = msg || ''; }
    if (clr) clr.hidden = !ok;
  }

  function preview(box, url) {
    var prev = box.querySelector('[data-pf-preview]');
    if (!prev) return;
    if (url) {
      prev.classList.add('has-img');
      prev.innerHTML = '<img src="' + esc(url) + '" alt="Uploaded preview">';
    } else {
      prev.classList.remove('has-img');
      prev.innerHTML = '<span class="pf-empty">No image yet</span>';
    }
  }

  function busy(box, on, text) {
    var acts = box.querySelectorAll('[data-pf-act]');
    Array.prototype.forEach.call(acts, function (b) {
      b.disabled = !!on;
      if (b.getAttribute('data-pf-act') === 'gallery' && on) b.textContent = text || 'Uploading…';
      else if (b.getAttribute('data-pf-act') === 'gallery' && !on) b.innerHTML = b.getAttribute('data-html') || b.innerHTML;
    });
    box.classList.toggle('is-busy', !!on);
  }

  function pick(box, useCamera) {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    if (useCamera) input.setAttribute('capture', 'user');
    input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      document.body.removeChild(input);
      if (!file) return;
      var galleryBtn = box.querySelector('[data-pf-act="gallery"]');
      if (galleryBtn && !galleryBtn.getAttribute('data-html')) galleryBtn.setAttribute('data-html', galleryBtn.innerHTML);
      busy(box, true);
      shrink(file).then(uploadBlob).then(function (r) {
        var val = box.querySelector('[data-pf-value]');
        if (val) val.value = r.url;
        preview(box, r.url);
        setState(box, true, '');
        busy(box, false);
        box.dispatchEvent(new CustomEvent('pf:done', { bubbles: true, detail: { name: box.getAttribute('data-pf'), url: r.url } }));
      }).catch(function (err) {
        busy(box, false);
        if (galleryBtn && galleryBtn.getAttribute('data-html')) galleryBtn.innerHTML = galleryBtn.getAttribute('data-html');
        setState(box, false, err.message || 'Upload failed.');
      });
    });
    input.click();
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-pf-act]') : null;
    if (!btn) return;
    var box = btn.closest('[data-pf]');
    if (!box) return;
    var act = btn.getAttribute('data-pf-act');
    e.preventDefault();
    if (act === 'camera') pick(box, true);
    else if (act === 'gallery') pick(box, false);
    else if (act === 'clear') {
      var val = box.querySelector('[data-pf-value]');
      if (val) val.value = '';
      preview(box, '');
      setState(box, false, '');
    }
  });

  /* ---------- helpers used by forms ---------- */

  /* form ke andar se photo / idCard values nikalna */
  App.docValues = function (scope, out) {
    out = out || {};
    var boxes = (scope || document).querySelectorAll('[data-pf]');
    Array.prototype.forEach.call(boxes, function (box) {
      var v = box.querySelector('[data-pf-value]');
      if (v) out[v.name] = v.value;
    });
    return out;
  };

  /* lazmi check — photo aur ID card dono chahiye */
  App.docsMissing = function (scope) {
    var miss = [];
    var boxes = (scope || document).querySelectorAll('[data-pf]');
    Array.prototype.forEach.call(boxes, function (box) {
      var v = box.querySelector('[data-pf-value]');
      var name = box.getAttribute('data-pf');
      if (!v || !v.value) {
        miss.push(name === 'idCard' ? 'ID card picture' : 'Your photograph');
        setState(box, false, 'This is required — camera ya gallery se upload karein.');
      }
    });
    return miss;
  };

  App.docsHelp = function (miss) {
    if (!miss || !miss.length) return '';
    return 'Please upload: ' + miss.join(' and ') + '.';
  };
})();

</script>
<script>
/* js/popup-notice.js */
/* =========================================================================
   popup-notice.js — UON-style "Apply Now" announcement popup
   Admin dashboard se control hota hai:  Admin ▸ Website Content ▸ Popup notice
   Visitor ❌ se band kare to dobara nahi aata (jab tak admin text na badle).
   ========================================================================= */
(function () {
  'use strict';

  var App = window.App || (window.App = {});
  var KEY_PREFIX = 'ypdc_popup_seen_';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function defaults() {
    return {
      enabled: true,
      title: 'Admissions & Registrations Open',
      text: 'Bano Shaheen, YPDC membership and team registrations are open for University of Narowal students. Apply online — it only takes two minutes.',
      ctaText: 'Apply Now',
      ctaHref: '#/induction'
    };
  }

  App.popupDefaults = defaults;

  App.popupConfig = function () {
    var S = window.YPDC && window.YPDC.state ? window.YPDC.state : null;
    var p = (S && S.site && S.site.popup) || null;
    var d = defaults();
    if (!p || typeof p !== 'object') return d;
    return {
      enabled: p.enabled === undefined ? true : !!p.enabled,
      title: String(p.title || d.title),
      text: String(p.text || d.text),
      ctaText: String(p.ctaText || d.ctaText),
      ctaHref: String(p.ctaHref || d.ctaHref)
    };
  };

  function fingerprint(cfg) {
    return btoa(unescape(encodeURIComponent(cfg.title + '|' + cfg.text + '|' + cfg.ctaText + '|' + cfg.ctaHref))).slice(0, 40);
  }

  function seen(cfg) {
    try { return localStorage.getItem(KEY_PREFIX + fingerprint(cfg)) === '1'; }
    catch (e) { return false; }
  }

  function markSeen(cfg) {
    try { localStorage.setItem(KEY_PREFIX + fingerprint(cfg), '1'); } catch (e) {}
  }

  function close(el, cfg) {
    markSeen(cfg);
    if (el && el.parentNode) el.parentNode.removeChild(el);
    document.removeEventListener('keydown', el._esc);
  }

  var onPage = false;

  App.showPopupNotice = function (force) {
    if (onPage) return;
    var cfg = App.popupConfig();
    if (!cfg.enabled) return;
    var hash = location.hash || '#/';
    if (!force && hash.indexOf('#/portal') === 0) return;
    if (!force && seen(cfg)) return;
    if (document.querySelector('.ypdc-popup')) return;

    var el = document.createElement('div');
    el.className = 'ypdc-popup';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-modal', 'true');
    el.setAttribute('aria-label', 'Announcement');
    el.innerHTML =
      '<div class="ypdc-popup-backdrop" data-popup-close></div>' +
      '<div class="ypdc-popup-card">' +
      '<button class="ypdc-popup-x" type="button" data-popup-close aria-label="Close announcement">' +
      '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">' +
      '<path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
      '<div class="ypdc-popup-art" aria-hidden="true">' +
      '<span class="ppa-badge">YPDC</span>' +
      '<span class="ppa-uni">University of Narowal</span>' +
      '</div>' +
      '<div class="ypdc-popup-body">' +
      '<span class="ypdc-popup-tag">Announcement</span>' +
      '<h3>' + esc(cfg.title) + '</h3>' +
      '<p>' + esc(cfg.text) + '</p>' +
      '<div class="ypdc-popup-actions">' +
      '<a class="btn btn-gold" href="' + esc(cfg.ctaHref) + '" data-popup-go>' + esc(cfg.ctaText) + '</a>' +
      '<button class="btn btn-quiet" type="button" data-popup-close>Not now</button>' +
      '</div>' +
      '</div></div>';

    document.body.appendChild(el);
    onPage = true;
    requestAnimationFrame(function () { el.classList.add('is-in'); });

    el._esc = function (e) {
      if (e.key === 'Escape') { close(el, cfg); onPage = false; }
    };
    document.addEventListener('keydown', el._esc);

    el.addEventListener('click', function (e) {
      var go = e.target.closest ? e.target.closest('[data-popup-go]') : null;
      if (go) { markSeen(cfg); onPage = false; }
      var x = e.target.closest ? e.target.closest('[data-popup-close]') : null;
      if (x) { e.preventDefault(); close(el, cfg); onPage = false; }
    });

    var first = el.querySelector('.ypdc-popup-x');
    if (first) first.focus();
  };

  /* public pages par khud-ba-khud (thodi der baad) */
  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () { App.showPopupNotice(); }, 900);
  });
  window.addEventListener('hashchange', function () {
    setTimeout(function () { App.showPopupNotice(); }, 700);
  });
})();

</script>
<script>
/* js/bindings.js */
(function () {
  'use strict';

  function flushServer(keys, okMsg) {
    var api = window.YPDC.api;
    if (!api || !api.available || !api.snapshot) {
      toast('Saved in this browser only — the server is offline');
      render();
      return;
    }
    api.saveState(S).then(function (r) {
      var denied = (r && r.denied) || [];
      var blocked = keys.filter(function (k) { return denied.indexOf(k) > -1; });
      if (blocked.length) toast('Not allowed for the ' + S.session.role + ' role: ' + blocked.join(', '));
      else if (r && r.error) toast('Not saved: ' + r.error);
      else toast(okMsg, true);
      render();
    });
  }

  function pickPortal(id) {
    if (!id) return;
    var rail = document.querySelector('.pe-rail');
    if (!rail) return;
    window.__peRole = id;
    Array.prototype.forEach.call(rail.querySelectorAll('.pe-item'), function (b) {
      var on = b.getAttribute('data-role') === id;
      b.classList.toggle('is-on', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    var panel = document.querySelector('.pe-panel');
    if (!panel) return;
    Array.prototype.forEach.call(panel.querySelectorAll('.pe-pane'), function (pn) {
      pn.classList.toggle('is-on', pn.getAttribute('data-pane') === id);
    });
  }

  var App = window.App;
  function PC() { return window.PC; }
  var S = window.YPDC.state;
  var A = window.YPDC.actions;
  var $ = App.$, $$ = App.$$, esc = App.esc, I = App.Icons, initials = App.initials,
      roleTitle = App.roleTitle, img = App.img, fmtDate = App.fmtDate;

  /* Batch D — admin filters, pagination aur user management actions */
  function adminData() { return (window.PC && window.PC.adminData) || null; }

  function readFilters(state) {
    ['q', 'role', 'action', 'status', 'from', 'to', 'state', 'perPage'].forEach(function (k) {
      var el = document.querySelector('[data-filter="' + k + '"]');
      if (!el) return;
      if (state[k] !== undefined) state[k] = (k === 'perPage') ? Number(el.value) : el.value;
    });
    return state;
  }

  function refreshUsers() {
    var d = adminData();
    if (d) { d.usersQ.page = 1; return d.loadUsers(); }
    return Promise.resolve();
  }

  function removeUserRow(id) {
    var d = adminData();
    if (d) d.forgetUser(id);
  }

  function toast() { return App.toast.apply(null, arguments); }
  function openModal() { return App.openModal.apply(null, arguments); }
  function closeModal() { return App.closeModal.apply(null, arguments); }
  function openDrawer() { return App.openDrawer.apply(null, arguments); }
  function closeDrawer() { return App.closeDrawer.apply(null, arguments); }
  function notifList() { return App.notifList.apply(null, arguments); }
  function runSearch() { return App.runSearch.apply(null, arguments); }
  function openModalUser() { return (App.openUserModal || function () {}).apply(null, arguments); }
  function openEventDetail() { return (App.openEventDetailModal || function () {}).apply(null, arguments); }
  function openUserRole() { return (App.openUserRoleModal || function () {}).apply(null, arguments); }
  function ensurePhotos() {
    var st = window.YPDC.state;
    if (!st.site) st.site = {};
    if (!st.site.photos) st.site.photos = { hero: '', gallery: [] };
    if (!Array.isArray(st.site.photos.gallery)) st.site.photos.gallery = [];
    return st.site.photos;
  }

  function readPhoto(file, maxW, quality) {
    return new Promise(function (resolve, reject) {
      if (!file || String(file.type || '').indexOf('image/') !== 0) return reject(new Error('Please choose an image file.'));
      var fr = new FileReader();
      fr.onerror = function () { reject(new Error('Could not read that file.')); };
      fr.onload = function () {
        var im = new Image();
        im.onerror = function () { reject(new Error('That file is not a valid image.')); };
        im.onload = function () {
          var scale = Math.min(1, maxW / (im.width || maxW));
          var w = Math.max(1, Math.round(im.width * scale)), h = Math.max(1, Math.round(im.height * scale));
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          var ctx = c.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(im, 0, 0, w, h);
          try { resolve(c.toDataURL('image/jpeg', quality || 0.8)); } catch (e) { reject(new Error('Could not process that image.')); }
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  function afterPhotoChange(message) {
    A.save();
    toast(message, true);
    render();
  }

  function storePhoto(dataUri) {
    var api = window.YPDC.api;
    if (!api || !api.available || !api.uploadPhoto) return Promise.resolve(dataUri);
    return api.uploadPhoto(dataUri).then(function (r) { return (r && r.url) ? r.url : dataUri; })
      .catch(function () { return dataUri; });
  }

  function handlePhotoFiles(input) {
    var kind = input.getAttribute('data-photo');
    var files = Array.prototype.slice.call(input.files || []);
    if (!files.length) return;
    var photos = ensurePhotos();
    var jobs = files.map(function (fl) {
      return readPhoto(fl, kind === 'logo' ? 512 : (kind === 'gallery' ? 1100 : 1600), kind === 'logo' ? 0.92 : 0.82);
    });
    Promise.all(jobs).then(function (list) {
      return Promise.all(list.map(storePhoto));
    }).then(function (list) {
      if (kind === 'hero') { photos.hero = list[0]; }
      else if (kind === 'logo') { window.YPDC.state.site.logo = list[0]; }
      else { list.forEach(function (d) { photos.gallery.push(d); }); }
      var btn = document.querySelector('#photo-form') ? null : null;
      afterPhotoChange(kind === 'gallery' ? (list.length + ' photo' + (list.length > 1 ? 's' : '') + ' added to the gallery') :
        (kind === 'logo' ? 'Logo updated — it is live on the website' : 'Homepage photo updated'));
      closeModal();
    }).catch(function (e) {
      toast(e.message || 'Could not use that image', false);
    });
  }

  function resetPhoto(kind) {
    var st = window.YPDC.state;
    if (kind === 'hero') ensurePhotos().hero = '';
    else if (kind === 'gallery') ensurePhotos().gallery = [];
    else if (kind === 'logo') st.site.logo = '';
    afterPhotoChange(kind === 'gallery' ? 'Gallery reset to the default photos' : (kind === 'logo' ? 'Default logo restored' : 'Default photo restored'));
  }

  function removeGalleryPhoto(i) {
    var g = ensurePhotos().gallery;
    if (i < 0 || i >= g.length) return;
    g.splice(i, 1);
    afterPhotoChange('Photo removed from the gallery');
  }

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el && el.getAttribute && el.getAttribute('data-photo')) handlePhotoFiles(el);
  });

  function roleName(id) {
    var p = (S.portals || []).filter(function (x) { return x.id === id; })[0];
    return p ? p.title.replace(' Portal', '') : App.roleTitle(id);
  }

  function render() { return App.render.apply(null, arguments); }
  function openRegisterModal() { return App.openRegisterModal.apply(null, arguments); }
  function openCertificateModal() { return App.openCertificateModal.apply(null, arguments); }
  function openAssignModal() { return App.openAssignModal.apply(null, arguments); }
  function openRoleModal() { return App.openRoleModal.apply(null, arguments); }
  function openEventModal() { return App.openEventModal.apply(null, arguments); }
  function openEditEventModal() { return App.openEditEventModal.apply(null, arguments); }
  function openTaskModal() { return App.openTaskModal.apply(null, arguments); }
  function openPersonModal() { return App.openPersonModal.apply(null, arguments); }
  function saveCabinetEditor() { return App.saveCabinetEditor.apply(null, arguments); }
  function openCabinetModal() { return App.openCabinetModal.apply(null, arguments); }
  function openContentModal() { return App.openContentModal.apply(null, arguments); }
  function openNewsModal() { return App.openNewsModal.apply(null, arguments); }
  function openProposalModal() { return App.openProposalModal.apply(null, arguments); }
  function openCertificateIssueModal() { return App.openCertificateIssueModal.apply(null, arguments); }
  function openMentorshipModal() { return App.openMentorshipModal.apply(null, arguments); }
  function refreshUnreadBadge() {
    var api = window.YPDC.api;
    if (!api || !api.available) return;
    var dots = $$('.ptop [data-action="open-notifs"] .dot-count');
    var count = (api.notifUnread || 0) + (api.msgUnread || 0) + S.notifications.filter(function (n) { return !n.read; }).length;
    dots.forEach(function (dot) {
      if (count) { dot.textContent = count; dot.style.display = ''; }
      else { dot.parentNode.removeChild(dot); }
    });
    if (count) {
      $$('.ptop [data-action="open-notifs"]').forEach(function (btn) {
        if (!btn.querySelector('.dot-count')) {
          var s = document.createElement('span'); s.className = 'dot-count'; s.textContent = count; btn.appendChild(s);
        }
      });
    }
  }

  function confirmDialog(question, note, onYes) {
    openModal({
      title: 'Please confirm',
      body: '<p class="mut">' + esc(note || '') + '</p>',
      foot: '<button class="btn btn-quiet" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-danger" id="confirm-yes">' + esc(question) + '</button>'
    });
    var y = $('#confirm-yes');
    if (y) y.addEventListener('click', function () { closeModal(); onYes(); });
  }

  function bindGlobal() {
    var searchTimer = null, searchSeq = 0;
    document.addEventListener('input', function (e) {
      var input = e.target.closest('[data-search-input]');
      if (!input) return;
      var shell = input.closest('[data-search]');
      var out = $('[data-search-results]', shell);
      var q = input.value.trim();
      shell.classList.toggle('has-text', !!q);
      var api = window.YPDC.api;
      var live = !!(api && api.available && window.YPDC.state.session);
      if (!q) { out.classList.add('hide'); out.innerHTML = ''; return; }

      if (!live) {            // guest / single-file build: purana local search
        var res = runSearch(input.value);
        out.classList.remove('hide');
        out.innerHTML = res.length ? res.map(function (x) {
          return '<div class="res" data-action="goto" data-go="' + esc(x.go) + '"><span class="av" style="width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:var(--green-800);color:var(--gold);display:grid;place-items:center;font-size:.75rem;font-weight:700">' + initials(x.title) + '</span>' +
            '<div><b style="font-size:.9rem">' + esc(x.title) + '</b><small>' + esc(x.type) + ' · ' + esc(x.sub) + '</small></div></div>';
        }).join('') : '<div class="search-empty">No results for "' + esc(input.value) + '"</div>';
        return;
      }

      if (q.length < 2) {
        out.classList.remove('hide');
        out.innerHTML = '<div class="search-group"><div class="search-loading">Type one more letter…</div></div>';
        return;
      }

      out.classList.remove('hide');
      out.innerHTML = App.searchLoading();
      var seq = ++searchSeq;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        api.search(q).then(function (r) {
          if (seq !== searchSeq) return;                    // purana jawab ignore
          if (input.value.trim() !== q) return;
          out.innerHTML = App.searchGrouped(r.groups, q);
        }).catch(function (err) {
          if (seq !== searchSeq) return;
          out.innerHTML = '<div class="search-empty">' + esc(err.message || 'Search is not available right now.') + '</div>';
        });
      }, 220);
    });
    document.addEventListener('click', function (e) {
      if (e.target.closest('[data-action="search-clear"]')) {
        var shell = e.target.closest('[data-search]');
        var inp = $('[data-search-input]', shell);
        if (inp) { inp.value = ''; inp.focus(); }
        shell.classList.remove('has-text');
        var o = $('[data-search-results]', shell);
        if (o) { o.innerHTML = ''; o.classList.add('hide'); }
        e.preventDefault();
        return;
      }
      if (!e.target.closest('[data-search]')) $$('[data-search-results]').forEach(function (o) { o.classList.add('hide'); });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeModal(); closeDrawer(); $$('[data-search-results]').forEach(function (o) { o.innerHTML = ''; o.classList.add('hide'); }); }
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); var i = $('[data-search-input]'); if (i) i.focus(); }
      if (e.key === 'Enter' && e.target && e.target.matches && e.target.matches('[data-filter="q"]')) {
        e.preventDefault();
        var apply = document.querySelector('[data-action="log-apply"], [data-action="users-apply"]');
        if (apply) apply.click();
      }
    });

    document.addEventListener('submit', function (e) {
      var f = e.target.closest('[data-form]');
      if (!f) return;
      e.preventDefault();
      var kind = f.getAttribute('data-form');
      var data = {};
      $$('input,select,textarea', f).forEach(function (el) { if (el.name) data[el.name] = el.value; });

      if (kind === 'signup') {
        var sapi = window.YPDC.api;
        var sbtn = f.querySelector('button[type="submit"]');
        var errBox = function (msg) {
          var b = f.querySelector('.login-error') || document.createElement('div');
          b.className = 'panel-note login-error mt-16';
          b.style.borderColor = 'var(--danger)';
          b.textContent = msg;
          if (!b.parentNode) f.appendChild(b);
          if (sbtn) { sbtn.disabled = false; sbtn.textContent = 'Create my account'; }
        };
        if (!(sapi && sapi.available)) return errBox('Server is not running — start the backend (npm start in backend/server) to create an account.');
        if (data.password !== data.confirm) return errBox('The two passwords do not match.');
        if (String(data.name || '').trim().length < 3) return errBox('Please enter your full name.');
        if (sbtn) { sbtn.disabled = true; sbtn.textContent = 'Creating your account…'; }
        sapi.register({
          name: data.name, email: data.email, role: data.role || 'student',
          password: data.password, program: data.program, directorate: data.directorate
        }).then(function (r) {
          return sapi.loadState().then(function (cols) { window.YPDC.loadFromServer(cols); return r; });
        }).then(function (r) {
          window.__authTab = 'signin';
          S.session = { role: roleName(r.role), email: r.user.email, name: r.user.name, id: r.user.id, api: true };
          toast('Account created — welcome, ' + r.user.name, true);
          location.hash = '#/portal/' + r.role + '/dashboard';
          render();
        }).catch(function (e) {
          errBox(e.message || 'Could not create the account.');
        });
        return;
      }
      if (kind === 'announce') {
        var anapi = window.YPDC.api;
        var anbtn = f.querySelector('button[type="submit"]');
        if (!(anapi && anapi.available)) { toast('Server is not running — start the backend first.'); return; }
        if (anbtn) { anbtn.disabled = true; anbtn.textContent = 'Sending…'; }
        anapi.adminAnnounce({
          title: data.title, body: data.body, audience: data.audience,
          link: data.link || '', email: !!f.querySelector('input[name="email"]').checked
        }).then(function (r) {
          if (window.PC.adminAnnReload) window.PC.adminAnnReload();
          toast('Announcement sent to ' + r.delivered + ' account(s)' + (r.emailed ? ' · ' + r.emailed + ' email(s) queued' : ''), true);
          f.reset(); render();
        }).catch(function (e) {
          if (anbtn) { anbtn.disabled = false; anbtn.textContent = 'Send announcement'; }
          toast(e.message || 'Could not send the announcement');
        });
        return;
      }

      if (kind === 'forgot') {
        var fapi = window.YPDC.api;
        var fbtn = f.querySelector('button[type="submit"]');
        var fnote = function (msg, tone) {
          var box = f.querySelector('.login-error') || document.createElement('div');
          box.className = 'panel-note login-error mt-16';
          if (tone === 'ok') box.style.borderColor = 'var(--gold)';
          else box.style.borderColor = 'var(--danger)';
          box.innerHTML = msg;
          if (!box.parentNode) f.appendChild(box);
          if (fbtn) { fbtn.disabled = false; fbtn.textContent = 'Send reset link'; }
        };
        if (!(fapi && fapi.available)) return fnote('Server is not running — start the backend (npm start in backend/server) to reset a password.');
        if (!String(data.email || '').trim()) return fnote('Please enter your email address.');
        if (fbtn) { fbtn.disabled = true; fbtn.textContent = 'Sending…'; }
        fapi.forgotPassword(data.email).then(function (r) {
          fnote(esc(r.message || 'Check your inbox for the reset link.') +
            (r.devLink ? '<div class="mt-10" style="font-size:.82rem">No SMTP on this machine, so here is the same link: <a href="' + esc(r.devLink) + '">open reset link</a></div>' : ''), 'ok');
          toast('Reset link sent — check the inbox', true);
        }).catch(function (e) {
          fnote(esc(e.message || 'Could not send the reset link.'));
        });
        return;
      }

      if (kind === 'reset') {
        var rapi = window.YPDC.api;
        var rbtn = f.querySelector('button[type="submit"]');
        var rnote = function (msg) {
          var box = f.querySelector('.login-error') || document.createElement('div');
          box.className = 'panel-note login-error mt-16';
          box.style.borderColor = 'var(--danger)';
          box.textContent = msg;
          if (!box.parentNode) f.appendChild(box);
          if (rbtn) { rbtn.disabled = false; rbtn.textContent = 'Save new password'; }
        };
        if (!(rapi && rapi.available)) return rnote('Server is not running — start the backend to reset a password.');
        if (data.password !== data.confirm) return rnote('The two passwords do not match.');
        if (String(data.password || '').length < 8) return rnote('Password must be at least 8 characters.');
        if (rbtn) { rbtn.disabled = true; rbtn.textContent = 'Saving…'; }
        rapi.resetPassword(data.token, data.password).then(function (r) {
          toast(r.message || 'Password updated — please log in', true);
          window.__authTab = 'signin';
          location.hash = '#/login';
          render();
        }).catch(function (e) {
          rnote(e.message || 'Could not reset the password.');
        });
        return;
      }

      if (kind === 'login') {
        var api = window.YPDC.api;
        if (api && api.available) {
          var btn = f.querySelector('button[type="submit"]');
          if (btn) { btn.disabled = true; btn.textContent = 'Signing in…'; }
          api.login(data.email, data.password, data.role || 'student').then(function (r) {
            return api.loadState().then(function (cols) { window.YPDC.loadFromServer(cols); return r; });
          }).then(function (r) {
            S.session = { role: S.portals.filter(function (p) { return p.id === r.role; })[0].title.replace(' Portal', ''), email: r.user.email, name: r.user.name, id: r.user.id, api: true };
            toast('Welcome back, ' + r.user.name, true);
            location.hash = '#/portal/' + r.role + '/dashboard';
            render();
          }).catch(function (err) {
            var box = f.querySelector('.login-error') || document.createElement('div');
            box.className = 'panel-note login-error mt-16';
            box.style.borderColor = 'var(--danger)';
            box.textContent = err.message || 'Login fail';
            if (!box.parentNode) f.appendChild(box);
            if (btn) { btn.disabled = false; btn.textContent = 'Sign in to workspace'; }
          });
          return;
        }
        var nb = f.querySelector('.login-error') || document.createElement('div');
        nb.className = 'panel-note login-error mt-16';
        nb.style.borderColor = 'var(--danger)';
        nb.textContent = 'Server is not running — start the backend to log in.';
        if (!nb.parentNode) f.appendChild(nb);
        return;
      }
      if (kind === 'admin-login') {
        var msg = document.getElementById('admin-login-msg');
        var abtn = f.querySelector('button[type="submit"]');
        if (abtn) { abtn.disabled = true; abtn.textContent = 'Checking…'; }
        window.YPDC.api.adminLogin(data.email, data.password, data.adminKey).then(function (r) {
          return window.YPDC.api.loadState().then(function (cols) { window.YPDC.loadFromServer(cols); return r; });
        }).then(function (r) {
          S.session = { role: 'Admin', email: r.user.email, name: r.user.name, id: r.user.id, api: true };
          if (msg) { msg.style.borderColor = 'var(--ok)'; msg.textContent = 'Access granted — opening the admin dashboard…'; }
          location.hash = '#/portal/admin/dashboard';
          render();
        }).catch(function (err) {
          if (msg) { msg.style.borderColor = 'var(--danger)'; msg.textContent = err.message || 'Admin login fail'; }
          if (abtn) { abtn.disabled = false; abtn.textContent = 'Unlock admin dashboard'; }
        });
        return;
      }

    document.addEventListener('click', function (e) {

      var msgEl = document.getElementById('compose-msg');

      if (!form || !api || !api.available) { if (msgEl) msgEl.textContent = 'Server is offline.'; return; }
