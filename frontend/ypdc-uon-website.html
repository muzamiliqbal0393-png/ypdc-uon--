    directorate: 'portal-directorate.jpg',
    faculty: 'portal-faculty.jpg',
    admin: 'portal-admin.jpg',
    alumni: 'portal-student.jpg',
    guest: 'portal-admin.jpg'
  };

  function heroBlock(role) {
    var h = HERO[role];
    return '<section class="phero">' +
      '<div class="phero-cover" aria-hidden="true">' +
      '<img src="' + img(PHOTO[role]) + '" alt="">' +
      '<span class="phero-cover-label">— YPDC UON</span></div>' +
      '<div class="phero-body"><div class="phero-copy">' +
      '<span class="eyebrow">' + esc(h.eyebrow) + '</span>' +
      '<h2>' + esc(h.title) + '</h2>' +
      '<p>' + esc(h.text) + '</p></div>' +
      '<div class="welcome-box"><span class="eyebrow">Welcome</span>' +
      '<h4>' + esc(h.welcome) + '</h4>' +
      '<p>Everything important for this role is organized here — current activity, quick actions, updates and progress.</p></div>' +
      '</div></section>';
  }

  function stats(items) {
    return '<section class="grid g4">' + items.map(function (s) {
      return '<div class="stat' + (s.style ? ' ' + s.style : '') + (s.zero ? ' is-zero' : '') + '">' +
        '<span class="stat-label">' + esc(s.label) + '</span>' +
        '<span class="stat-value">' + esc(s.value) + '</span>' +
        (s.ring ? '<div class="ring gold" style="--p:' + s.ring + '" data-label="' + s.ring + '%"></div>' : '') +
        (s.sub ? '<span class="stat-sub">' + esc(s.sub) + '</span>' : '') + '</div>';
    }).join('') + '</section>';
  }

  function emptyNote(title, sub, extraHTML, onDark) {
    return '<div class="empty-block' + (onDark ? ' on-dark' : '') + '"><b>' + esc(title) + '</b>' +
      (sub ? '<p class="mut mt-6">' + esc(sub) + '</p>' : '') +
      (extraHTML || '') + '</div>';
  }

  function csvCell(v) {
    var s = (v == null ? '' : String(v)).replace(/"/g, '""');
    return /[",\n]/.test(s) ? '"' + s + '"' : s;
  }
  function download(filename, text, mime) {
    try {
      var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 500);
      return true;
    } catch (e) { return false; }
  }
  function exportCsv(name, rows) {
    var csv = rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
    return download(name + '-' + new Date().toISOString().slice(0, 10) + '.csv', '\ufeff' + csv, 'text/csv;charset=utf-8');
  }
  function exportJson(name, obj) {
    return download(name + '-' + new Date().toISOString().slice(0, 10) + '.json',
      JSON.stringify(obj, null, 2), 'application/json');
  }

  function statNum(n, label, sub, extra) {
    var o = { label: label, value: String(n), sub: sub, zero: !n };
    if (extra && extra.style) o.style = extra.style;
    if (extra && extra.ring != null) o.ring = extra.ring;
    return o;
  }

  function num(n) { return String(n == null ? 0 : n); }

  function quickAccess(role) {
    return '<aside class="quick-card"><span class="eyebrow">Quick access</span>' +
      '<h3 style="color:#fff;margin-top:8px">Move faster.</h3>' +
      (QUICK[role] || []).map(function (l) {
        return '<button class="qa" style="width:100%;text-align:left" data-action="goto" data-go="#/portal/' + role + '/' + l[1] + '">' +
          esc(l[0]) + ' <span>→</span></button>';
      }).join('') + '</aside>';
  }

  function nextFocus(role) {
    var S = PC.S, fmt = PC.fmt, soon = function (a) { return (a || []).slice().sort(function (x, y) { return String(x.date || '').localeCompare(String(y.date || '')); })[0]; };
    var ev = soon((S.events || []).filter(function (e) { return e.status === 'Upcoming'; }));
    if (role === 'student' || role === 'guest') {
      if (!ev) return null;
      var place = ev.venue || ev.place || ev.location || '';
      return { title: ev.title, text: [fmt(ev.date), ev.time, place].filter(Boolean).join(' · ') };
    }
    if (role === 'member') {
      var duty = soon(S.duties) || soon((S.tasks || []).filter(function (t) { return t.status !== 'Done'; }));
      if (!duty) return null;
      return duty.event ? { title: duty.title || duty.event, text: duty.event + ' · ' + fmt(duty.date) + ' · ' + (duty.time || '') } : { title: duty.title || 'Task', text: (duty.status || '') + ' · ' + fmt(duty.date) };
    }
    if (role === 'directorate') {
      var w = (S.workplan || []).filter(function (x) { return Number(x.progress) < 100; })[0];
      return w ? { title: w.objective, text: (w.owner || '') + ' · ' + (w.quarter || '') + ' · ' + w.progress + '% complete' } : null;
    }
    if (role === 'faculty') {
      var a = (S.facultyActivities || []).filter(function (x) { return x.status === 'Pending'; })[0];
      return a ? { title: a.title, text: (a.directorate || '') + ' · ' + (a.students || 0) + ' students · ' + fmt(a.date) } : null;
    }
    if (role === 'admin') {
      var p = (S.applications || []).filter(function (x) { return x.status === 'New' || x.status === 'Pending'; })[0];
      return p ? { title: p.name + ' — ' + (p.program || 'Application'), text: 'Induction application · ' + fmt(p.date) } : null;
    }
    if (role === 'alumni') {
      var m = (S.mentorship || [])[0];
      return m ? { title: m.topic || 'Mentorship request', text: (m.student || '') + ' · ' + (m.program || '') } : null;
    }
    return null;
  }

  function focusPanel(role) {
    var f = nextFocus(role);
    var title = f ? f.title : 'No activity scheduled yet';
    var text = f ? f.text : 'Nothing is listed for you right now — as soon as real records are added (events, duties, tasks, applications), your next focus appears here.';
    return '<div class="panel focus-panel">' +
      '<div class="focus-media"><img src="' + img(PHOTO[role]) + '" alt="YPDC UON"></div>' +
      '<div class="panel-body">' +
      '<span class="eyebrow">Next focus</span><h3 class="mt-10">' + esc(title) + '</h3>' +
      '<p class="mut mt-10">' + esc(text) + '</p>' +
      '</div></div>';
  }

  function pageHead(eyebrow, title, sub, actionHTML) {
    return '<div class="flex-between flex-wrap"><div class="page-title">' +
      '<span class="eyebrow">' + esc(eyebrow) + '</span><h2 class="mt-6">' + esc(title) + '</h2>' +
      (sub ? '<p class="mut mt-6" style="max-width:70ch">' + esc(sub) + '</p>' : '') + '</div>' +
      (actionHTML ? '<div class="btn-row">' + actionHTML + '</div>' : '') + '</div>';
  }

  function table(head, rows, minW) {
    if (!rows || !rows.length) {
      return emptyNote('No records yet', 'Records appear here as soon as data is added from the admin panel.',
        '<div class="btn-row mt-16" style="justify-content:center"><a class="btn btn-outline btn-sm" href="#/portal/admin/dashboard">Admin panel</a></div>');
    }
    return '<div class="table-wrap"><table class="table"' + (minW ? ' style="min-width:' + minW + 'px"' : '') + '>' +
      '<thead><tr>' + head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead>' +
      '<tbody>' + rows.map(function (r) {
        return '<tr>' + r.map(function (c, i) {
          return '<td data-label="' + esc(head[i] || '') + '">' + c + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
  }

  function statusBadge(s) {
    var map = { 'Active': 'badge-ok', 'Approved': 'badge-ok', 'Done': 'badge-ok', 'Published': 'badge-gold', 'Completed': 'badge-ok', 'Issued': 'badge-ok', 'Present': 'badge-ok', 'Registered': 'badge-info', 'Upcoming': 'badge-info', 'In Progress': 'badge-info', 'Pending': 'badge-warn', 'Pending confirmation': 'badge-warn', 'Shortlisted': 'badge-warn', 'Changes Requested': 'badge-warn', 'Processing': 'badge-warn', 'Draft': 'badge-warn', 'At Risk': 'badge-warn', 'New': 'badge-info', 'Requested': 'badge-info', 'Scheduled': 'badge-info', 'Assigned': 'badge-info', 'Rejected': 'badge-danger', 'Absent': 'badge-danger', 'Inactive': 'badge-danger', 'Open': 'badge-ok', 'On Track': 'badge-ok' };
    return '<span class="badge ' + (map[s] || 'badge-line') + '">' + esc(s) + '</span>';
  }

  function pretty(k) {
    return String(k).replace(/([A-Z])/g, ' $1').replace(/^./, function (c) { return c.toUpperCase(); })
      .replace(/^Reg$/, 'Registration No').replace(/Cgpa/i, 'CGPA');
  }
  function profileForm(role, fields) {
    var p = S.profiles[role] || {};
    return '<form data-form="profile"><input type="hidden" name="roleKey" value="' + role + '">' +
      '<div class="form-grid">' + fields.map(function (f) {
        var val = p[f[0]] == null ? '' : p[f[0]];
        var full = f[2] ? ' full' : '';
        if (f[1] === 'textarea') return '<label class="field full"><span>' + esc(pretty(f[0])) + '</span><textarea name="' + f[0] + '">' + esc(val) + '</textarea></label>';
        if (f[0] === 'email') return '<label class="field' + full + '"><span>Email (cannot be changed)</span><input name="email" value="' + esc(val) + '" readonly style="background:#F3F5F4;color:var(--muted)"></label>';
        return '<label class="field' + full + '"><span>' + esc(pretty(f[0])) + '</span><input name="' + f[0] + '" value="' + esc(val) + '"></label>';
      }).join('') + '</div>' +
      '<div class="btn-row"><button class="btn btn-green" type="submit">Save profile</button>' +
      '<button class="btn btn-outline" type="reset">Reset fields</button></div></form>';
  }

  var SEC = {};

  function taskRow(t) {
    return '<div class="list-row"><span class="av soft">' + (t.status === 'Done' ? '✓' : '!') + '</span>' +
      '<div class="txt"><b>' + esc(t.title) + '</b><small>' + esc(t.owner) + ' · due ' + fmt(t.due) + ' · ' + esc(t.priority) + ' priority</small></div>' +
      statusBadge(t.status) +
      '<button class="btn btn-xs btn-quiet" data-action="task-status" data-id="' + t.id + '" data-status="' + (t.status === 'Done' ? 'Pending' : 'Done') + '">' +
      (t.status === 'Done' ? 'Reopen' : 'Done') + '</button></div>';
  }

  /* ---- Batch E: charts (pure inline SVG — server data, koi dummy value nahi) ---- */
  var TONE = ['#0B4A24', '#2F8F5B', '#106934', '#59C17A', '#35594A', '#7FBFA0'];

  function chartCard(title, sub, svg, foot) {
    return '<section class="panel chart-card"><div class="panel-head"><h3>' + esc(title) + '</h3>' +
      (sub ? '<span class="badge badge-line">' + esc(sub) + '</span>' : '') + '</div>' +
      '<div class="panel-body">' + svg + '</div>' +
      (foot ? '<div class="panel-foot"><span class="mut" style="font-size:.84rem">' + foot + '</span></div>' : '') +
      '</section>';
  }

  function chartEmpty(msg) {
    return '<div class="chart-empty"><b>Nothing to plot yet</b><p class="mut">' + esc(msg) + '</p></div>';
  }

  // horizontal bars — {label, value, note}
  function barChart(items, opts) {
    opts = opts || {};
    var max = Math.max.apply(null, items.map(function (i) { return Number(i.value) || 0; }).concat([1]));
    if (!items.length) return chartEmpty('No rows to show.');
    return '<div class="chart-bars">' + items.map(function (it, i) {
      var v = Number(it.value) || 0;
      var pct = Math.max(v ? 3 : 0, Math.round((v / max) * 100));
      return '<div class="cbar">' +
        '<div class="cbar-top"><span>' + esc(it.label) + '</span><b>' + esc(String(v)) + (opts.unit ? ' ' + esc(opts.unit) : '') + '</b></div>' +
        '<div class="cbar-track"><span style="width:' + pct + '%;background:' + (it.tone || TONE[i % TONE.length]) + '"></span></div>' +
        (it.note ? '<div class="cbar-note mut">' + esc(it.note) + '</div>' : '') +
        '</div>';
    }).join('') + '</div>';
  }

  // donut — {label, value}, center total
  function donutChart(items, opts) {
    opts = opts || {};
    var total = items.reduce(function (a, i) { return a + (Number(i.value) || 0); }, 0);
    if (!total) return chartEmpty('No rows to show.');
    var r = 52, cx = 70, cy = 70, C = 2 * Math.PI * r, off = 0;
    var arcs = items.map(function (it, i) {
      var v = Number(it.value) || 0;
      var len = (v / total) * C;
      var seg = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + (it.tone || TONE[i % TONE.length]) + '" stroke-width="20" ' +
        'stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" ' +
        'transform="rotate(-90 ' + cx + ' ' + cy + ')"><title>' + esc(it.label) + ': ' + v + '</title></circle>';
      off += len;
      return seg;
    }).join('');
    var legend = '<div class="chart-legend">' + items.map(function (it, i) {
      var v = Number(it.value) || 0;
      return '<div class="lg-row"><span class="lg-dot" style="background:' + (it.tone || TONE[i % TONE.length]) + '"></span>' +
        '<span class="lg-label">' + esc(it.label) + '</span><b>' + v + '</b>' +
        '<span class="mut">' + Math.round((v / total) * 100) + '%</span></div>';
    }).join('') + '</div>';
    return '<div class="chart-donut"><svg viewBox="0 0 140 140" class="donut" role="img" aria-label="' + esc(opts.aria || 'Donut chart') + '">' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="#E7E0D0" stroke-width="20"></circle>' + arcs +
      '<text x="70" y="66" text-anchor="middle" class="donut-num">' + total + '</text>' +
      '<text x="70" y="84" text-anchor="middle" class="donut-cap">' + esc(opts.center || 'Total') + '</text>' +
      '</svg>' + legend + '</div>';
  }

  // grouped columns — series: [{key,label,tone}], rows: [{label, values:{key:number}}]
  function columnChart(rows, seriesList, opts) {
    opts = opts || {};
    if (!rows.length) return chartEmpty('No months to show.');
    var W = 640, H = 240, pad = 34, bottom = 42;
    var max = 1;
    rows.forEach(function (r) { seriesList.forEach(function (s) { max = Math.max(max, Number(r.values[s.key]) || 0); }); });
    var step = (W - pad * 2) / rows.length;
    var barW = Math.max(6, Math.min(18, (step - 12) / seriesList.length));
    var grid = [0, 0.25, 0.5, 0.75, 1].map(function (p) {
      var y = pad + (H - pad - bottom) * (1 - p);
      return '<line x1="' + pad + '" y1="' + y + '" x2="' + (W - pad) + '" y2="' + y + '" class="grid-line"></line>' +
        '<text x="' + (pad - 6) + '" y="' + (y + 4) + '" text-anchor="end" class="axis">' + Math.round(max * p) + '</text>';
    }).join('');
    var cols = rows.map(function (r, i) {
      var x0 = pad + i * step + (step / 2) - (barW * seriesList.length) / 2;
      var bars = seriesList.map(function (s, k) {
        var v = Number(r.values[s.key]) || 0;
        var h = Math.round(((H - pad - bottom) * v) / max);
        return '<rect x="' + (x0 + k * barW).toFixed(1) + '" y="' + (H - bottom - h) + '" width="' + barW + '" height="' + h + '" rx="2" fill="' + (s.tone || TONE[k % TONE.length]) + '">' +
          '<title>' + esc(r.label + ' · ' + s.label + ': ' + v) + '</title></rect>';
      }).join('');
      return bars + '<text x="' + (pad + i * step + step / 2).toFixed(1) + '" y="' + (H - bottom + 18) + '" text-anchor="middle" class="axis">' + esc(r.label) + '</text>';
    }).join('');
    var legend = '<div class="chart-legend inline">' + seriesList.map(function (s, k) {
      return '<span class="lg-row"><span class="lg-dot" style="background:' + (s.tone || TONE[k % TONE.length]) + '"></span>' + esc(s.label) + '</span>';
    }).join('') + '</div>';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="columns" role="img" aria-label="' + esc(opts.aria || 'Column chart') + '">' +
      grid + cols + '</svg>' + legend;
  }

  /* ---- Batch F: event calendar (monthly grid, mobile friendly) ---- */
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function todayYmd() { return ymd(new Date()); }

  function calState() {
    var Y = window.YPDC;
    if (!Y.cal || !/^\d{4}-\d{2}$/.test(Y.cal.ym || '')) {
      var n = new Date();
      Y.cal = { ym: n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') };
    }
    return Y.cal;
  }

  function shiftMonth(ym, delta) {
    var parts = ym.split('-'), d = new Date(Number(parts[0]), Number(parts[1]) - 1 + delta, 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function eventsInMonth(ym) {
    return (S.events || []).filter(function (e) { return String(e.date || '').slice(0, 7) === ym; })
      .sort(function (a, b) { return String(a.date).localeCompare(String(b.date)) || String(a.time || '').localeCompare(String(b.time || '')); });
  }

  function calChip(e) {
    return '<button class="cal-ev' + (e.status === 'Completed' ? ' past' : '') + '" data-action="cal-open" data-id="' + esc(e.id) + '" title="' +
      esc(e.title + ' \u00b7 ' + (e.time || '') + ' \u00b7 ' + (e.venue || e.location || '')) + '">' +
      '<span class="cal-dot"></span><b>' + esc(e.title) + '</b></button>';
  }

  function calendarBlock(opts) {
    opts = opts || {};
    var st = calState();
    var ym = opts.ym || st.ym;
    var parts = ym.split('-'), year = Number(parts[0]), month = Number(parts[1]) - 1;
    var first = new Date(year, month, 1);
    var start = (first.getDay() + 6) % 7;                       // Monday-first grid
    var days = new Date(year, month + 1, 0).getDate();
    var list = eventsInMonth(ym);
    var byDay = {};
    list.forEach(function (e) { var d = Number(String(e.date).slice(8, 10)); (byDay[d] = byDay[d] || []).push(e); });
    var today = todayYmd();

    var cells = '';
    for (var i = 0; i < start; i++) cells += '<div class="cal-cell cal-cell-empty"></div>';
    for (var d = 1; d <= days; d++) {
      var dateStr = ym + '-' + String(d).padStart(2, '0');
      var evs = byDay[d] || [];
      cells += '<div class="cal-cell' + (dateStr === today ? ' is-today' : '') + (evs.length ? ' has-events' : '') + '" data-day="' + dateStr + '">' +
        '<span class="cal-day">' + d + '</span>' +
        '<div class="cal-evs">' + evs.slice(0, 3).map(calChip).join('') +
        (evs.length > 3 ? '<button class="cal-more" data-action="cal-day" data-day="' + dateStr + '">+' + (evs.length - 3) + ' more</button>' : '') +
        '</div></div>';
    }
    var pad = (7 - ((start + days) % 7)) % 7;
    for (var j = 0; j < pad; j++) cells += '<div class="cal-cell cal-cell-empty"></div>';

    var agenda = list.length
      ? '<div class="cal-agenda">' + list.map(function (e) {
          return '<div class="cal-agenda-row"><span class="cal-agenda-date">' + fmt(e.date).slice(0, 6) + '</span>' +
            '<div class="txt"><b>' + esc(e.title) + '</b><small>' + esc(e.time || '') + ' \u00b7 ' + esc(e.venue || e.location || '') + ' \u00b7 ' + esc(e.status || '') + '</small></div>' +
            '<button class="btn btn-xs btn-quiet" data-action="cal-open" data-id="' + esc(e.id) + '">Details</button></div>';
        }).join('') + '</div>'
      : '<div class="cal-empty"><b>No events this month</b><p class="mut">' + esc(opts.emptyNote || 'Use the arrows to look at another month.') + '</p></div>';

    var upcoming = (S.events || []).filter(function (e) { return String(e.date || '') >= today && e.status !== 'Completed'; }).length;

    return '<section class="panel cal-panel' + (opts.mt === false ? '' : ' mt-22') + '">' +
      '<div class="panel-head cal-head"><div><h3>' + esc(opts.title || 'Event calendar') + '</h3>' +
      '<span class="mut" style="font-size:.84rem">' + MONTHS[month] + ' ' + year + ' \u00b7 ' + list.length + ' event' + (list.length === 1 ? '' : 's') +
      (upcoming ? ' \u00b7 ' + upcoming + ' upcoming' : '') + '</span></div>' +
      '<div class="cal-nav">' +
      '<button class="btn btn-xs btn-quiet" data-action="cal-prev" aria-label="Previous month">\u2039</button>' +
      '<button class="btn btn-xs btn-outline" data-action="cal-today">Today</button>' +
      '<button class="btn btn-xs btn-quiet" data-action="cal-next" aria-label="Next month">\u203a</button>' +
      '</div></div>' +
      '<div class="panel-body">' +
      '<div class="cal-wrap">' +
      '<div class="cal-grid cal-dow">' + DOW.map(function (x) { return '<div class="cal-dow-cell">' + x + '</div>'; }).join('') + '</div>' +
      '<div class="cal-grid cal-body">' + cells + '</div>' +
      '</div>' +
      '<div class="cal-list-head"><b>' + MONTHS[month] + ' ' + year + '</b>' +
      '<span class="mut" style="font-size:.82rem">Tap an event for date, venue, description and registration status.</span></div>' +
      agenda +
      '</div></section>';
  }

  window.PC = {
    S: S, A: A, esc: esc, fmt: fmt, I: I, img: img, ini: ini, PP: PP,
    NAV: NAV, HERO: HERO, QUICK: QUICK, SEC: SEC, PHOTO: PHOTO,
    heroBlock: heroBlock, stats: stats, quickAccess: quickAccess, focusPanel: focusPanel, num: num,
    pageHead: pageHead, table: table, statusBadge: statusBadge, pretty: pretty,
    profileForm: profileForm, taskRow: taskRow, statNum: statNum, emptyNote: emptyNote,
    exportCsv: exportCsv, exportJson: exportJson, download: download,
    charts: { card: chartCard, empty: chartEmpty, bars: barChart, donut: donutChart, columns: columnChart, tones: TONE },
    calendar: calendarBlock, calState: calState, shiftMonth: shiftMonth, eventsInMonth: eventsInMonth,
    monthName: function (ym) {
      var p = String(ym || '').split('-');
      return (MONTHS[Number(p[1]) - 1] || '') + ' ' + (p[0] || '');
    }
  };
})();

</script>
<script>
/* js/portals/team.js */
(function () {
  'use strict';
  /* Team Leader dashboard + Team Member view + Admin team management.
     Data har waqt /api/teams/* se aati hai — frontend sirf dikhata hai. */

  var S = window.YPDC.state;
  var A = window.YPDC.actions;
  var esc = window.App.esc, I = window.App.I, fmt = window.App.fmtDate, ini = window.App.initials;

  var state = { owner: null, loading: false, mine: null, team: null, error: null, tab: 'members', admin: null, adminLoading: false, adminFilter: { q: '', status: '', page: 1 } };

  function api() { return window.YPDC.api; }
  function live() { var a = api(); return !!(a && a.available); }
  function toast() { return window.App.toast.apply(null, arguments); }
  function openModal() { return window.App.openModal.apply(null, arguments); }
  function closeModal() { return window.App.closeModal.apply(null, arguments); }
  function panel() { return window.App.$('[data-team-panel]'); }
  function head() { return window.PC.pageHead.apply(null, arguments); }

  function statusBadge(s) { return (window.App.Team || {}).statusBadge ? window.App.Team.statusBadge(s) : '<span class="badge badge-line">' + esc(s) + '</span>'; }

  /* account badalne par purana cached team/admin data hata dete hain */
  function ownerKey() {
    var me = S.me || {};
    var ss = S.session || {};
    return String(me.email || ss.email || ss.user_email || '') + '|' + String(ss.role || me.role || '');
  }
  function sync() {
    var key = ownerKey();
    if (state.owner === key) return;
    state.owner = key;
    state.mine = null; state.team = null; state.error = null; state.tab = 'members';
    state.admin = null; state.adminFilter = { q: '', status: '', page: 1 };
  }
  function loading(label) {
    return '<div class="team-empty"><b>' + esc(label || 'Loading team data…') + '</b><p>Fetching the latest record from the YPDC server.</p></div>';
  }

  /* ---------------- shared question: kaun hoon main is team mein ---------------- */
  function load() {
    if (!live()) { state.error = 'The YPDC server is not reachable right now.'; paint(); return; }
    state.loading = true; paint();
    api().teamMine().then(function (r) {
      state.mine = r;
      state.loading = false;
      var t = r.asLeader || (r.asMember && r.asMember.team) || null;
      if (!t) { state.team = null; paint(); return Promise.resolve(); }
      return api().teamGet(t.teamId).then(function (d) { state.team = d; paint(); });
    }).catch(function (e) {
      state.loading = false;
      state.error = (e && e.message) || 'Unable to load your team.';
      paint();
    });
  }

  /* ---------------- role-aware section ---------------- */
  function section() {
    sync();
    if (!state.mine && !state.loading && !state.error) setTimeout(load, 0);
    return head('Portal', 'My Team', 'Create and manage a team as its leader, or follow your team as a member.') +
      '<div data-team-panel>' + body() + '</div>';
  }

  function body() {
    if (state.error) {
      return '<div class="team-empty"><b>Unable to load team data</b><p>' + esc(state.error) + '</p>' +
        '<button class="btn btn-outline btn-sm" data-action="team-reload">Try again</button></div>';
    }
    if (state.loading || !state.mine) return loading();

    if (!state.mine.asLeader && !state.mine.asMember) {
      return '<div class="team-empty"><b>You are not in a team yet</b>' +
        '<p>Register your own team as a leader, or join an existing YPDC team as a member.</p>' +
        '<div class="btn-row" style="justify-content:center">' +
        '<button class="btn btn-gold btn-sm" data-action="team-leader-form">Register as Team Leader</button>' +
        '<button class="btn btn-outline btn-sm" data-action="join-team-form">Join a Team</button>' +
        '</div></div>';
    }

    var asLeader = state.mine.asLeader;
    var asMember = state.mine.asMember;
    var team = state.team ? state.team.team : (asLeader || (asMember && asMember.team));
    var relation = state.team ? state.team.relation : (asLeader ? 'leader' : 'member');
    var members = (state.team && state.team.members) || [];
    var tasks = (state.team && state.team.tasks) || [];
    var canManage = relation === 'leader' || relation === 'staff';

    var head_ =
      '<div class="team-panel-head">' +
      '<div><span class="eyebrow">' + (relation === 'leader' ? 'Team Leader dashboard' : 'Team member view') + '</span>' +
      '<h3 class="mt-6">' + esc(team.name) + '</h3>' +
      '<div class="tph-id">Team ID: <b>' + esc(team.teamId) + '</b> · created ' + fmt(team.createdAt) + '</div></div>' +
      '<div class="flex" style="gap:8px;flex-wrap:wrap">' + statusBadge(team.status) +
      '<span class="badge badge-line">' + (relation === 'leader' ? 'Leader' : 'Member') + '</span>' +
      (canManage ? '<button class="btn btn-outline btn-xs" data-action="team-edit">Edit team</button>' : '') +
      '</div></div>';

    var activeCount = members.filter(function (m) { return m.status === 'Active'; }).length;
    var pendingCount = members.filter(function (m) { return m.status === 'Pending'; }).length;
    var openTasks = tasks.filter(function (t) { return t.status !== 'Done'; }).length;
    var kpis = '<div class="team-kpis">' +
      '<div class="team-kpi"><div class="tk-k">Active members</div><div class="tk-v">' + activeCount + '</div><div class="tk-s">of ' + (team.expectedMembers || '—') + ' expected</div></div>' +
      '<div class="team-kpi"><div class="tk-k">Pending requests</div><div class="tk-v">' + pendingCount + '</div><div class="tk-s">' + (canManage ? 'waiting for your approval' : 'with the team leader') + '</div></div>' +
      '<div class="team-kpi"><div class="tk-k">Open tasks</div><div class="tk-v">' + openTasks + '</div><div class="tk-s">' + tasks.length + ' total</div></div>' +
      '<div class="team-kpi"><div class="tk-k">My status</div><div class="tk-v" style="font-size:18px">' + esc(relation === 'leader' ? 'Team Leader' : (asMember ? asMember.status : team.status)) + '</div>' +
      '<div class="tk-s">' + esc(relation === 'leader' ? 'Full control of this team' : 'Assigned by the leader') + '</div></div>' +
      '</div>';

    var anns = (state.team && state.team.announcements) || [];
    var tabs = '<div class="team-tabs">' +
      '<button class="' + (state.tab === 'members' ? 'is-on' : '') + '" data-action="team-tab" data-tab="members">Members</button>' +
      '<button class="' + (state.tab === 'tasks' ? 'is-on' : '') + '" data-action="team-tab" data-tab="tasks">Tasks</button>' +
      '<button class="' + (state.tab === 'ann' ? 'is-on' : '') + '" data-action="team-tab" data-tab="ann">Announcements' +
      (anns.length ? ' <b>' + anns.length + '</b>' : '') + '</button>' +
      '<button class="' + (state.tab === 'info' ? 'is-on' : '') + '" data-action="team-tab" data-tab="info">Team info</button>' +
      '</div>';

    var pane = state.tab === 'tasks' ? tasksPane(team, tasks, relation)
      : state.tab === 'ann' ? annPane(team, anns, relation)
        : state.tab === 'info' ? infoPane(team, relation)
          : membersPane(team, members, relation);

    return head_ + kpis + tabs + pane;
  }

  function memberActions(team, m, relation) {
    if (relation !== 'leader' && relation !== 'staff') return '';
    if (m.status === 'Pending') {
      return '<button class="btn btn-xs btn-green" data-action="team-member-status" data-id="' + esc(m.id) + '" data-status="Active">Approve</button>' +
        '<button class="btn btn-xs btn-danger" data-action="team-member-remove" data-id="' + esc(m.id) + '">Remove</button>';
    }
    if (m.status === 'Active') return '<button class="btn btn-xs btn-danger" data-action="team-member-remove" data-id="' + esc(m.id) + '">Remove</button>';
    return '';
  }

  function membersPane(team, members, relation) {
    var canManage = relation === 'leader' || relation === 'staff';
    return '<section class="panel mt-22"><div class="panel-head"><h3>Team members</h3>' +
      (canManage ? '<button class="btn btn-xs btn-gold" data-action="team-add-member">+ Add member</button>' : '') +
      '</div><div class="panel-body">' +
      (members.length ? members.map(function (m) {
        return '<div class="member-row"><span class="av">' + esc(ini(m.name)) + '</span>' +
          '<div class="tx"><b>' + esc(m.name) + '</b><small>' + esc(m.email) + (m.program ? ' · ' + esc(m.program) : '') + (m.semester ? ' · ' + esc(m.semester) + ' semester' : '') + '</small></div>' +
          '<div class="mr-act">' + statusBadge(m.status) + memberActions(team, m, relation) + '</div></div>';
      }).join('') : '<div class="team-empty"><b>No team members found</b><p>Approved and pending members appear here.</p></div>') +
      '</div></section>';
  }

  function annPane(team, anns, relation) {
    var canManage = relation === 'leader' || relation === 'staff';
    var composer = canManage
      ? '<div class="panel-note"><b>New announcement</b><p>Active members see this in their portal and get a notification.</p>' +
        '<form id="team-ann-form" novalidate><div class="form-grid">' +
        '<label class="field full"><span>Title *</span><input id="ann-title" required maxlength="120" placeholder="e.g. Meeting moved to Thursday"></label>' +
        '<label class="field full"><span>Announcement *</span><textarea id="ann-body" required maxlength="2000" placeholder="Write the full announcement for your team…"></textarea></label>' +
        '</div></form><div class="form-status" id="team-ann-status"></div>' +
        '<button class="btn btn-gold btn-sm mt-12" id="team-ann-post" data-action="team-ann-post">Post announcement</button></div>'
      : '<div class="panel-note"><b>Announcements from your team leader</b><p>Only the team leader can post here.</p></div>';
    return '<section class="panel mt-22"><div class="panel-head"><h3>Team announcements</h3>' +
      '<span class="badge badge-line">' + anns.length + '</span></div><div class="panel-body">' + composer +
      (anns.length ? anns.map(function (a) {
        return '<div class="member-row"><span class="av">' + esc(ini(a.author || 'YP')) + '</span>' +
          '<div class="tx"><b>' + esc(a.title) + '</b><small>' + esc(a.author || '') + ' · ' + fmt(a.createdAt) + '</small>' +
          '<p class="ann-body">' + esc(a.body) + '</p></div>' +
          '<div class="mr-act">' + (canManage ? '<button class="btn btn-xs btn-danger" data-action="team-ann-del" data-id="' + esc(a.id) + '">Delete</button>' : '') + '</div></div>';
      }).join('') : '<div class="team-empty"><b>No announcements yet</b><p>' +
        (canManage ? 'Post the first update for your team.' : 'Your team leader has not posted anything yet.') + '</p></div>') +
      '</div></section>';
  }

  function tasksPane(team, tasks, relation) {
    var canManage = relation === 'leader' || relation === 'staff';
    var rows = tasks.map(function (t) {
      var mine = String(t.assignee || '').toLowerCase() === String((S.me && S.me.email) || '').toLowerCase();
      return '<div class="member-row"><span class="av">' + esc((t.title || '?').slice(0, 2).toUpperCase()) + '</span>' +
        '<div class="tx"><b>' + esc(t.title) + '</b><small>' + (t.assignee ? 'Assigned to ' + esc(t.assignee) : 'Whole team') +
        (t.due ? ' · due ' + fmt(t.due) : '') + ' · ' + esc(t.priority) + '</small></div>' +
        '<div class="mr-act">' + statusBadge(t.status) +
        ((canManage || mine) ? '<button class="btn btn-xs btn-quiet" data-action="team-task-status" data-id="' + esc(t.id) + '" data-status="' + (t.status === 'Done' ? 'Pending' : 'Done') + '">' + (t.status === 'Done' ? 'Reopen' : 'Mark done') + '</button>' : '') +
        (canManage ? '<button class="btn btn-xs btn-danger" data-action="team-task-delete" data-id="' + esc(t.id) + '">Delete</button>' : '') +
        '</div></div>';
    }).join('');
    return '<section class="panel mt-22"><div class="panel-head"><h3>Team tasks</h3>' +
      (canManage ? '<button class="btn btn-xs btn-gold" data-action="team-task-add">+ Add task</button>' : '') +
      '</div><div class="panel-body">' +
      (tasks.length ? rows : '<div class="team-empty"><b>No team tasks yet</b><p>' + (canManage ? 'Add the first task for your team.' : 'Your leader has not added any task yet.') + '</p></div>') +
      '</div></section>';
  }

  function infoPane(team, relation) {
    return '<section class="panel mt-22"><div class="panel-head"><h3>Team information</h3>' +
      ((relation === 'leader' || relation === 'staff') ? '<button class="btn btn-xs btn-outline" data-action="team-edit">Edit</button>' : '') +
      '</div><div class="panel-body">' +
      '<div class="kv-list">' +
      '<div class="kv"><span>Team ID</span><b>' + esc(team.teamId) + '</b></div>' +
      '<div class="kv"><span>Team name</span><b>' + esc(team.name) + '</b></div>' +
      '<div class="kv"><span>Status</span><b>' + esc(team.status) + '</b></div>' +
      '<div class="kv"><span>Leader</span><b>' + esc(team.leader.name) + '</b></div>' +
      '<div class="kv"><span>Leader email</span><b>' + esc(team.leader.email) + '</b></div>' +
      '<div class="kv"><span>Program</span><b>' + esc(team.leader.program || '—') + '</b></div>' +
      '<div class="kv"><span>Expected members</span><b>' + (team.expectedMembers || '—') + '</b></div>' +
      '<div class="kv"><span>Created</span><b>' + fmt(team.createdAt) + '</b></div>' +
      '</div>' +
      '<div class="panel-note mt-16">' + esc(team.purpose || 'No purpose written yet.') + '</div>' +
      (team.description ? '<p class="mt-16" style="font-size:.94rem">' + esc(team.description) + '</p>' : '') +
      '</div></section>';
  }

  /* ---------------- paint / bind ---------------- */
  function paint() {
    var box = panel();
    if (!box) return;
    box.innerHTML = body();
  }

  function teamId() {
    var t = state.team && state.team.team;
    return t ? t.teamId : null;
  }

  function after(fn) {
    fn.then(function () { return load(); }).catch(function (e) { toast((e && e.message) || 'Action failed'); });
  }

  function bind() {
    var root = document;
    root.addEventListener('click', function (e) {
      var t = e.target.closest('[data-action]');
      if (!t) return;
      var a = t.getAttribute('data-action');
      var id = t.getAttribute('data-id');
      if (a.indexOf('team-') !== 0 && a.indexOf('admin-team-') !== 0) return;
      if (!panel() && !window.App.$('[data-admin-teams]')) return;

      if (a === 'team-reload') { state.error = null; load(); }
      if (a === 'team-tab') { state.tab = t.getAttribute('data-tab'); paint(); }
      if (a === 'team-member-status' && teamId()) {
        after(api().teamMemberPatch(teamId(), id, { status: t.getAttribute('data-status') }));
        toast('Member status updated', true);
      }
      if (a === 'team-member-remove' && teamId()) {
        after(api().teamMemberRemove(teamId(), id));
        toast('Member removed from the team', true);
      }
      if (a === 'team-task-status' && teamId()) {
        after(api().teamTaskPatch(teamId(), id, { status: t.getAttribute('data-status') }));
        toast('Task updated', true);
      }
      if (a === 'team-task-delete' && teamId()) {
        after(api().teamTaskDelete(teamId(), id));
        toast('Task deleted', true);
      }
      if (a === 'team-ann-post') postAnnouncement();
      if (a === 'team-ann-del' && teamId()) {
        after(api().teamAnnounceDelete(teamId(), id));
        toast('Announcement removed', true);
      }
      if (a === 'team-edit') editTeam();
      if (a === 'team-add-member') addMember();
      if (a === 'team-task-add') addTask();
      if (a === 'admin-team-view') adminView(id);
      if (a === 'admin-team-status') {
        var st = t.getAttribute('data-status');
        openModal({
          title: 'Please confirm',
          body: '<p class="mut">Team <b>' + esc(t.getAttribute('data-team')) + '</b> will be marked <b>' + esc(st) + '</b>. ' +
            (st === 'Active' ? 'Approved teams appear on the public team page and accept member registrations.' : 'Inactive teams no longer accept new members.') + '</p>',
          foot: '<button class="btn btn-outline" data-action="close-modal">Cancel</button>' +
            '<button class="btn btn-green" id="admin-team-confirm">' + esc(st) + '</button>'
        });
        window.App.$('#admin-team-confirm').addEventListener('click', function () {
          closeModal();
          api().teamPatch(id, { status: st }).then(function () { toast('Team ' + st, true); adminLoad(); }).catch(function (err) { toast((err && err.message) || 'Action failed'); });
        });
      }
      if (a === 'admin-team-member-status') {
        api().teamMemberPatch(id, t.getAttribute('data-mid'), { status: t.getAttribute('data-status') })
          .then(function () { toast('Member updated', true); adminView(id); adminLoad(); })
          .catch(function (err) { toast((err && err.message) || 'Action failed'); });
      }
      if (a === 'admin-team-member-remove') {
        api().teamMemberRemove(id, t.getAttribute('data-mid'))
          .then(function () { toast('Member removed', true); adminView(id); adminLoad(); })
          .catch(function (err) { toast((err && err.message) || 'Action failed'); });
      }
      if (a === 'admin-team-delete') {
        openModal({
          title: 'Please confirm',
          body: '<p class="mut">Team <b>' + esc(t.getAttribute('data-team')) + '</b> will be deactivated (kept in the database for the record).</p>',
          foot: '<button class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-danger" id="admin-team-del">Deactivate</button>'
        });
        window.App.$('#admin-team-del').addEventListener('click', function () {
          closeModal();
          api().teamDelete(id).then(function () { toast('Team deactivated', true); adminLoad(); }).catch(function (err) { toast((err && err.message) || 'Action failed'); });
        });
      }
    });
  }

  /* ---------------- leader actions ---------------- */
  function editTeam() {
    var t = state.team && state.team.team;
    if (!t) return;
    openModal({
      eyebrow: t.teamId, title: 'Edit team',
      body: '<form id="team-edit-form" novalidate><div class="form-grid">' +
        '<label class="field full"><span>Team name</span><input id="te-name" value="' + esc(t.name) + '" maxlength="60"></label>' +
        '<label class="field"><span>Expected members</span><input id="te-expected" type="number" min="2" max="500" value="' + (t.expectedMembers || 2) + '"></label>' +
        '<label class="field full"><span>Team purpose</span><textarea id="te-purpose" maxlength="600">' + esc(t.purpose || '') + '</textarea></label>' +
        '<label class="field full"><span>Description</span><textarea id="te-desc" maxlength="600">' + esc(t.description || '') + '</textarea></label>' +
        '</div></form><div class="form-status" id="team-edit-status"></div>',
      foot: '<button class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-gold" id="team-edit-save">Save changes</button>'
    });
    var btn = window.App.$('#team-edit-save');
    btn.addEventListener('click', function () {
      btn.classList.add('is-busy'); btn.disabled = true;
      api().teamPatch(t.teamId, {
        teamName: window.App.$('#te-name').value.trim(),
        expectedMembers: Number(window.App.$('#te-expected').value || 0),
        purpose: window.App.$('#te-purpose').value.trim(),
        description: window.App.$('#te-desc').value.trim()
      }).then(function () {
        closeModal(); toast('Team updated', true); load();
      }).catch(function (err) {
        var s = window.App.$('#team-edit-status');
        s.className = 'form-status is-err show';
        s.textContent = (err && err.message) || 'Unable to save changes. Please try again.';
      }).then(function () { btn.classList.remove('is-busy'); btn.disabled = false; });
    });
  }

  function addMember() {
    var t = state.team && state.team.team;
    if (!t) return;
    openModal({
      eyebrow: t.teamId, title: 'Add team member',
      sub: 'The member is saved against ' + t.teamId + ' and can sign in later with this email.',
      body: '<form id="team-member-form" novalidate><div class="form-grid">' +
        '<label class="field"><span>Full name *</span><input id="tm-name" required maxlength="120"></label>' +
        '<label class="field"><span>Email *</span><input id="tm-email" type="email" required></label>' +
        '<label class="field"><span>Program</span><input id="tm-program" maxlength="90"></label>' +
        '<label class="field"><span>Semester</span><input id="tm-semester" maxlength="30"></label>' +
        '</div></form><div class="form-status" id="team-member-status"></div>',
      foot: '<button class="btn btn-outline" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-gold" id="team-member-save">Add member</button>'
    });
    var btn = window.App.$('#team-member-save');
    btn.addEventListener('click', function () {
      var f = window.App.$('#team-member-form');
      if (!f.reportValidity()) return;
      btn.classList.add('is-busy'); btn.disabled = true;
      api().teamJoin(t.teamId, {
        name: window.App.$('#tm-name').value.trim(),
        email: window.App.$('#tm-email').value.trim(),
        program: window.App.$('#tm-program').value.trim(),
        semester: window.App.$('#tm-semester').value.trim()
      }).then(function (r) {
        closeModal(); toast('Member added to ' + t.teamId, true); load();
        return r;
      }).catch(function (err) {
        var s = window.App.$('#team-member-status');
        s.className = 'form-status is-err show';
        s.textContent = (err && err.message) || 'Unable to add this member. Please try again.';
      }).then(function () { btn.classList.remove('is-busy'); btn.disabled = false; });
    });
  }

  function postAnnouncement() {
    var t = state.team && state.team.team;
    if (!t) return;
    var f = window.App.$('#team-ann-form');
    var btn = window.App.$('#team-ann-post');
    if (!f || !f.reportValidity()) return;
    var st = window.App.$('#team-ann-status');
    btn.classList.add('is-busy'); btn.disabled = true;
    api().teamAnnounce(t.teamId, {
      title: window.App.$('#ann-title').value.trim(),
      body: window.App.$('#ann-body').value.trim()
    }).then(function () {
      state.tab = 'ann';
      toast('Announcement posted to ' + t.teamId, true);
      load();
    }).catch(function (err) {
      st.className = 'form-status is-err show';
      st.textContent = (err && err.message) || 'Unable to post the announcement. Please try again.';
    }).then(function () { btn.classList.remove('is-busy'); btn.disabled = false; });
  }

  function addTask() {
    var t = state.team && state.team.team;
    if (!t) return;
    var members = (state.team.members || []).filter(function (m) { return m.status === 'Active'; });
    openModal({
      eyebrow: t.teamId, title: 'Add team task',
      body: '<form id="team-task-form" novalidate><div class="form-grid">' +
        '<label class="field full"><span>Task title *</span><input id="tt-title" required maxlength="140" placeholder="e.g. Prepare posters for the peace walk"></label>' +
        '<label class="field"><span>Assign to</span><select id="tt-assignee"><option value="">Whole team</option>' +
        members.map(function (m) { return '<option value="' + esc(m.email) + '">' + esc(m.name) + ' (' + esc(m.email) + ')</option>'; }).join('') +
        '</select></label>' +
        '<label class="field"><span>Due date</span><input id="tt-due" type="date"></label>' +
        '<label class="field"><span>Priority</span><select id="tt-priority"><option>Normal</option><option>High</option><option>Low</option></select></label>' +
        '<label class="field full"><span>Details</span><textarea id="tt-detail" maxlength="600"></textarea></label>' +
        '</div></form><div class="form-status" id="team-task-status"></div>',
      foot: '<button class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-gold" id="team-task-save">Add task</button>'
    });
    var btn = window.App.$('#team-task-save');
    btn.addEventListener('click', function () {
      var f = window.App.$('#team-task-form');
      if (!f.reportValidity()) return;
      btn.classList.add('is-busy'); btn.disabled = true;
      api().teamTaskAdd(t.teamId, {
        title: window.App.$('#tt-title').value.trim(),
        assignee: window.App.$('#tt-assignee').value,
        due: window.App.$('#tt-due').value,
        priority: window.App.$('#tt-priority').value,
        detail: window.App.$('#tt-detail').value.trim()
      }).then(function () {
        closeModal(); state.tab = 'tasks'; toast('Team task added', true); load();
      }).catch(function (err) {
        var s = window.App.$('#team-task-status');
        s.className = 'form-status is-err show';
        s.textContent = (err && err.message) || 'Unable to add this task.';
      }).then(function () { btn.classList.remove('is-busy'); btn.disabled = false; });
    });
  }

  /* ---------------- admin team management ---------------- */
  /* R39.0 — team leader documents (photo + ID card) */
  function teamDocs(person) {
    var items = [['Photo', person && person.photo], ['ID card', person && person.idCard]];
    var have = items.filter(function (x) { return !!x[1]; });
    if (!have.length) return '<span class="mut" style="font-size:.78rem">—</span>';
    return '<div class="doc-cell">' + have.map(function (x) {
      return '<button type="button" class="doc-thumb" data-action="view-doc" data-src="' + esc(x[1]) +
        '" data-title="' + esc(((person && person.name) || 'Member') + ' — ' + x[0]) + '" title="' + esc(x[0]) + '">' +
        '<img src="' + esc(x[1]) + '" alt="' + esc(x[0]) + '" loading="lazy"><span>' + esc(x[0]) + '</span></button>';
    }).join('') + '</div>';
  }

  function adminSection() {
    sync();
    if (!state.admin && !state.adminLoading) setTimeout(adminLoad, 0);
    return head('Admin portal', 'Team Management', 'Every team, its leader and members — search, review, approve, activate or deactivate.',
      '<button class="btn btn-outline btn-sm" data-action="refresh-data">Refresh data</button>') +
      '<div data-admin-teams>' + adminBody() + '</div>';
  }

  function adminBody() {
    if (state.adminLoading || !state.admin) return loading('Loading teams…');
    var d = state.admin;
    var c = d.counts || {};
    return '<section class="panel"><div class="panel-head"><h3>Teams</h3>' +
      '<div class="tm-counts">' +
      ['all', 'pending', 'active', 'inactive', 'rejected'].map(function (k) {
        var val = k === 'all' ? (d.total || 0) : (c[k] || 0);
        return '<span class="tm-count">' + k.charAt(0).toUpperCase() + k.slice(1) + ' <b>' + val + '</b></span>';
      }).join('') + '</div></div>' +
      '<div class="panel-body">' +
      '<div class="tm-filter">' +
      '<label class="field" style="margin-bottom:0;flex:1 1 240px"><span>Search</span>' +
      '<input id="tm-q" placeholder="Team name, leader or TEAM-001" value="' + esc(state.adminFilter.q) + '"></label>' +
      '<label class="field" style="margin-bottom:0"><span>Status</span><select id="tm-status">' +
      ['', 'Pending', 'Active', 'Inactive', 'Rejected'].map(function (s) {
        return '<option value="' + s + '"' + (state.adminFilter.status === s ? ' selected' : '') + '>' + (s || 'All statuses') + '</option>';
      }).join('') + '</select></label>' +
      '<button class="btn btn-gold btn-sm" data-action="admin-teams-filter">Apply</button>' +
      '<button class="btn btn-outline btn-sm" data-action="admin-teams-clear">Clear</button>' +
      '</div>' +
      (d.teams && d.teams.length ? '<div style="overflow:auto" class="mt-16">' + window.PC.table(
        ['Team', 'Team ID', 'Leader', 'Documents', 'Members', 'Created', 'Status', 'Actions'],
        d.teams.map(function (t) {
          return ['<b>' + esc(t.name) + '</b>', '<code>' + esc(t.teamId) + '</code>',
            esc(t.leader.name) + '<br><small class="mut">' + esc(t.leader.email) + '</small>',
            teamDocs(t.leader),
            String(t.members), fmt(t.createdAt), statusBadge(t.status),
            '<div class="btn-row" style="gap:6px">' +
            '<button class="btn btn-xs btn-quiet" data-action="admin-team-view" data-id="' + esc(t.teamId) + '">View</button>' +
            (t.status !== 'Active' ? '<button class="btn btn-xs btn-green" data-action="admin-team-status" data-id="' + esc(t.teamId) + '" data-status="Active" data-team="' + esc(t.name) + '">Activate</button>' : '') +
            (t.status === 'Active' || t.status === 'Pending' ? '<button class="btn btn-xs btn-danger" data-action="admin-team-status" data-id="' + esc(t.teamId) + '" data-status="Rejected" data-team="' + esc(t.name) + '">Reject</button>' : '') +
            (t.status !== 'Inactive' ? '<button class="btn btn-xs btn-danger" data-action="admin-team-delete" data-id="' + esc(t.teamId) + '" data-team="' + esc(t.name) + '">Deactivate</button>' : '') +
            '</div>'];
        })
      ) + '</div>' : '<div class="team-empty mt-16"><b>No teams found</b><p>' + (state.adminFilter.q || state.adminFilter.status ? 'Try a different search or status filter.' : 'Team leader registrations from the public website appear here.') + '</p></div>') +
      (d.pages > 1 ? '<div class="btn-row mt-16">' +
        '<button class="btn btn-outline btn-xs" data-action="admin-teams-page" data-page="' + Math.max(1, d.page - 1) + '">‹ Prev</button>' +
        '<span class="mut" style="align-self:center;font-size:13px">Page ' + d.page + ' of ' + d.pages + ' · ' + d.total + ' teams</span>' +
        '<button class="btn btn-outline btn-xs" data-action="admin-teams-page" data-page="' + Math.min(d.pages, d.page + 1) + '">Next ›</button></div>' : '') +
      '</div></section>';
  }

  function adminLoad() {
    if (!live()) { state.adminLoading = false; state.admin = { teams: [], total: 0, counts: {} }; paintAdmin(); return; }
    state.adminLoading = true; paintAdmin();
    var f = state.adminFilter;
    api().teamsList({ q: f.q || undefined, status: f.status || undefined, page: f.page, perPage: 20 }).then(function (d) {
      state.adminLoading = false; state.admin = d; paintAdmin();
    }).catch(function (e) {
      state.adminLoading = false;
      state.admin = { teams: [], total: 0, counts: {}, error: (e && e.message) || 'Unable to load teams.' };
      paintAdmin();
    });
  }

  function paintAdmin() {
    var box = window.App.$('[data-admin-teams]');
    if (!box) return;
    if (state.admin && state.admin.error) {
      box.innerHTML = '<div class="team-empty"><b>Unable to load teams</b><p>' + esc(state.admin.error) + '</p></div>';
      return;
    }
    box.innerHTML = adminBody();
    var q = window.App.$('#tm-q'), st = window.App.$('#tm-status');
    if (q) q.addEventListener('keydown', function (e) { if (e.key === 'Enter') { state.adminFilter.q = q.value.trim(); state.adminFilter.page = 1; adminLoad(); } });
    if (st) st.addEventListener('change', function () { state.adminFilter.status = st.value; state.adminFilter.page = 1; adminLoad(); });
  }

  function adminView(teamId) {
    api().teamGet(teamId).then(function (d) {
      var t = d.team;
      var members = d.members || [];
      var tasks = d.tasks || [];
      openModal({
        eyebrow: 'TEAM DETAILS', title: t.name, sub: t.teamId + ' · ' + t.status + ' · created ' + fmt(t.createdAt),
        body:
          '<div class="grid g2" style="gap:12px">' +
          '<div class="card card-tight"><span class="stat-label mut">Leader</span><b>' + esc(t.leader.name) + '</b><small class="mut" style="display:block">' + esc(t.leader.email) + '</small></div>' +
          '<div class="card card-tight"><span class="stat-label mut">Members</span><b>' + members.length + '</b><small class="mut" style="display:block">' + members.filter(function (m) { return m.status === 'Active'; }).length + ' active · ' + members.filter(function (m) { return m.status === 'Pending'; }).length + ' pending</small></div>' +
          '</div>' +
          '<div class="panel-note mt-16">' + esc(t.purpose || 'No purpose written.') + '</div>' +
          (t.description ? '<p class="mt-16" style="font-size:.93rem">' + esc(t.description) + '</p>' : '') +
          '<h4 class="mt-22">Members</h4>' +
          (members.length ? members.map(function (m) {
            return '<div class="member-row"><span class="av">' + esc(ini(m.name)) + '</span>' +
              '<div class="tx"><b>' + esc(m.name) + '</b><small>' + esc(m.email) + (m.program ? ' · ' + esc(m.program) : '') + ' · joined ' + fmt(m.joinedAt) + '</small></div>' +
              '<div class="mr-act">' + statusBadge(m.status) +
              (m.status === 'Pending' ? '<button class="btn btn-xs btn-green" data-action="admin-team-member-status" data-id="' + esc(t.teamId) + '" data-mid="' + esc(m.id) + '" data-status="Active">Approve</button>' : '') +
              '<button class="btn btn-xs btn-danger" data-action="admin-team-member-remove" data-id="' + esc(t.teamId) + '" data-mid="' + esc(m.id) + '">Remove</button>' +
              '</div></div>';
          }).join('') : '<p class="mut">No team members found.</p>') +
          '<h4 class="mt-22">Team tasks</h4>' +
          (tasks.length ? tasks.map(function (x) {
            return '<div class="member-row"><div class="tx"><b>' + esc(x.title) + '</b><small>' + (x.assignee ? esc(x.assignee) : 'Whole team') + (x.due ? ' · due ' + fmt(x.due) : '') + '</small></div><div class="mr-act">' + statusBadge(x.status) + '</div></div>';
          }).join('') : '<p class="mut">No team tasks yet.</p>'),
        foot: '<button class="btn btn-outline" data-action="close-modal">Close</button>' +
          (t.status !== 'Active' ? '<button class="btn btn-green" data-action="admin-team-status" data-id="' + esc(t.teamId) + '" data-status="Active" data-team="' + esc(t.name) + '">Activate team</button>' : '')
      });
    }).catch(function (e) { toast((e && e.message) || 'Unable to load this team.'); });
  }

  /* admin teams filter actions are handled here (they are team-* / admin-team-* prefixed) */
  function bindAdmin() {
    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-action]');
      if (!t) return;
      var a = t.getAttribute('data-action');
      if (a === 'admin-teams-filter') { state.adminFilter.q = (window.App.$('#tm-q') || {}).value || ''; state.adminFilter.page = 1; adminLoad(); }
      if (a === 'admin-teams-clear') { state.adminFilter = { q: '', status: '', page: 1 }; adminLoad(); }
      if (a === 'admin-teams-page') { state.adminFilter.page = Number(t.getAttribute('data-page') || 1); adminLoad(); }
    });
  }

  bind();
  bindAdmin();

  window.PC.TEAM = {
    section: section,
    adminSection: adminSection,
    reload: load,
    adminLoad: adminLoad,
    state: state
  };
  window.App.TeamPortal = window.PC.TEAM;
})();

</script>
<script>
/* js/portals/student.js */
(function () {
  'use strict';
  var PC = window.PC;

  function attPct() {
    var rows = S.attendance || [];
    var present = rows.filter(function (a) { return a.status === 'Present'; }).length;
    var absent = rows.filter(function (a) { return a.status === 'Absent'; }).length;
    return (present + absent) ? Math.round((present / (present + absent)) * 100) : 0;
  }

  var S = PC.S, A = PC.A, esc = PC.esc, fmt = PC.fmt, I = PC.I, img = PC.img, ini = PC.ini, PP = PC.PP;
  var NAV = PC.NAV, HERO = PC.HERO, QUICK = PC.QUICK, SEC = PC.SEC;
  var heroBlock = PC.heroBlock, stats = PC.stats, quickAccess = PC.quickAccess,
      focusPanel = PC.focusPanel, pageHead = PC.pageHead, table = PC.table,
      statusBadge = PC.statusBadge, pretty = PC.pretty, profileForm = PC.profileForm,
      taskRow = PC.taskRow;
  SEC.student = {
    dashboard: function () {
      var regs = S.registrations.filter(function (r) { return r.email === S.profiles.student.email; });
      return heroBlock('student') +
        stats([
          { label: 'Upcoming events', value: PC.num(S.events.filter(function (e) { return e.status === 'Upcoming'; }).length), sub: 'Open for registration' },
          { label: 'Registered', value: PC.num(regs.length), sub: 'Confirmed registrations', style: 'gold' },
          { label: 'Attendance', value: attPct() + '%', sub: 'This term', ring: attPct() },
          { label: 'Certificates', value: PC.num(S.certificates.length), sub: (S.certificates.length ? 'Issued to you' : 'No certificates yet') }
        ]) +
        '<section class="grid g23" style="align-items:start">' +
        focusPanel('student') +
        quickAccess('student') + '</section>' +
        '<div class="grid" style="gap:16px">' +
        '<div class="panel"><div class="panel-head"><h3>My registrations</h3>' +
        '<button class="btn btn-xs btn-quiet" data-action="goto" data-go="#/portal/student/registration">Register more</button></div>' +
        '<div class="panel-body" style="padding-top:6px;padding-bottom:6px">' +
        (regs.length ? regs.map(function (r) {
          var e = S.events.filter(function (x) { return x.id === r.eventId; })[0] || { title: 'Event', date: r.date, location: '—' };
          return '<div class="list-row"><span class="av">' + esc(e.title.charAt(0)) + '</span>' +
            '<div class="txt"><b>' + esc(e.title) + '</b><small>' + fmt(e.date) + ' · ' + esc(e.venue || e.location || '') + '</small></div>' +
            statusBadge(r.status) +
            '<button class="btn btn-xs btn-danger" data-action="cancel-registration" data-id="' + r.id + '">Cancel</button></div>';
        }).join('') : '<p class="mut" style="padding:14px 0">No registrations yet — browse upcoming events.</p>') +
        '</div></div>' +
        '<div class="panel"><div class="panel-head"><h3>Upcoming for you</h3></div>' +
        '<div class="panel-body grid g2" style="gap:16px">' + S.events.filter(function (e) { return e.status === 'Upcoming'; }).slice(0, 2).map(function (e) {
          return '<div class="card card-tight card-flat" style="border:1px solid var(--line)">' +
            '<span class="badge badge-info">' + esc(e.category) + '</span>' +
            '<b class="mt-10" style="display:block">' + esc(e.title) + '</b>' +
            '<div class="mut" style="font-size:.82rem;margin-top:6px">' + fmt(e.date) + ' · ' + esc(e.time) + '</div>' +
            '<div class="mut" style="font-size:.82rem">' + esc(e.venue || e.location || '') + '</div>' +
            '<button class="btn btn-green btn-xs mt-16" data-action="register-event" data-id="' + e.id + '">Register</button></div>';
        }).join('') + '</div></div>' +
        '</div>';
    },
    profile: function () {
      return pageHead('Volunteer portal', 'My Profile', 'Your academic identity, contact details and directorate preference.') +
        '<section class="grid g23" style="align-items:start"><div class="panel"><div class="panel-head"><h3>Profile information</h3><span class="badge badge-ok">Active volunteer</span></div>' +
        '<div class="panel-body">' + profileForm('student', [['name'], ['email'], ['program'], ['semester'], ['reg'], ['cgpa'], ['directorate'], ['phone'], ['city'], ['dob'], ['skills', 'textarea']]) + '</div></div>' +
        '<aside class="card card-green"><div class="flex"><span class="av" style="width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:700">' + ini(S.profiles.student.name) + '</span>' +
        '<div><b style="color:#fff;display:block">' + esc(S.profiles.student.name) + '</b><small style="color:#B9CFC7">' + esc(S.profiles.student.reg) + '</small></div></div>' +
        '<hr style="border-color:rgba(255,255,255,.16);margin:20px 0">' +
        '<div class="grid" style="gap:12px;font-size:.88rem;color:#C6D8D1">' +
        '<div>Program · <b style="color:#fff">' + esc(S.profiles.student.program) + '</b></div>' +
        '<div>Semester · <b style="color:#fff">' + esc(S.profiles.student.semester) + '</b></div>' +
        '<div>CGPA · <b style="color:#fff">' + esc(S.profiles.student.cgpa) + '</b></div>' +
        '<div>Directorate · <b style="color:#fff">' + esc(S.profiles.student.directorate) + '</b></div></div>' +
        '<div class="btn-row mt-22"><a class="btn btn-gold btn-sm" href="#/portal/student/certificates">My certificates</a></div></aside></section>';
    },
    membership: function () {
      var p = S.profiles.student;
      return pageHead('Volunteer portal', 'Membership', 'Membership status, directorate placement and benefits.') +
        '<section class="grid g23" style="align-items:start"><div class="grid" style="gap:16px">' +
        '<div class="panel"><div class="panel-head"><h3>Membership record</h3>' +
        (S.session && S.session.role ? statusBadge('Active') : '<span class="badge badge-line">Login required</span>') + '</div>' +
        '<div class="panel-body">' + table(['Field', 'Detail'], [
          ['Account', esc((S.session && S.session.email) || '—')],
          ['Directorate', esc(p.directorate || '—')],
          ['Registration no.', esc(p.reg || '—')],
          ['Program', esc(p.program || '—')],
          ['Attendance records', String((S.attendance || []).length)],
          ['Member ID', 'Available in the General Member Portal after admin approval']
        ]) + '</div>' +
        '<div class="panel-foot"><a class="btn btn-green btn-sm" href="#/induction">Apply for upgrade</a>' +
        '<a class="btn btn-outline btn-sm" href="#/membership">Public membership info</a></div></div>' +
        '<div class="panel"><div class="panel-head"><h3>Benefits</h3></div><div class="panel-body">' +
        '<ul class="checked-list">' +
        ['Priority registration for YPDC events and workshops', 'Eligibility for participation certificates', 'Access to alumni mentorship circles', 'Volunteer hours verification and appreciation awards', 'Eligibility to apply for directorate posts']
          .map(function (b) { return '<li>' + b + '</li>'; }).join('') + '</ul></div></div>' +
        '</div>' + quickAccess('student') + '</section>';
    },
    events: function () {
      return pageHead('Volunteer portal', 'Events', 'Monthly calendar plus every YPDC event with registration status and details.', '<button class="btn btn-outline btn-sm" data-action="goto" data-go="#/events">Public events page</button>') +
        PC.calendar({ title: 'Event calendar' }) +
        (S.events.length
          ? '<div class="grid g3">' + S.events.map(function (e) { return window.App.eventCard(e); }).join('') + '</div>'
          : PC.emptyNote('No events published yet', 'New events appear here once added from Admin panel → Events.'));
    },
    registration: function () {
      var regs = S.registrations;
      return pageHead('Volunteer portal', 'Event Registration', 'Register for open events — confirmation appears instantly and seats update live.') +
        '<section class="panel"><div class="panel-head"><h3>Open registration</h3><span class="badge badge-gold">' + regs.length + ' my registrations</span></div>' +
        '<div class="panel-body">' + table(['Event', 'Date', 'Venue', 'Seats', 'Status', 'Action'], S.events.filter(function (e) { return e.status === 'Upcoming'; }).map(function (e) {
          var mine = regs.filter(function (r) { return r.eventId === e.id; })[0];
          return ['<b>' + esc(e.title) + '</b>', fmt(e.date), esc(e.location), e.registered + ' / ' + e.capacity,
            mine ? statusBadge('Registered') : statusBadge('Open'),
            mine ? '<button class="btn btn-xs btn-danger" data-action="cancel-registration" data-id="' + mine.id + '">Cancel</button>'
              : '<button class="btn btn-xs btn-green" data-action="register-event" data-id="' + e.id + '">Register</button>'];
        })) + '</div></section>';
    },
    volunteer: function () {
      return pageHead('Volunteer portal', 'Volunteer', 'Apply for volunteer drives and track your service hours.', '<button class="btn btn-outline btn-sm" href="#/portal/student/attendance">Attendance</button>') +
        ((S.events.filter(function (e) { return e.status === 'Upcoming'; }).length)
          ? '<section class="grid g3">' + S.events.filter(function (e) { return e.status === 'Upcoming'; }).map(function (e) {
          return '<div class="card"><span class="badge badge-info">' + esc(e.category) + '</span>' +
            '<h4 class="mt-16">' + esc(e.title) + ' — Volunteer</h4>' +
            '<p class="mut mt-10" style="font-size:.88rem">Support registration desk, logistics or field work. Volunteers receive duty verification and certificates.</p>' +
            '<div class="flex-between mt-16"><span class="mut" style="font-size:.82rem">' + fmt(e.date) + '</span>' +
            '<button class="btn btn-xs btn-green" data-action="apply-volunteer" data-drive="' + esc(e.title) + '" data-role="Field Volunteer">Apply</button></div></div>';
        }).join('') + '</section>'
          : PC.emptyNote('No drives open yet', 'Volunteer applications appear here once an event is published from the admin panel.')) +
        '<section class="panel mt-22"><div class="panel-head"><h3>My volunteer record</h3></div><div class="panel-body">' +
        table(['Drive', 'Role', 'Hours', 'Date', 'Status'], S.volunteer.map(function (v) {
          return [esc(v.drive), esc(v.role), v.hours + ' hrs', fmt(v.date), statusBadge(v.status)];
        })) + '</div></section>';
    },
    attendance: function () {
      var present = S.attendance.filter(function (a) { return a.status === 'Present'; }).length;
      return pageHead('Volunteer portal', 'Attendance', 'Attendance record across events, with eligibility tracking.') +
        stats([
          { label: 'Overall attendance', value: attPct() + '%', sub: 'Term average', ring: attPct(), style: 'gold' },
          { label: 'Events attended', value: String(present), sub: 'Marked present' },
          { label: 'Registered upcoming', value: String(S.attendance.filter(function (a) { return a.status === 'Registered'; }).length), sub: 'Awaiting event' },
          { label: 'Absences', value: String(S.attendance.filter(function (a) { return a.status === 'Absent'; }).length), sub: 'Inform HR if genuine' }
        ]) +
        '<section class="panel mt-22"><div class="panel-head"><h3>Attendance detail</h3></div><div class="panel-body">' +
        table(['Event', 'Date', 'Status'], S.attendance.map(function (a) { return [esc(a.event), fmt(a.date), statusBadge(a.status)]; })) +
        '</div><div class="panel-foot"><span class="mut" style="font-size:.84rem">Attendance is marked by the YPDC admin and faculty — a volunteer cannot mark it for themselves.</span></div></section>';
    },
    certificates: function () {
      return pageHead('Volunteer portal', 'Certificates', 'Download and verify participation certificates issued through the portal.') +
        (S.certificates.length ? '<section class="grid g3">' + S.certificates.map(function (c) {
          return '<div class="card lift"><div class="flex-between">' + statusBadge(c.status) + '<span class="mut" style="font-size:.78rem">' + esc(c.code) + '</span></div>' +
            '<h4 class="mt-16">' + esc(c.title) + '</h4>' +
            '<p class="mut mt-10" style="font-size:.88rem">' + esc(c.event) + '<br>Issued: ' + fmt(c.date) + '</p>' +
            '<div class="btn-row mt-16"><button class="btn btn-xs btn-green" data-action="view-certificate" data-id="' + c.id + '">View / Download</button></div></div>';
        }).join('') + '</section>'
          : PC.emptyNote('No certificates yet', 'Certificates are issued here after events and volunteer work.'));
    },
    achievements: function () {
      var milestones = [];
      (S.registrations || []).forEach(function (r) { milestones.push(['Event registration — ' + (r.title || r.eventId), r.date]); });
      (S.attendance || []).forEach(function (a) { milestones.push([a.event + ' (' + a.status + ')', a.date]); });
      (S.certificates || []).forEach(function (c) { milestones.push(['Certificate — ' + (c.title || c.name || 'Issued'), c.date]); });

        '<section class="panel mt-22"><div class="panel-head"><h3>Directorate proposals</h3></div><div class="panel-body">' +
